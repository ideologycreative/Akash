/* src/css/tokens.css */
/* ============================================================
   Ideology — design tokens
   Colour rule: the interface is warm-neutral. Saturated colour
   is reserved for approval state and nothing else, so a glance
   at the grid reads as status, never as decoration.
   ============================================================ */

:root {
  /* surfaces */
  --paper:      #FBFAF8;
  --paper-2:    #F3F1ED;
  --panel:      #FFFFFF;
  --panel-2:    #FAF9F7;
  --overlay:    rgba(20,20,24,.46);

  /* ink */
  --ink:        #16161A;
  --ink-2:      #4C4C56;
  --ink-3:      #8A8A93;
  --ink-4:      #B4B3B8;

  /* structure */
  --rule:       #E5E2DC;
  --rule-2:     #D4D0C8;

  /* brand — used only for selection and the wordmark */
  --cobalt:     #1D3FD8;
  --cobalt-ink: #142C97;
  --cobalt-sub: #E9EDFC;

  /* approval states */
  --st-bozza:        #8B8B95;
  --st-bozza-sub:    #EDECEA;
  --st-revisione:    #C2410C;
  --st-revisione-sub:#FCECE2;
  --st-approvare:    #9A6B00;
  --st-approvare-sub:#FBF1D9;
  --st-approvato:    #0E7A4A;
  --st-approvato-sub:#E0F2E9;
  --st-pubblicato:   #44556B;
  --st-pubblicato-sub:#E9EDF1;

  /* ugc states */
  --ugc-idea:    #8B8B95;
  --ugc-brief:   #9A6B00;
  --ugc-girato:  #1D3FD8;
  --ugc-consegna:#0E7A4A;

  /* type */
  --font: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --fs-xs:  10.5px;
  --fs-sm:  11.5px;
  --fs-md:  13px;
  --fs-lg:  15px;
  --fs-xl:  19px;
  --fs-2xl: 26px;

  /* geometry */
  --r-cell: 10px;
  --r-ui:   7px;
  --r-pill: 999px;
  --bar-h:  52px;
  --tab-h:  42px;

  /* motion */
  --t: 140ms cubic-bezier(.2,.7,.3,1);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0F0F12;
    --paper-2:    #16161A;
    --panel:      #17171B;
    --panel-2:    #1D1D22;
    --overlay:    rgba(0,0,0,.66);
    --ink:        #F2F1EE;
    --ink-2:      #B9B8BD;
    --ink-3:      #85848C;
    --ink-4:      #5C5B63;
    --rule:       #2A2A31;
    --rule-2:     #3A3A43;
    --cobalt:     #7C8DFF;
    --cobalt-ink: #AEB9FF;
    --cobalt-sub: #1E2142;
    --st-bozza:        #9A99A3;
    --st-bozza-sub:    #26262C;
    --st-revisione:    #F0834E;
    --st-revisione-sub:#331C12;
    --st-approvare:    #D9A520;
    --st-approvare-sub:#2E2510;
    --st-approvato:    #3FBE83;
    --st-approvato-sub:#102B20;
    --st-pubblicato:   #8FA6C0;
    --st-pubblicato-sub:#1A222C;
    --ugc-idea:    #9A99A3;
    --ugc-brief:   #D9A520;
    --ugc-girato:  #7C8DFF;
    --ugc-consegna:#3FBE83;
  }
}

:root[data-theme="dark"] {
  --paper:      #0F0F12;
  --paper-2:    #16161A;
  --panel:      #17171B;
  --panel-2:    #1D1D22;
  --overlay:    rgba(0,0,0,.66);
  --ink:        #F2F1EE;
  --ink-2:      #B9B8BD;
  --ink-3:      #85848C;
  --ink-4:      #5C5B63;
  --rule:       #2A2A31;
  --rule-2:     #3A3A43;
  --cobalt:     #7C8DFF;
  --cobalt-ink: #AEB9FF;
  --cobalt-sub: #1E2142;
  --st-bozza:        #9A99A3;
  --st-bozza-sub:    #26262C;
  --st-revisione:    #F0834E;
  --st-revisione-sub:#331C12;
  --st-approvare:    #D9A520;
  --st-approvare-sub:#2E2510;
  --st-approvato:    #3FBE83;
  --st-approvato-sub:#102B20;
  --st-pubblicato:   #8FA6C0;
  --st-pubblicato-sub:#1A222C;
  --ugc-idea:    #9A99A3;
  --ugc-brief:   #D9A520;
  --ugc-girato:  #7C8DFF;
  --ugc-consegna:#3FBE83;
}

<style>
/* src/css/client.css */
/* ============================================================
   Ideology — the client link

   Calmer than the studio tool: wider margins, larger type, one
   column of attention. The client is reading, not operating, and
   half of them will be on a phone — so the actions sit under the
   content they belong to, big enough to hit with a thumb.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--paper-2);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── Header ────────────────────────────────────────────── */

.cl-head {
  position: sticky; top: 0; z-index: 30;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.cl-head-top {
  max-width: 1120px; margin: 0 auto;
  display: flex; align-items: center; gap: 13px;
  padding: 16px 20px 14px;
}
.cl-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: 0 0 auto;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800;
}
.cl-who h1 {
  margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.035em; line-height: 1.15;
}
.cl-who p { margin: 1px 0 0; font-size: 12.5px; color: var(--ink-3); }
.cl-accent { height: 3px; }

.cl-head-rows {
  max-width: 1120px; margin: 0 auto;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 11px 20px;
}
.cl-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.cl-pill {
  padding: 5px 13px; border-radius: 999px;
  border: 1px solid var(--rule-2); background: transparent;
  font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  transition: background .14s, color .14s, border-color .14s;
}
.cl-pill:hover { border-color: var(--ink-4); color: var(--ink); }
.cl-pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.cl-sel {
  appearance: none; -webkit-appearance: none;
  padding: 6px 30px 6px 12px; border-radius: 8px;
  border: 1px solid var(--rule-2); background: var(--panel);
  font-size: 12.5px; font-weight: 600; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
                    linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 16px) 14px, calc(100% - 11px) 14px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
}

/* ── Main ──────────────────────────────────────────────── */

.cl-main { max-width: 1120px; margin: 0 auto; padding: 20px 20px 70px; }

.cl-summary { margin-bottom: 20px; }
.cl-ask {
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: 13px; padding: 17px 19px;
}
.cl-ask h2 {
  margin: 0 0 5px; font-size: 17px; font-weight: 700; letter-spacing: -.025em;
  display: flex; align-items: center; gap: 8px;
}
.cl-ask p { margin: 0; font-size: 13.5px; color: var(--ink-2); line-height: 1.55; max-width: 62ch; }
.cl-ask.done { border-color: var(--st-approvato); background: var(--st-approvato-sub); }
.cl-ask.done h2 { color: var(--st-approvato); }
.cl-ask.done p { color: var(--ink-2); }

.cl-strip {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 12px;
}
.cl-count-chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 5px 11px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--rule);
  font-size: 12px; color: var(--ink-3);
}
.cl-count-chip .dot { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.cl-count-chip b { font-size: 13px; font-weight: 700; color: var(--ink); }
.cl-grow { flex: 1 1 auto; }

/* ── Cards ─────────────────────────────────────────────── */

.cl-grid {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  align-items: start;
}
.cl-card {
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--rule);
  border-radius: 13px; overflow: hidden;
}
.cl-card[data-st="approvato"]    { border-color: var(--st-approvato); }
.cl-card[data-st="in_revisione"] { border-color: var(--st-revisione); }

.cl-cell { position: relative; cursor: pointer; background: var(--paper-2); }
.cl-media {
  position: relative; width: 100%;
  aspect-ratio: var(--ratio, 4/5);
  overflow: hidden; background: var(--paper-2);
  display: flex; align-items: center; justify-content: center;
}
.cl-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cl-media.contain { background: #0C0C0F; }
.cl-media.contain img { object-fit: contain; }
.cl-ph { font-size: 12px; color: var(--ink-4); font-weight: 600; padding: 16px; text-align: center; }

.cl-mk {
  position: absolute; top: 9px; right: 9px;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 999px;
  background: rgba(16,16,20,.62); color: #fff;
  font-size: 10.5px; font-weight: 700;
  backdrop-filter: blur(6px);
}
.cl-mk i { font-style: normal; }

.cl-ed { position: absolute; inset: 0; padding: 16px 15px; display: flex; flex-direction: column; gap: 7px; }
.cl-ed .eye { font-size: 10px; font-weight: 700; opacity: .65; }
.cl-ed .tit { font-size: 19px; font-weight: 800; line-height: 1.1; letter-spacing: -.035em; flex: 1 1 auto; overflow: hidden; }
.cl-ed .rule { height: 1px; background: currentColor; opacity: .18; }
.cl-ed .sub { font-size: 11px; opacity: .65; line-height: 1.45; }

.cl-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 9px; }

.cl-badges { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.cl-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--rule-2); color: var(--ink-2);
  font-size: 10.5px; font-weight: 600; white-space: nowrap;
}
.cl-chip .dot { width: 6px; height: 6px; border-radius: 50%; }
.cl-chip.date { border-color: transparent; background: var(--paper-2); font-weight: 700; color: var(--ink); }
.cl-chip.paid { background: var(--ink); border-color: var(--ink); color: #FFD88A; font-weight: 700; }
.cl-chip.partner { background: #4A3DBA; border-color: #4A3DBA; color: #EDEBFF; font-weight: 700; }

.cl-state {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px;
  font-size: 10.5px; font-weight: 700; white-space: nowrap;
}
.cl-state .dot { width: 6px; height: 6px; border-radius: 50%; }

.cl-excerpt {
  font-size: 13.5px; line-height: 1.55; color: var(--ink-2);
  white-space: pre-wrap; word-break: break-word;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
/* The full caption, shown while the pointer is on the content. */
.cap-pop {
  position: fixed; z-index: 450;
  padding: 12px 14px; border-radius: 10px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule-2);
  box-shadow: 0 12px 36px rgba(0,0,0,.2);
  font-size: 13.5px; line-height: 1.6;
  white-space: pre-wrap; word-break: break-word;
  max-height: 60vh; overflow-y: auto;
  pointer-events: none;
}

.cl-note {
  padding: 9px 11px; border-radius: 9px;
  background: var(--st-revisione-sub);
  border-left: 3px solid var(--st-revisione);
  font-size: 12.5px; line-height: 1.5; color: var(--ink-2);
}
.cl-note b { display: block; font-size: 11px; color: var(--st-revisione); margin-bottom: 2px; }
.cl-note span { white-space: pre-wrap; word-break: break-word; }
.cl-note.small { font-size: 12px; }

/* ── Actions ───────────────────────────────────────────── */

.cl-actions {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 11px 14px; border-top: 1px solid var(--rule);
  background: var(--panel-2);
}
.cl-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px;
  border: 1px solid var(--rule-2); border-radius: 9px;
  background: var(--panel); color: var(--ink);
  font-size: 13px; font-weight: 600; white-space: nowrap;
  transition: background .14s, border-color .14s, color .14s;
}
.cl-btn:hover { border-color: var(--ink-4); background: var(--paper-2); }
.cl-btn.primary {
  flex: 1 1 auto;
  background: var(--st-approvato); border-color: var(--st-approvato); color: #fff;
}
.cl-btn.primary:hover { filter: brightness(1.07); background: var(--st-approvato); }
.cl-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-3); min-height: 32px; }
.cl-btn.ghost:hover { background: var(--paper-2); color: var(--ink); }
.cl-btn.ghost[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.cl-btn.sm { min-height: 30px; font-size: 12px; padding: 0 11px; }
.cl-btn svg { width: 14px; height: 14px; flex: 0 0 auto; }

.cl-done {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 700; color: var(--st-approvato);
}
.cl-done svg { width: 14px; height: 14px; }
.cl-done.rev { color: var(--st-revisione); }
.cl-done.pub { color: var(--st-pubblicato); }

/* ── Empty / gate ──────────────────────────────────────── */

.cl-empty {
  text-align: center; padding: 64px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.cl-empty h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.025em; }
.cl-empty p { margin: 0; font-size: 13.5px; color: var(--ink-3); max-width: 44ch; line-height: 1.6; }

.cl-gate {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px; padding: 30px;
  text-align: center;
}
.cl-gate h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.03em; }
.cl-gate p { margin: 0; font-size: 14px; color: var(--ink-3); max-width: 42ch; line-height: 1.6; }

.cl-foot {
  margin-top: 36px; padding-top: 20px; border-top: 1px solid var(--rule);
  text-align: center; font-size: 12px; color: var(--ink-4);
}
.cl-foot .sig { font-weight: 800; letter-spacing: -.03em; color: var(--ink-3); margin-top: 2px; }

/* ── Viewer ────────────────────────────────────────────── */

.cl-viewer {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(10,10,13,.74); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: 22px;
}
.cl-viewer.on { display: flex; }

.cl-vw {
  position: relative; display: flex;
  width: min(1000px, 100%); max-height: min(760px, 90vh);
  background: var(--panel); border-radius: 15px; overflow: hidden;
  box-shadow: 0 24px 70px rgba(0,0,0,.4);
}
.cl-vw-media {
  flex: 1 1 58%; min-width: 0; background: #0C0C0F;
  display: flex; align-items: center; justify-content: center; padding: 10px;
}
.cl-vw-media .cl-media { max-height: 100%; }
.cl-vw-side { flex: 0 0 370px; max-width: 370px; display: flex; flex-direction: column; min-width: 0; }

.cl-vw-head { display: flex; align-items: center; gap: 10px; padding: 14px 15px; border-bottom: 1px solid var(--rule); }
.cl-av {
  width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; overflow: hidden;
  background: var(--paper-2); border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 800; color: var(--ink-3);
}
.cl-av img { width: 100%; height: 100%; object-fit: cover; }
.cl-vw-who { flex: 1 1 auto; min-width: 0; }
.cl-vw-who b { display: block; font-size: 13.5px; font-weight: 700; }
.cl-vw-who span { display: block; font-size: 11.5px; color: var(--ink-3); }
.cl-x {
  width: 32px; height: 32px; flex: 0 0 auto;
  border: 0; border-radius: 8px; background: transparent; color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
}
.cl-x:hover { background: var(--paper-2); color: var(--ink); }

.cl-vw-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 15px; display: flex; flex-direction: column; gap: 12px; }
.cl-caption { font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.cl-caption.none { color: var(--ink-4); font-style: italic; }
.cl-vw-foot { border-top: 1px solid var(--rule); }
.cl-vw-foot .cl-actions { border-top: 0; }

.cl-arrow, .cl-step {
  position: absolute; top: 50%; transform: translateY(-50%);
  border: 0; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.9); color: #111;
}
.cl-arrow { width: 32px; height: 32px; font-size: 18px; }
.cl-arrow.left { left: 10px; } .cl-arrow.right { right: 10px; }
.cl-step { width: 36px; height: 36px; font-size: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.28); }
.cl-step.prev { left: -18px; } .cl-step.next { right: -18px; }
.cl-count { position: absolute; top: -26px; right: 0; font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.75); }

.cl-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; gap: 5px; justify-content: center; }
.cl-dots i { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.42); }
.cl-dots i.on { background: #fff; }

.cl-ta {
  width: 100%; padding: 10px 11px;
  border: 1px solid var(--rule-2); border-radius: 9px;
  background: var(--panel-2); color: var(--ink);
  font-size: 14px; line-height: 1.55; resize: vertical; min-height: 110px;
}
.cl-ta:focus { outline: none; border-color: var(--cobalt); background: var(--panel); }
.cl-modal-note { margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.55; }

/* ── Narrow ────────────────────────────────────────────── */

@media (max-width: 880px) {
  .cl-vw { flex-direction: column; max-height: 92vh; }
  .cl-vw-media { flex: 0 0 auto; max-height: 44vh; }
  .cl-vw-side { flex: 1 1 auto; max-width: 100%; }
  .cl-step.prev { left: 6px; } .cl-step.next { right: 6px; }
}
@media (max-width: 620px) {
  .cl-main { padding: 14px 13px 60px; }
  .cl-head-top { padding: 13px 14px 11px; }
  .cl-head-rows { padding: 9px 14px; }
  .cl-grid { grid-template-columns: 1fr; gap: 12px; }
  .cl-viewer { padding: 0; }

/* ── Shared UI plumbing ────────────────────────────────────
   01-core.js draws modals and toasts with its own class names.
   The studio stylesheet is not loaded here, so the client page
   carries its own version of just those pieces — sized for a
   page people will mostly meet on a phone.
   ──────────────────────────────────────────────────────── */

.modal-bg {
  position: fixed; inset: 0; z-index: 600;
  background: rgba(16,16,20,.5);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.on { display: flex; }
.modal {
  width: 440px; max-width: 100%; max-height: 86vh; overflow-y: auto;
  background: var(--panel); border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal-hd {
  position: sticky; top: 0; z-index: 2; background: var(--panel);
  display: flex; align-items: center; gap: 10px;
  padding: 15px 17px; border-bottom: 1px solid var(--rule);
}
.modal-hd h3 { margin: 0; flex: 1 1 auto; font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
.modal-bd { padding: 17px; display: flex; flex-direction: column; gap: 13px; }
.modal-ft {
  position: sticky; bottom: 0; z-index: 2; background: var(--panel);
  display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
  padding: 13px 17px; border-top: 1px solid var(--rule);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 15px;
  border: 1px solid var(--rule-2); border-radius: 9px;
  background: var(--panel); color: var(--ink);
  font-size: 13.5px; font-weight: 600; white-space: nowrap;
  transition: background .14s, border-color .14s, color .14s;
}
.btn:hover { background: var(--paper-2); border-color: var(--ink-4); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.danger { color: var(--st-revisione); border-color: var(--st-revisione-sub); }
.btn.danger:hover { background: var(--st-revisione-sub); border-color: var(--st-revisione); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-3); }
.btn.ghost:hover { background: var(--paper-2); color: var(--ink); }
.btn.icon { width: 34px; min-height: 34px; padding: 0; }
.btn.sm { min-height: 30px; font-size: 12.5px; padding: 0 11px; }
.btn.icon.sm { width: 30px; padding: 0; }
.btn svg { width: 14px; height: 14px; flex: 0 0 auto; }

.toasts {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
  z-index: 700; display: flex; flex-direction: column; gap: 7px;
  align-items: center; pointer-events: none;
}
.toast {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 17px; border-radius: 999px;
  background: var(--ink); color: var(--paper);
  font-size: 13.5px; font-weight: 600;
  box-shadow: 0 10px 28px rgba(0,0,0,.26);
  pointer-events: auto; max-width: 92vw;
  animation: clToast 180ms cubic-bezier(.2,.8,.3,1);
}
.toast button { background: none; border: 0; color: #A8B4FF; font-weight: 700; font-size: 13.5px; padding: 0; }
@keyframes clToast { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

@media (max-width: 620px) {
  .modal-bg { padding: 0; align-items: flex-end; }
  .modal { width: 100%; max-height: 92vh; border-radius: 16px 16px 0 0; }
  .modal-ft .btn { flex: 1 1 calc(50% - 4px); }
}

.cl-demo {
  padding: 3px 10px; border-radius: 999px;
  background: var(--paper-2); border: 1px solid var(--rule-2);
  font-size: 10.5px; font-weight: 700; color: var(--ink-3);
  white-space: nowrap;
}

/* ============================================================
   Ideology — where the data lives

   Empty (as shipped): everything stays in this browser. Good for
   trying the tool and for demos; nothing is shared.

   Filled in: the studio and the client link use the Supabase
   project below, shared by everyone on the team.

     supabaseUrl  Project Settings → API → Project URL
     supabaseKey  Project Settings → API Keys → the PUBLISHABLE key
                  (sb_publishable_…) or the legacy "anon" key

   Both values are public by design: they ship to every visitor's
   browser, and what they can do is limited by the database's
   Row Level Security. The SECRET / service_role key must never go
   here — the page refuses to start if it sees one.
   ============================================================ */

window.IDEOLOGY_CONFIG = Object.assign({
  supabaseUrl: '',
  supabaseKey: ''
}, window.IDEOLOGY_CONFIG || {});

/* src/js/00-dates.js */
/* ============================================================
   Ideology — date vocabulary

   Months are 'YYYY-MM', days 'YYYY-MM-DD'. Both sortable as
   plain strings, which is why the feed can order itself without
   parsing anything.

   This lives on its own because two separate pages need it: the
   studio app and the client link. The client page must not load
   the editing code, so the only alternative was a second copy of
   this arithmetic — and two copies of a date routine drift.
   ============================================================ */

window.IDE = window.IDE || {};

(function (A) {
  'use strict';

  var MONTH_NAMES = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
                     'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
  var DAY_NAMES = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  A.MONTH_NAMES = MONTH_NAMES;
  A.DAY_NAMES = DAY_NAMES;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  A.pad = pad;

  A.monthKeyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  A.todayKey = function () {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  A.thisMonth = function () { return A.monthKeyOf(new Date()); };

  A.monthLabel = function (mk) {
    if (!mk) return '—';
    var p = String(mk).split('-');
    return MONTH_NAMES[(parseInt(p[1], 10) || 1) - 1] + ' ' + p[0];
  };
  A.monthShort = function (mk) { return A.monthLabel(mk).slice(0, 3); };

  A.shiftMonth = function (mk, delta) {
    var p = String(mk).split('-'), y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1 + delta;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + pad(m + 1);
  };

  A.dayLabel = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return parseInt(p[2], 10) + ' ' + MONTH_NAMES[(parseInt(p[1], 10) || 1) - 1].slice(0, 3).toLowerCase();
  };

  /* "14 ottobre 2026" — the long form, for the client link where
     there is room and no ambiguity is worth risking. */
  A.dayLong = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return parseInt(p[2], 10) + ' ' +
      MONTH_NAMES[(parseInt(p[1], 10) || 1) - 1].toLowerCase() + ' ' + p[0];
  };

  A.monthOfDay = function (iso) { return String(iso || '').slice(0, 7); };
})(window.IDE);

<script>
/* src/js/30-client-data.js */
/* ============================================================
   Ideology — the client link's data contract

   This file is the wall between the studio and the client.

   The client link is a separate page. It does not load the
   editor, the UGC planner, the client registry or anything else
   the studio uses — open its source and none of that code is
   there. What it loads is this file, which does exactly two
   things:

     read(token)    → the only data that client may see
     submit(...)    → the only changes that client may make

   Both are written as if a server were on the other side, and
   when 00-config.js names a Supabase project there is one: the
   `anteprima` Edge Function, backed by client_preview() and
   client_review() in Postgres, which enforce the same rules.
   The page calls load() and send(), which pick the route.

   What never crosses:
     · other clients — the token selects exactly one
     · drafts — the studio decides when something is ready
     · internal notes, approval history, cross-posting plans
     · UGC plans, creators, budgets, monthly commitments
     · the studio's own filters, settings or backup

   What the client may write: an approval, or a change request
   with a message. Nothing else, and only on their own content —
   addressed by id, never by position, so a reordered month can
   never route an approval onto the wrong post.
   ============================================================ */

window.IDEC = window.IDEC || {};

(function (C, A) {
  'use strict';

  var KEY = 'ideology.content.v1';

  /* The client's own vocabulary. The studio has five internal
     states; the client is shown four, in their own words, and
     only ever sees three of them. "Bozza" has no client-facing
     name because a draft never reaches this page. */
  C.STATES = {
    da_approvare: { key: 'da_approvare', label: 'Da rivedere',      c: 'var(--st-approvare)',  sub: 'var(--st-approvare-sub)',  todo: true },
    in_revisione: { key: 'in_revisione', label: 'Modifica chiesta', c: 'var(--st-revisione)',  sub: 'var(--st-revisione-sub)',  todo: false },
    approvato:    { key: 'approvato',    label: 'Approvato',        c: 'var(--st-approvato)',  sub: 'var(--st-approvato-sub)',  todo: false },
    pubblicato:   { key: 'pubblicato',   label: 'Pubblicato',       c: 'var(--st-pubblicato)', sub: 'var(--st-pubblicato-sub)', todo: false }
  };
  C.stateOf = function (k) { return C.STATES[k] || C.STATES.da_approvare; };

  /* Posts a draft never leaves the studio. */
  function isVisible(p) { return p && p.status && p.status !== 'bozza'; }

  /* True when the page is running on the baked-in example rather
     than on a document the studio actually wrote. The page says so,
     and the token check relaxes, because a demo nobody can open is
     not a demo. */
  C.isDemo = false;

  function readDoc() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        C.isDemo = !!parsed.__demo;
        return parsed;
      } catch (e) { /* unreadable — fall through to the example */ }
    }
    if (window.__IDEOLOGY_DEMO__) {
      C.isDemo = true;
      var demo = JSON.parse(JSON.stringify(window.__IDEOLOGY_DEMO__));
      demo.__demo = true;
      /* Persist it so an approval made here survives a reload, the
         way it would against a real document. */
      try { localStorage.setItem(KEY, JSON.stringify(demo)); } catch (e) {}
      return demo;
    }
    C.isDemo = false;
    return null;
  }

  /* One post, reduced to the fields a client may see. Written as
     an allow-list: a field added to the studio's record does not
     appear here until someone decides it should. */
  function projectPost(p, categories) {
    var cat = null;
    if (p.categoryId) {
      for (var i = 0; i < categories.length; i++) {
        if (categories[i].id === p.categoryId) {
          cat = { name: categories[i].name, color: categories[i].color };
          break;
        }
      }
    }
    return {
      id: p.id,
      accountId: p.accountId,
      month: p.month,
      kind: p.kind,
      coverUrl: p.coverUrl || '',
      mediaUrl: p.mediaUrl || '',
      slides: (p.slides || []).map(function (s) { return { id: s.id, url: s.url || '' }; }),
      editorial: p.kind === 'editoriale'
        ? { eyebrow: (p.editorial || {}).eyebrow || '', title: (p.editorial || {}).title || '', sub: (p.editorial || {}).sub || '' }
        : null,
      date: p.date || '',
      showDate: !!p.showDate,
      caption: p.caption || '',
      category: cat,
      paid: !!p.paid,
      partner: (p.partner || '').trim(),
      status: p.status,
      clientNote: p.clientNote || '',
      clientNoteAt: p.clientNoteAt || '',
      revisions: p.revisions || 0
    };
  }

  /* GET /api/anteprima?c=<token> */
  C.read = function (token) {
    token = String(token || '').trim();
    var doc = readDoc();
    if (!doc || !Array.isArray(doc.clients)) return null;

    var cl = null;
    /* The token only. A slug is the client's name in lowercase —
       anyone could guess it, so it opens nothing. */
    doc.clients.forEach(function (c) {
      if (token && c.shareToken === token) cl = c;
    });
    if (cl && cl.shareEnabled === false) cl = null;      // switched off by the studio

    /* On the example document a missing token opens the first client,
       so the page can be looked at without one. Against a real
       document a token is always required. */
    if (!cl && C.isDemo && !token) cl = doc.clients[0] || null;
    if (!cl) return null;

    var accIds = {};
    (cl.accounts || []).forEach(function (a) { accIds[a.id] = 1; });

    var cats = (doc.categories || []).filter(function (c) { return c.clientId === cl.id; });

    /* A post can be published on more than one of the client's
       accounts. It is still one piece of content, so it is sent
       once per account it appears on, carrying the same id — the
       client approves the content, not a copy of it. */
    var posts = [];
    (doc.posts || []).forEach(function (p) {
      if (!isVisible(p)) return;
      var on = [];
      if (accIds[p.accountId]) on.push(p.accountId);
      (p.alsoOn || []).forEach(function (id) { if (accIds[id]) on.push(id); });
      if (!on.length) return;
      on.forEach(function (accId) {
        var out = projectPost(p, cats);
        out.accountId = accId;
        posts.push(out);
      });
    });

    posts.sort(function (a, b) {
      var ka = a.date || '￿', kb = b.date || '￿';
      return ka === kb ? 0 : ka.localeCompare(kb);
    });

    var months = {};
    posts.forEach(function (p) { if (p.month) months[p.month] = 1; });

    return {
      demo: C.isDemo,
      token: cl.shareToken,
      client: {
        name: cl.name,
        slug: cl.slug || '',
        palette: Object.assign({ bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C', alt: '#6E6256' }, cl.palette || {}),
        accounts: (cl.accounts || []).map(function (a) {
          var f = A.formatOfAccount(a);
          return {
            id: a.id, handle: a.handle || '', platform: a.platform || '',
            bio: a.bio || '', followers: a.followers || 0, following: a.following || 0,
            avatarUrl: a.avatarUrl || '',
            ratio: f.ratio, w: f.w, h: f.h, sizeLabel: f.sizeLabel
          };
        })
      },
      months: Object.keys(months).sort(),
      posts: posts
    };
  };

  /* POST /api/anteprima
     action: 'approva' | 'revisione' | 'annulla'

     Three guards, in order: the token must resolve to a client,
     the post must exist, and the post must belong to that
     client. Only then does a whitelisted write happen. */
  C.submit = function (token, postId, action, note) {
    var doc = readDoc();
    if (!doc) return { ok: false, error: 'Dati non disponibili' };

    var cl = null;
    (doc.clients || []).forEach(function (c) {
      if (token && c.shareToken === token) cl = c;
    });
    if (!cl && C.isDemo && !token) cl = doc.clients[0] || null;
    if (cl && cl.shareEnabled === false) cl = null;
    if (!cl) return { ok: false, error: 'Link non valido' };

    var accIds = {};
    (cl.accounts || []).forEach(function (a) { accIds[a.id] = 1; });

    var post = null;
    (doc.posts || []).forEach(function (p) { if (p.id === postId) post = p; });
    if (!post) return { ok: false, error: 'Contenuto non trovato' };

    var mine = accIds[post.accountId] ||
      (post.alsoOn || []).some(function (id) { return accIds[id]; });
    if (!mine) return { ok: false, error: 'Contenuto non disponibile' };
    if (!isVisible(post)) return { ok: false, error: 'Contenuto non disponibile' };

    /* The same transitions the database allows (client_review):
       published content is closed, and repeating an answer is a no-op. */
    var from = post.status;
    var to, allowed;
    if (action === 'approva') { to = 'approvato'; allowed = ['da_approvare', 'in_revisione']; }
    else if (action === 'revisione') { to = 'in_revisione'; allowed = ['da_approvare', 'approvato', 'in_revisione']; }
    else if (action === 'annulla') { to = 'da_approvare'; allowed = ['approvato', 'in_revisione']; }
    else return { ok: false, error: 'Azione non riconosciuta' };
    if (from === to && action !== 'revisione') return { ok: true, status: to };
    if (allowed.indexOf(from) < 0) return { ok: false, error: 'Questo contenuto non si può più modificare da qui' };

    if (action === 'revisione') {
      var msg = String(note || '').trim();
      if (!msg) return { ok: false, error: 'Serve un messaggio' };
      /* The client's words go in the client's field. The studio's
         internal note is never touched — in the tool this replaces,
         the two shared one field and a change request overwrote
         whatever the studio had written to itself. */
      post.clientNote = msg.slice(0, 2000);
      post.clientNoteAt = new Date().toISOString();
      post.revisions = (post.revisions || 0) + 1;
    }

    post.status = to;
    if (!Array.isArray(post.history)) post.history = [];
    post.history.push({
      at: new Date().toISOString(),
      from: from, to: to, by: 'cliente',
      note: action === 'revisione' ? post.clientNote : ''
    });

    try {
      doc.savedAt = new Date().toISOString();
      localStorage.setItem(KEY, JSON.stringify(doc));
    } catch (e) {
      return { ok: false, error: 'Salvataggio non riuscito' };
    }
    return { ok: true, status: to };
  };

  /* ── The network path ─────────────────────────────────
     When 00-config.js names a Supabase project, the same two calls go
     to the `anteprima` Edge Function instead of this browser's
     storage. The page only ever uses load/send, so it cannot tell
     the difference — and the answer has the same shape either way. */

  var CFG = window.IDEOLOGY_CONFIG || {};
  C.misconfigured = !!(CFG.supabaseKey && A.looksSecretKey(CFG.supabaseKey));
  C.remote = !!(CFG.supabaseUrl && CFG.supabaseKey) && !C.misconfigured;
  C.endpoint = C.remote ? String(CFG.supabaseUrl).replace(/\/+$/, '') + '/functions/v1/anteprima' : '';

  /* The server sends one entry per post with the client's accounts
     it appears on; the page wants one entry per account. */
  function shape(raw, token) {
    var accounts = (raw.accounts || []).map(function (a) {
      var f = A.formatOfAccount(a);
      return {
        id: a.id, handle: a.handle || '', platform: a.platform || '',
        bio: a.bio || '', followers: a.followers || 0, following: a.following || 0,
        avatarUrl: a.avatarUrl || '',
        ratio: f.ratio, w: f.w, h: f.h, sizeLabel: f.sizeLabel
      };
    });
    var posts = [];
    (raw.posts || []).forEach(function (p) {
      (p.accountIds || []).forEach(function (accId) {
        var out = {
          id: p.id, accountId: accId, month: p.month, kind: p.kind,
          coverUrl: p.coverUrl || '', mediaUrl: p.mediaUrl || '',
          slides: (p.slides || []).map(function (s) { return { id: s.id, url: s.url || '' }; }),
          editorial: p.editorial || null,
          date: p.date || '', showDate: !!p.showDate, caption: p.caption || '',
          category: p.category || null, paid: !!p.paid, partner: p.partner || '',
          status: p.status, clientNote: p.clientNote || '', clientNoteAt: p.clientNoteAt || '',
          revisions: p.revisions || 0
        };
        posts.push(out);
      });
    });
    var months = {};
    posts.forEach(function (p) { if (p.month) months[p.month] = 1; });
    return {
      demo: false,
      token: token,
      loadedAt: Date.now(),
      client: {
        name: raw.client.name,
        slug: raw.client.slug || '',
        palette: Object.assign({ bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C', alt: '#6E6256' }, raw.client.palette || {}),
        accounts: accounts
      },
      months: Object.keys(months).sort(),
      posts: posts
    };
  }

  /* → the data, or null for a link that opens nothing. Throws only when
     the server cannot be reached, so the page can say "try again"
     instead of "invalid link". */
  C.load = function (token) {
    if (!C.remote) return Promise.resolve(C.read(token));
    if (!/^[A-Za-z0-9_-]{32,128}$/.test(token || '')) return Promise.resolve(null);
    return fetch(C.endpoint, {
      method: 'POST', cache: 'no-store',
      headers: { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'read', token: token })
    }).then(function (res) {
      if (res.status === 404) return null;
      if (!res.ok) throw new Error('Il server non risponde (' + res.status + ')');
      return res.json().then(function (j) { return shape(j, token); });
    });
  };

  C.send = function (token, postId, action, note) {
    if (!C.remote) return Promise.resolve(C.submit(token, postId, action, note));
    return fetch(C.endpoint, {
      method: 'POST',
      headers: { apikey: CFG.supabaseKey, 'Content-Type': 'application/json' },
      body: JSON.stringify({ op: 'review', token: token, postId: postId, action: action, note: note || '' })
    }).then(function (res) {
      return res.json().then(function (j) {
        return j && j.ok ? { ok: true, status: j.status } : { ok: false, error: (j && j.error) || 'Non è andato a buon fine' };
      }, function () { return { ok: false, error: 'Risposta non valida dal server' }; });
    }, function () {
      return { ok: false, error: 'Connessione assente. Riprova tra un momento.' };
    });
  };

  /* The token lives in the fragment (#c=…): browsers never send the
     fragment to a server, so it stays out of every access log and every
     Referer. Links in the older ?c= form still open, and are moved into
     the fragment straight away so they leave the address bar too. */
  C.tokenFromUrl = function () {
    var m = /[#&]c=([^&]+)/.exec(location.hash);
    if (m) return decodeURIComponent(m[1]);
    m = /[?&](?:c|cliente)=([^&]+)/.exec(location.search);
    if (!m) return '';
    var token = decodeURIComponent(m[1]);
    try { history.replaceState(null, '', location.pathname + '#c=' + encodeURIComponent(token)); } catch (e) {}
    return token;
  };
})(window.IDEC, window.IDE);
</script>
<script>
/* src/js/31-client-app.js */
/* ============================================================
   Ideology — the client link

   What the client sees when the studio sends them a month.

   It is deliberately not a smaller copy of the studio tool. The
   client has one job — go through the month and say yes, or say
   what to change — so the page is built around that job and has
   no navigation, no settings and nothing to learn. Everything
   still to review is at the top; once the month is handled the
   page says so rather than leaving them guessing.
   ============================================================ */

(function (C, A) {
  'use strict';

  var S = {
    token: '',
    data: null,
    accountId: '',
    month: '',
    only: 'tutti',     // 'tutti' | 'da_rivedere'
    view: []           // the posts currently on screen, for the viewer
  };

  /* ── Reading the data ─────────────────────────────────── */

  function postsFor(accountId, month) {
    return S.data.posts.filter(function (p) {
      return p.accountId === accountId && (!month || p.month === month);
    });
  }

  function shown() {
    var list = postsFor(S.accountId, S.month);
    if (S.only === 'da_rivedere') {
      list = list.filter(function (p) { return C.stateOf(p.status).todo; });
    }
    return list;
  }

  function counts(list) {
    var c = { todo: 0, approvato: 0, in_revisione: 0, pubblicato: 0, tot: list.length };
    list.forEach(function (p) {
      if (C.stateOf(p.status).todo) c.todo++;
      if (c[p.status] !== undefined) c[p.status]++;
    });
    return c;
  }

  async function reload() {
    S.data = await C.load(S.token);
    if (!S.data) return false;
    if (!S.token && S.data.token) S.token = S.data.token;
    if (!S.accountId || !S.data.client.accounts.some(function (a) { return a.id === S.accountId; })) {
      S.accountId = (S.data.client.accounts[0] || {}).id || '';
    }
    if (!S.month || S.data.months.indexOf(S.month) < 0) {
      /* open on the month that needs them, else the latest */
      var best = '';
      S.data.months.forEach(function (m) {
        var has = postsFor(S.accountId, m).some(function (p) { return C.stateOf(p.status).todo; });
        if (has && !best) best = m;
      });
      S.month = best || S.data.months[S.data.months.length - 1] || A.thisMonth();
    }
    return true;
  }

  /* ── Pieces ───────────────────────────────────────────── */

  function media(p, opts) {
    opts = opts || {};
    var acc = account();
    var box = A.el('div', {
      class: 'cl-media' + (opts.contain ? ' contain' : ''),
      style: '--ratio:' + (acc ? acc.ratio : '4/5') + ';'
    });

    if (p.kind === 'editoriale' && p.editorial) {
      var pal = S.data.client.palette;
      var card = A.el('div', { class: 'cl-ed', style: 'background:' + pal.bg + ';color:' + pal.ink + ';' });
      if (p.editorial.eyebrow) card.appendChild(A.el('div', { class: 'eye', style: 'color:' + pal.accent + ';', text: p.editorial.eyebrow }));
      card.appendChild(A.el('div', { class: 'tit', text: p.editorial.title || '' }));
      card.appendChild(A.el('div', { class: 'rule' }));
      card.appendChild(A.el('div', { class: 'sub', text: p.editorial.sub || '' }));
      box.appendChild(card);
    } else {
      var url = p.coverUrl || p.mediaUrl || (p.slides[0] ? p.slides[0].url : '');
      if (url) {
        var img = A.el('img', { src: url, alt: '', loading: 'lazy' });
        img.addEventListener('error', function () {
          img.remove();
          box.appendChild(A.el('div', { class: 'cl-ph', text: 'Immagine non disponibile' }));
        });
        box.appendChild(img);
      } else {
        box.appendChild(A.el('div', { class: 'cl-ph', text: 'In preparazione' }));
      }
    }

    if (p.kind === 'reel') box.appendChild(A.el('span', { class: 'cl-mk', html: A.icon('play', 13) }));
    if (p.kind === 'carosello' && p.slides.length > 1) {
      box.appendChild(A.el('span', { class: 'cl-mk', html: A.icon('layers', 13) + '<i>' + p.slides.length + '</i>' }));
    }
    return box;
  }

  function badges(p) {
    var row = A.el('div', { class: 'cl-badges' });
    if (p.showDate && p.date) row.appendChild(A.el('span', { class: 'cl-chip date', text: A.dayLabel(p.date) }));
    if (p.paid) row.appendChild(A.el('span', { class: 'cl-chip paid', text: 'Sponsorizzato' }));
    if (p.partner) row.appendChild(A.el('span', { class: 'cl-chip partner', text: 'Con ' + p.partner }));
    if (p.category) {
      row.appendChild(A.el('span', {
        class: 'cl-chip',
        html: '<i class="dot" style="background:' + p.category.color + '"></i>' + A.esc(p.category.name)
      }));
    }
    return row;
  }

  function stateTag(p) {
    var st = C.stateOf(p.status);
    return A.el('span', {
      class: 'cl-state',
      style: 'color:' + st.c + ';background:' + st.sub + ';',
      html: '<i class="dot" style="background:' + st.c + '"></i>' + A.esc(st.label)
    });
  }

  /* The two things a client can do, wherever they are standing. */
  function actions(p, onDone) {
    var row = A.el('div', { class: 'cl-actions' });
    var st = C.stateOf(p.status);

    if (p.status === 'approvato') {
      row.appendChild(A.el('span', { class: 'cl-done', html: A.icon('check', 14) + 'Approvato' }));
      row.appendChild(A.el('div', { class: 'cl-grow' }));
      row.appendChild(A.el('button', {
        class: 'cl-btn ghost', text: 'Annulla',
        onclick: function (e) { e.stopPropagation(); act(p, 'annulla', '', onDone); }
      }));
      return row;
    }
    if (p.status === 'pubblicato') {
      row.appendChild(A.el('span', { class: 'cl-done pub', text: 'Pubblicato' }));
      return row;
    }
    if (p.status === 'in_revisione') {
      row.appendChild(A.el('span', { class: 'cl-done rev', html: A.icon('pencil', 13) + 'Modifica chiesta' }));
      row.appendChild(A.el('div', { class: 'cl-grow' }));
      row.appendChild(A.el('button', {
        class: 'cl-btn ghost', text: 'Modifica messaggio',
        onclick: function (e) { e.stopPropagation(); askChange(p, onDone); }
      }));
      return row;
    }

    row.appendChild(A.el('button', {
      class: 'cl-btn primary', html: A.icon('check', 14) + 'Approva',
      onclick: function (e) { e.stopPropagation(); act(p, 'approva', '', onDone); }
    }));
    row.appendChild(A.el('button', {
      class: 'cl-btn', html: A.icon('pencil', 13) + 'Chiedi una modifica',
      onclick: function (e) { e.stopPropagation(); askChange(p, onDone); }
    }));
    return row;
  }

  var sending = false;
  async function act(p, action, note, onDone) {
    if (sending) return;
    sending = true;
    try {
      var res = await C.send(S.token, p.id, action, note);
      if (!res.ok) { A.toast(res.error); return; }
      A.toast(action === 'approva' ? 'Approvato' :
              action === 'revisione' ? 'Richiesta inviata allo studio' : 'Approvazione annullata');
      try { await reload(); } catch (e) { A.toast('Salvato. Aggiorna la pagina per vedere lo stato.'); }
      if (onDone) onDone();
      render();
    } finally {
      sending = false;
    }
  }

  function askChange(p, onDone) {
    var ta = A.el('textarea', {
      class: 'cl-ta', rows: '5',
      placeholder: 'Cosa vorresti cambiare? Più sei preciso, meno giri servono.'
    });
    ta.value = p.clientNote || '';
    A.modal({
      title: 'Chiedi una modifica',
      body: [
        A.el('p', {
          class: 'cl-modal-note',
          text: 'Il messaggio arriva allo studio insieme al contenuto e resta allegato a questo post.'
        }),
        ta
      ],
      actions: [
        { label: 'Annulla' },
        {
          label: 'Invia richiesta', kind: 'primary',
          run: function () {
            if (!ta.value.trim()) { ta.focus(); return false; }
            act(p, 'revisione', ta.value, onDone);
          }
        }
      ]
    });
  }

  /* ── The full view of one content ─────────────────────── */

  var V = { i: 0, slide: 0 };

  function openViewer(list, id) {
    A.closeCaptionPeek();
    S.view = list.slice();
    V.i = Math.max(0, S.view.findIndex(function (p) { return p.id === id; }));
    V.slide = 0;
    A.$('#cl-viewer').classList.add('on');
    document.body.style.overflow = 'hidden';
    drawViewer();
  }
  function closeViewer() {
    A.$('#cl-viewer').classList.remove('on');
    A.clear(A.$('#cl-viewer'));
    document.body.style.overflow = '';
    S.view = [];
  }
  function step(d) {
    if (S.view.length < 2) return;
    V.i = (V.i + d + S.view.length) % S.view.length;
    V.slide = 0;
    drawViewer();
  }

  function drawViewer() {
    var host = A.$('#cl-viewer');
    A.clear(host);
    var p = S.view[V.i];
    if (!p) return closeViewer();
    var acc = account();

    var shell = A.el('div', { class: 'cl-vw', role: 'dialog', 'aria-modal': 'true' });

    var left = A.el('div', { class: 'cl-vw-media' });
    if (p.kind === 'carosello' && p.slides.length > 1) {
      var stage = A.el('div', { class: 'cl-media contain', style: '--ratio:' + acc.ratio + ';' });
      var sl = p.slides[V.slide];
      if (sl && sl.url) stage.appendChild(A.el('img', { src: sl.url, alt: '' }));
      else stage.appendChild(A.el('div', { class: 'cl-ph', text: 'Slide ' + (V.slide + 1) }));
      stage.appendChild(A.el('button', {
        class: 'cl-arrow left', html: '‹', 'aria-label': 'Slide precedente',
        onclick: function () { V.slide = (V.slide - 1 + p.slides.length) % p.slides.length; drawViewer(); }
      }));
      stage.appendChild(A.el('button', {
        class: 'cl-arrow right', html: '›', 'aria-label': 'Slide successiva',
        onclick: function () { V.slide = (V.slide + 1) % p.slides.length; drawViewer(); }
      }));
      var dots = A.el('div', { class: 'cl-dots' });
      p.slides.forEach(function (_, i) { dots.appendChild(A.el('i', { class: i === V.slide ? 'on' : '' })); });
      stage.appendChild(dots);
      left.appendChild(stage);
    } else {
      left.appendChild(media(p, { contain: true }));
    }
    shell.appendChild(left);

    var side = A.el('div', { class: 'cl-vw-side' });

    var head = A.el('div', { class: 'cl-vw-head' });
    var av = A.el('span', { class: 'cl-av' });
    if (acc.avatarUrl) av.appendChild(A.el('img', { src: acc.avatarUrl, alt: '' }));
    else av.textContent = A.initials(S.data.client.name);
    head.appendChild(av);
    head.appendChild(A.el('span', { class: 'cl-vw-who' }, [
      A.el('b', { text: acc.handle || S.data.client.name }),
      A.el('span', { text: acc.platform + (p.showDate && p.date ? ' · ' + A.dayLong(p.date) : '') })
    ]));
    head.appendChild(A.el('button', {
      class: 'cl-x', html: A.icon('x', 16), 'aria-label': 'Chiudi', onclick: closeViewer
    }));
    side.appendChild(head);

    var body = A.el('div', { class: 'cl-vw-body' });
    var tags = badges(p);
    tags.appendChild(stateTag(p));
    body.appendChild(tags);

    if (p.caption) body.appendChild(A.el('div', { class: 'cl-caption', text: p.caption }));
    else body.appendChild(A.el('div', { class: 'cl-caption none', text: 'Nessuna didascalia per questo contenuto.' }));

    if (p.clientNote) {
      body.appendChild(A.el('div', { class: 'cl-note' }, [
        A.el('b', { text: 'La tua richiesta' + (p.clientNoteAt ? ' · ' + new Date(p.clientNoteAt).toLocaleDateString('it-IT') : '') }),
        A.el('span', { text: p.clientNote })
      ]));
    }
    side.appendChild(body);

    side.appendChild(A.el('div', { class: 'cl-vw-foot' }, [actions(p, drawViewer)]));
    shell.appendChild(side);

    if (S.view.length > 1) {
      shell.appendChild(A.el('button', { class: 'cl-step prev', html: '‹', 'aria-label': 'Contenuto precedente', onclick: function () { step(-1); } }));
      shell.appendChild(A.el('button', { class: 'cl-step next', html: '›', 'aria-label': 'Contenuto successivo', onclick: function () { step(1); } }));
      shell.appendChild(A.el('span', { class: 'cl-count', text: (V.i + 1) + ' / ' + S.view.length }));
    }

    host.appendChild(shell);
    host.onclick = function (e) { if (e.target === host) closeViewer(); };
  }

  /* ── Page ─────────────────────────────────────────────── */

  function account() {
    var hit = null;
    S.data.client.accounts.forEach(function (a) { if (a.id === S.accountId) hit = a; });
    return hit || S.data.client.accounts[0] || { ratio: '4/5', handle: '', platform: '' };
  }

  function header() {
    var pal = S.data.client.palette;
    var bar = A.el('header', { class: 'cl-head' });

    var top = A.el('div', { class: 'cl-head-top' }, [
      A.el('span', { class: 'cl-mark', text: 'I' }),
      A.el('div', { class: 'cl-who' }, [
        A.el('h1', { text: S.data.client.name }),
        A.el('p', { text: 'Piano editoriale · ' + A.monthLabel(S.month) })
      ])
    ]);
    if (S.data.demo) {
      top.appendChild(A.el('div', { class: 'cl-grow' }));
      top.appendChild(A.el('span', { class: 'cl-demo', text: 'Esempio' }));
    }
    bar.appendChild(top);
    bar.appendChild(A.el('div', { class: 'cl-accent', style: 'background:' + pal.accent + ';' }));

    var rows = A.el('div', { class: 'cl-head-rows' });

    var accs = S.data.client.accounts.filter(function (a) {
      return S.data.posts.some(function (p) { return p.accountId === a.id; });
    });
    if (accs.length > 1) {
      var at = A.el('div', { class: 'cl-pills' });
      accs.forEach(function (a) {
        at.appendChild(A.el('button', {
          class: 'cl-pill', 'aria-pressed': a.id === S.accountId ? 'true' : 'false',
          text: a.platform,
          onclick: function () { S.accountId = a.id; render(); }
        }));
      });
      rows.appendChild(at);
    }

    if (S.data.months.length > 1) {
      var ms = A.el('select', { class: 'cl-sel', 'aria-label': 'Mese' });
      S.data.months.forEach(function (m) {
        ms.appendChild(A.el('option', { value: m, text: A.monthLabel(m), selected: m === S.month }));
      });
      ms.addEventListener('change', function () { S.month = ms.value; render(); });
      rows.appendChild(ms);
    }

    if (rows.childNodes.length) bar.appendChild(rows);
    return bar;
  }

  function summary(all) {
    var c = counts(all);
    var wrap = A.el('section', { class: 'cl-summary' });

    if (!all.length) return wrap;

    if (c.todo) {
      wrap.appendChild(A.el('div', { class: 'cl-ask' }, [
        A.el('h2', { text: c.todo === 1 ? 'Un contenuto aspetta il tuo ok' : c.todo + ' contenuti aspettano il tuo ok' }),
        A.el('p', { text: 'Approva quelli che vanno bene. Se qualcosa non torna, scrivi cosa cambiare: la richiesta arriva direttamente allo studio.' })
      ]));
    } else {
      wrap.appendChild(A.el('div', { class: 'cl-ask done' }, [
        A.el('h2', { html: A.icon('check', 18) + 'Hai rivisto tutto' }),
        A.el('p', {
          text: c.in_revisione
            ? (c.in_revisione === 1 ? 'Una modifica è in mano allo studio.' : c.in_revisione + ' modifiche sono in mano allo studio.')
            : 'Non manca niente per ' + A.monthLabel(S.month).toLowerCase() + '.'
        })
      ]));
    }

    var strip = A.el('div', { class: 'cl-strip' });
    [['Da rivedere', c.todo, 'var(--st-approvare)'],
     ['Approvati', c.approvato, 'var(--st-approvato)'],
     ['Modifiche chieste', c.in_revisione, 'var(--st-revisione)'],
     ['Pubblicati', c.pubblicato, 'var(--st-pubblicato)']
    ].forEach(function (r) {
      if (!r[1]) return;
      strip.appendChild(A.el('span', { class: 'cl-count-chip' }, [
        A.el('i', { class: 'dot', style: 'background:' + r[2] + ';' }),
        A.el('b', { text: String(r[1]) }),
        A.el('span', { text: r[0] })
      ]));
    });
    if (c.todo && c.tot > c.todo) {
      strip.appendChild(A.el('div', { class: 'cl-grow' }));
      strip.appendChild(A.el('button', {
        class: 'cl-btn ghost sm',
        'aria-pressed': S.only === 'da_rivedere' ? 'true' : 'false',
        text: S.only === 'da_rivedere' ? 'Mostra tutto il mese' : 'Solo da rivedere',
        onclick: function () { S.only = S.only === 'da_rivedere' ? 'tutti' : 'da_rivedere'; render(); }
      }));
    }
    if (strip.childNodes.length) wrap.appendChild(strip);
    return wrap;
  }

  function grid(list) {
    var g = A.el('section', { class: 'cl-grid' });
    list.forEach(function (p) {
      var card = A.el('article', { class: 'cl-card', dataset: { st: p.status, id: p.id } });

      var cell = A.el('div', {
        class: 'cl-cell', role: 'button', tabindex: '0',
        'aria-label': 'Apri il contenuto'
      });
      cell.appendChild(media(p));
      cell.addEventListener('click', function () { openViewer(list, p.id); });
      cell.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openViewer(list, p.id); }
      });
      card.appendChild(cell);

      var body = A.el('div', { class: 'cl-body' });
      var tags = badges(p);
      tags.appendChild(stateTag(p));
      body.appendChild(tags);

      var excerpt = null;
      if (p.caption) {
        excerpt = A.el('div', { class: 'cl-excerpt', text: p.caption });
        body.appendChild(excerpt);
      }
      if (p.clientNote) {
        body.appendChild(A.el('div', { class: 'cl-note small' }, [
          A.el('b', { text: 'La tua richiesta' }),
          A.el('span', { text: p.clientNote })
        ]));
      }
      card.appendChild(body);

      /* Hovering the content shows the whole caption. The action row is
         left out on purpose: the caption should not jump up over the
         buttons while someone is reaching for Approva. */
      if (excerpt) {
        A.captionPeek({ trigger: cell, clamp: excerpt, text: p.caption });
        A.captionPeek({ trigger: body, clamp: excerpt, text: p.caption });
      }

      card.appendChild(actions(p, null));
      g.appendChild(card);
    });
    return g;
  }

  function emptyState() {
    return A.el('div', { class: 'cl-empty' }, [
      A.el('h2', { text: S.only === 'da_rivedere' ? 'Niente da rivedere' : 'Ancora niente da vedere' }),
      A.el('p', {
        text: S.only === 'da_rivedere'
          ? 'Hai già risposto a tutto quello che c’era in questo mese.'
          : 'Appena lo studio invia i contenuti di ' + A.monthLabel(S.month).toLowerCase() + ', li trovi qui.'
      }),
      S.only === 'da_rivedere'
        ? A.el('button', { class: 'cl-btn', text: 'Mostra tutto il mese', onclick: function () { S.only = 'tutti'; render(); } })
        : null
    ]);
  }

  function render() {
    var root = A.$('#cl-root');
    A.clear(root);

    if (S.loading || S.failed) {
      root.appendChild(A.el('div', { class: 'cl-gate' }, S.failed ? [
        A.el('h1', { text: 'Non riesco a caricare l\'anteprima' }),
        A.el('p', { text: S.failed }),
        A.el('button', { class: 'cl-btn primary', text: 'Riprova', onclick: C.boot })
      ] : [A.el('p', { text: 'Caricamento…' })]));
      return;
    }

    if (C.misconfigured) {
      root.appendChild(A.el('div', { class: 'cl-gate' }, [
        A.el('h1', { text: 'Pagina da configurare' }),
        A.el('p', { text: 'La chiave in 00-config.js è una chiave segreta: va usata quella pubblica.' })
      ]));
      return;
    }

    if (!S.data) {
      root.appendChild(A.el('div', { class: 'cl-gate' }, [
        A.el('h1', { text: 'Link non valido' }),
        A.el('p', { text: 'Questo link di anteprima non è più attivo. Chiedi allo studio di inviartene uno nuovo.' })
      ]));
      return;
    }

    root.appendChild(header());
    var main = A.el('main', { class: 'cl-main' });
    var all = postsFor(S.accountId, S.month);
    main.appendChild(summary(all));

    var list = shown();
    main.appendChild(list.length ? grid(list) : emptyState());

    main.appendChild(A.el('footer', { class: 'cl-foot' }, [
      A.el('div', { text: 'Anteprima preparata per ' + S.data.client.name }),
      A.el('div', { class: 'sig', text: 'Ideology · ideology.it' })
    ]));
    root.appendChild(main);
  }

  /* ── Boot ─────────────────────────────────────────────── */

  document.addEventListener('keydown', function (e) {
    var v = A.$('#cl-viewer');
    if (v && v.classList.contains('on')) {
      if (e.key === 'Escape') return closeViewer();
      var p = S.view[V.i];
      var car = p && p.kind === 'carosello' && p.slides.length > 1;
      if (e.key === 'ArrowLeft') { car ? (V.slide = (V.slide - 1 + p.slides.length) % p.slides.length, drawViewer()) : step(-1); }
      if (e.key === 'ArrowRight') { car ? (V.slide = (V.slide + 1) % p.slides.length, drawViewer()) : step(1); }
      return;
    }
    var bg = A.$('#modal-bg');
    if (bg && bg.classList.contains('on') && e.key === 'Escape') A.closeModal();
  });

  C.boot = async function () {
    S.token = C.tokenFromUrl();
    S.loading = true; S.failed = '';
    render();
    try {
      await reload();
    } catch (e) {
      S.failed = 'Controlla la connessione e riprova. (' + e.message + ')';
    }
    S.loading = false;
    if (S.data) document.title = S.data.client.name + ' — Anteprima';
    render();
  };

  /* Images come with links that expire after an hour. A page left open
     longer than that refreshes itself when looked at again. */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !C.remote || !S.data || S.loading) return;
    if (Date.now() - (S.data.loadedAt || 0) < 45 * 60 * 1000) return;
    reload().then(render, function () {});
  });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', C.boot);
  else C.boot();
})(window.IDEC, window.IDE);
</script>
</body>
</html>
