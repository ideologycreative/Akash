    if (p.internalNote) scroll.appendChild(A.el('div', { class: 'pv-note internal', html: '<b>Nota interna</b>' + A.esc(p.internalNote) }));

    side.appendChild(scroll);

    var foot = A.el('div', { class: 'pvw-foot' });
    foot.appendChild(fakeActions());
    var st = A.statusOf(p.status);
    foot.appendChild(A.el('div', { class: 'pvw-btns' }, [
      A.el('button', {
        class: 'btn sm', style: 'border-color:' + st.c + ';background:' + st.sub + ';',
        html: '<span style="width:7px;height:7px;border-radius:50%;background:' + st.c + '"></span>' + A.esc(st.label),
        onclick: function () { A.openStatusModal(p); }
      }),
      A.el('div', { class: 'bar-space' }),
      A.el('button', { class: 'btn sm', html: A.icon('pencil', 12) + 'Modifica', onclick: function () { A.closePostView(); A.openPostEditor(p.id); } })
    ]));
    side.appendChild(foot);
    shell.appendChild(side);

    if (PV.list.length > 1) {
      shell.appendChild(A.el('button', { class: 'pvw-step prev', html: '‹', 'aria-label': 'Contenuto precedente', onclick: function () { pvNav(-1); } }));
      shell.appendChild(A.el('button', { class: 'pvw-step next', html: '›', 'aria-label': 'Contenuto successivo', onclick: function () { pvNav(1); } }));
      shell.appendChild(A.el('span', { class: 'pvw-count', text: (PV.i + 1) + ' / ' + PV.list.length }));
    }

    host.appendChild(shell);
    host.onclick = function (e) { if (e.target === host) A.closePostView(); };
  }

  /* Story / storyboard viewer — frames step through in place. */
  A.closeStoryViewer = function () {
    var h = A.$('#lightbox');
    h.classList.remove('on', 'as-post');
    A.clear(h);
  };

  A.openStoryViewer = function (story) {
    var idx = 0;
    var host = A.$('#lightbox');
    host.classList.remove('as-post');
    host.classList.add('on');

    function draw() {
      A.clear(host);
      var frames = story.kind === 'storyboard' && story.frames.length
        ? story.frames : [{ id: 'single', url: story.mediaUrl, note: story.note }];
      var f = frames[idx] || frames[0];
      var frame = A.el('div', { class: 'lb-frame', style: 'width:min(280px,80vw);' });
      frame.appendChild(A.el('button', { class: 'lb-x', html: '&times;', 'aria-label': 'Chiudi', onclick: A.closeStoryViewer }));
      var stage = A.el('div', { class: 'lb-stage', style: '--ratio:9/16;' });
      if (f.url) stage.appendChild(A.el('img', { src: f.url, alt: '' }));
      else stage.appendChild(A.el('div', { style: 'color:#777;font-size:12px;padding:20px;text-align:center;', text: f.note || 'Frame vuoto' }));
      stage.appendChild(A.el('span', { class: 'lb-count', text: (idx + 1) + ' / ' + frames.length }));
      frame.appendChild(stage);
      if (frames.length > 1) {
        frame.appendChild(A.el('button', { class: 'lb-nav lb-prev', html: '‹', 'aria-label': 'Frame precedente', onclick: function () { idx = (idx - 1 + frames.length) % frames.length; draw(); } }));
        frame.appendChild(A.el('button', { class: 'lb-nav lb-next', html: '›', 'aria-label': 'Frame successivo', onclick: function () { idx = (idx + 1) % frames.length; draw(); } }));
      }
      frame.appendChild(A.el('div', { class: 'lb-cap', text: (story.title || '') + (f.note ? ' — ' + f.note : '') }));
      host.appendChild(frame);
    }
    draw();
  };

  document.addEventListener('keydown', function (e) {
    var lb = A.$('#lightbox');
    if (lb && lb.classList.contains('on')) {
      var isPost = lb.classList.contains('as-post');
      if (e.key === 'Escape') { isPost ? A.closePostView() : A.closeStoryViewer(); return; }
      if (!isPost) return;
      var p = PV.list[PV.i];
      var car = p && p.kind === 'carosello' && p.slides && p.slides.length > 1;
      if (e.key === 'ArrowLeft') car ? pvSlide(-1) : pvNav(-1);
      if (e.key === 'ArrowRight') car ? pvSlide(1) : pvNav(1);
      return;
    }
    var bg = A.$('#modal-bg');
    if (bg && bg.classList.contains('on') && e.key === 'Escape') A.closeModal();
  });
})(window.IDE);
</script>
<script>
/* src/js/05-feed.js */
/* ============================================================
   Ideology — Feed

   Composing the month. The grid is ordered by publication date
   and everything is edited in one centred dialog, so the grid
   behind it never shifts under the cursor while you work.
   ============================================================ */

(function (A) {
  'use strict';

  /* ── Shared media control: upload a file or paste a link ── */

  A.mediaControl = function (current, onSet, onClear, opts) {
    opts = opts || {};
    var wrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' });

    var row = A.el('div', { style: 'display:flex;gap:7px;align-items:center;flex-wrap:wrap;' });
    var file = A.el('input', { type: 'file', accept: opts.accept || 'image/*', style: 'display:none' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var read = opts.read || A.readImage;
      read(f).then(onSet).catch(function (e) { A.toast(e.message); });
      file.value = '';
    });
    row.appendChild(A.el('button', {
      class: 'btn sm', html: A.icon('up', 12) + (current ? (opts.replaceLabel || 'Sostituisci file') : (opts.uploadLabel || 'Carica file')),
      onclick: function () { file.click(); }
    }));
    row.appendChild(file);
    if (current && onClear) {
      row.appendChild(A.el('button', { class: 'btn ghost sm icon', title: 'Svuota', html: A.icon('trash', 12), onclick: onClear }));
    }
    wrap.appendChild(row);

    var linkRow = A.el('div', { style: 'display:flex;gap:6px;' });
    var inp = A.el('input', {
      class: 'inp', type: 'url', placeholder: opts.linkPlaceholder || 'oppure incolla un link all\'immagine',
      value: current && /^https?:/.test(current) ? current : ''
    });
    function apply() {
      var v = inp.value.trim();
      if (!v) return;
      if (!/^https?:\/\//i.test(v)) { A.toast('Il link deve iniziare con http:// o https://'); return; }
      onSet(opts.read === A.readVideo ? { name: '', sizeBytes: 0, poster: '', dataUrl: v } : v);
    }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); apply(); } });
    linkRow.appendChild(inp);
    linkRow.appendChild(A.el('button', { class: 'btn sm', html: A.icon('link', 12) + 'Usa', onclick: apply }));
    wrap.appendChild(linkRow);

    return wrap;
  };

  /* ── Status dialog ────────────────────────────────────── */

  A.openStatusModal = function (post, actor) {
    var chosen = post.status;
    var pills = A.el('div', { style: 'display:flex;flex-direction:column;gap:6px;' });
    function paint() {
      A.clear(pills);
      A.STATUS.forEach(function (st) {
        var on = chosen === st.key;
        pills.appendChild(A.el('button', {
          type: 'button',
          style: 'display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;text-align:left;' +
                 'border:1px solid ' + (on ? st.c : 'var(--rule)') + ';background:' + (on ? st.sub : 'transparent') + ';' +
                 'font-size:13px;font-weight:600;color:var(--ink);',
          html: '<span style="width:8px;height:8px;border-radius:50%;background:' + st.c + '"></span>' + A.esc(st.label),
          onclick: function () { chosen = st.key; paint(); }
        }));
      });
    }
    paint();
    var noteBox = A.el('textarea', { class: 'ta', rows: '3', placeholder: 'Nota sul passaggio di stato (facoltativa)' });

    A.modal({
      title: 'Stato del contenuto',
      body: [pills, A.el('div', { class: 'field' }, [A.el('label', { text: 'Nota' }), noteBox])],
      actions: [
        { label: 'Annulla' },
        {
          label: 'Applica e salva', kind: 'primary',
          run: function () {
            A.setStatus(post.id, chosen, actor || 'studio', noteBox.value.trim());
            A.save({ quiet: true });
          }
        }
      ]
    });
  };

  /* ── The editor ───────────────────────────────────────── */

  function field(label, control, hint) {
    var f = A.el('div', { class: 'field' }, [A.el('label', { text: label }), control]);
    if (hint) f.appendChild(A.el('div', { class: 'hint', text: hint }));
    return f;
  }

  function tickRow(label, desc, on, onToggle, key) {
    var btn = A.el('button', {
      type: 'button', class: 'tick', 'aria-pressed': on ? 'true' : 'false',
      'data-focus': key || null,
      onclick: function () { onToggle(!on); }
    }, [
      A.el('span', { class: 'box', html: A.icon('check', 11) }),
      A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
        A.el('span', { class: 'tl', text: label }),
        desc ? A.el('span', { class: 'td', text: desc }) : null
      ])
    ]);
    return btn;
  }

  A.openPostEditor = function (postId, opts) {
    opts = opts || {};
    var post = A.get(postId);
    if (!post) return;
    var client = A.clientOfAccount(post.accountId);
    /* The dialog writes straight through, so the grid behind it updates as
       you type, and keeps a snapshot so Annulla can put everything back —
       including a post that was created only to be cancelled. */
    var snapshot = A.snap(post);
    var wasDirty = A.dirty;
    var closedBySave = false;
    var body = A.el('div', { style: 'display:flex;flex-direction:column;gap:16px;' });

    function redraw() { A.rebuild(build); }

    function build() {
      post = A.get(postId);
      if (!post) { A.closeModal(); return; }
      A.clear(body);

      /* type */
      var seg = A.el('div', { class: 'segment' });
      A.KINDS.forEach(function (k) {
        seg.appendChild(A.el('button', {
          type: 'button', 'aria-pressed': post.kind === k.key ? 'true' : 'false', text: k.label,
          'data-focus': 'kind-' + k.key,
          onclick: function () {
            var patch = { kind: k.key };
            if (k.key === 'carosello' && (!post.slides || !post.slides.length)) {
              patch.slides = [{ id: A.uid('sl'), url: post.mediaUrl || '', caption: '' },
                              { id: A.uid('sl'), url: '', caption: '' }];
            }
            A.updatePost(post.id, patch, { render: false });
            A.render(); redraw();
          }
        }));
      });
      body.appendChild(field('Tipo', seg));

      /* media */
      if (post.kind === 'editoriale') {
        var ed = post.editorial || (post.editorial = { eyebrow: '', title: '', sub: '' });
        var eye = A.el('input', { class: 'inp', value: ed.eyebrow || '', placeholder: 'Occhiello' });
        eye.addEventListener('input', function () { ed.eyebrow = eye.value; A.commit({ render: false }); });
        var tit = A.el('textarea', { class: 'ta', rows: '2', placeholder: 'Titolo della card' });
        tit.value = ed.title || '';
        tit.addEventListener('input', function () { ed.title = tit.value; A.commit({ render: false }); });
        var sub = A.el('textarea', { class: 'ta', rows: '2', placeholder: 'Sottotitolo' });
        sub.value = ed.sub || '';
        sub.addEventListener('input', function () { ed.sub = sub.value; A.commit({ render: false }); });
        body.appendChild(field('Card testuale',
          A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' }, [eye, tit, sub]),
          'Disegnata con i colori del brand del cliente. Nessun file da caricare.'));
      } else if (post.kind === 'carosello') {
        var slWrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:9px;' });
        (post.slides || []).forEach(function (sl, i) {
          var box = A.el('div', { class: 'slide-row' });
          var th = A.el('div', { class: 'slide-th' });
          if (sl.url) {
            var im = A.el('img', { src: sl.url, alt: '' });
            im.addEventListener('error', function () { im.remove(); th.textContent = '!'; });
            th.appendChild(im);
          } else th.textContent = String(i + 1);
          box.appendChild(th);
          box.appendChild(A.el('div', { style: 'flex:1 1 auto;min-width:0;' }, [
            A.mediaControl(sl.url, function (u) {
              sl.url = u;
              if (i === 0) post.mediaUrl = u;
              A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
            }, function () {
              sl.url = '';
              if (i === 0) post.mediaUrl = post.slides[0] ? post.slides[0].url : '';
              A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
            })
          ]));
          box.appendChild(A.el('button', {
            class: 'btn ghost sm icon', title: 'Rimuovi slide', html: A.icon('trash', 12),
            onclick: function () {
              post.slides = post.slides.filter(function (x) { return x.id !== sl.id; });
              post.mediaUrl = post.slides[0] ? post.slides[0].url : '';
              A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
            }
          }));
          slWrap.appendChild(box);
        });
        slWrap.appendChild(A.el('button', {
          class: 'btn sm', html: A.icon('plus', 12) + 'Aggiungi slide',
          onclick: function () {
            post.slides.push({ id: A.uid('sl'), url: '', caption: '' });
            A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
          }
        }));
        body.appendChild(field('Slide (' + (post.slides || []).length + ')', slWrap));
      } else if (post.kind === 'reel') {
        /* A reel is judged in the grid by its cover, so the cover is its own
           field. The video is kept beside it for whoever has to produce it. */
        var coverPrev = A.el('div', { class: 'thumb-prev' });
        if (post.coverUrl) {
          var ci = A.el('img', { src: post.coverUrl, alt: '' });
          ci.addEventListener('error', function () { ci.remove(); coverPrev.textContent = '!'; });
          coverPrev.appendChild(ci);
        } else coverPrev.innerHTML = A.icon('image', 16);
        body.appendChild(field('Copertina del reel',
          A.el('div', { style: 'display:flex;gap:11px;align-items:flex-start;' }, [
            coverPrev,
            A.el('div', { style: 'flex:1 1 auto;min-width:0;' }, [
              A.mediaControl(post.coverUrl, function (u) {
                A.updatePost(post.id, { coverUrl: u }, { render: false }); A.render(); redraw();
              }, function () {
                A.updatePost(post.id, { coverUrl: '' }, { render: false }); A.render(); redraw();
              })
            ])
          ]),
          'È questa che si vede nella griglia e nell\'anteprima.'));

        var vidWrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' });
        if (post.videoName || (post.mediaUrl || '').indexOf('data:video') === 0) {
          vidWrap.appendChild(A.el('div', { class: 'filechip' }, [
            (function () { var i = A.el('span'); i.innerHTML = A.icon('play', 11); return i; })(),
            A.el('span', { style: 'flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;', text: post.videoName || 'Video caricato' }),
            A.el('span', { style: 'color:var(--ink-3);font-weight:600;', text: (post.mediaUrl || '').indexOf('data:video') === 0 ? 'nel documento' : 'solo riferimento' })
          ]));
        }
        vidWrap.appendChild(A.mediaControl(post.mediaUrl, function (res) {
          /* the poster frame becomes the cover when there is not one yet */
          var patch = { videoName: res.name || '', mediaUrl: res.dataUrl || '' };
          if (!post.coverUrl && res.poster) patch.coverUrl = res.poster;
          A.updatePost(post.id, patch, { render: false });
          if (!res.dataUrl) {
            A.toast('Video troppo pesante (' + A.humanSize(res.sizeBytes) + '): tengo la copertina, aggiungi il link al file');
          }
          A.render(); redraw();
        }, function () {
          A.updatePost(post.id, { mediaUrl: '', videoName: '' }, { render: false });
          A.render(); redraw();
        }, {
          accept: 'video/*', read: A.readVideo,
          uploadLabel: 'Carica video', replaceLabel: 'Sostituisci video',
          linkPlaceholder: 'oppure incolla un link al video (Frame.io, Drive, WeTransfer…)'
        }));
        body.appendChild(field('Video', vidWrap,
          'Dal file carico anche un fotogramma come copertina. I video sopra ' + A.humanSize(A.VIDEO_INLINE_MAX) + ' restano un riferimento: in griglia conta la copertina.'));
      } else {
        body.appendChild(field('Immagine',
          A.mediaControl(post.mediaUrl, function (u) {
            A.updatePost(post.id, { mediaUrl: u, coverUrl: '' }, { render: false });
            A.render(); redraw();
          }, function () {
            A.updatePost(post.id, { mediaUrl: '', coverUrl: '' }, { render: false });
            A.render(); redraw();
          }),
          'I file caricati vengono ridimensionati e salvati nel documento. I link restano link.'));
      }

      /* when */
      var dIn = A.el('input', { class: 'inp', type: 'date', value: post.date || '' });
      var tIn = A.el('input', { class: 'inp', type: 'time', value: post.time || '' });
      dIn.addEventListener('change', function () {
        A.updatePost(post.id, { date: dIn.value }, { render: false });
        A.render(); redraw();
      });
      tIn.addEventListener('change', function () { A.updatePost(post.id, { time: tIn.value }, { render: false }); A.render(); });
      body.appendChild(field('Pubblicazione', A.el('div', { class: 'row' }, [
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Data' }), dIn]),
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Ora' }), tIn])
      ]), 'In griglia compare solo la data. L\'ora serve a ordinare due contenuti dello stesso giorno.'));

      /* caption */
      var capMax = A.formatOfAccount(A.curAccount()).platform.captionMax;
      var cap = A.el('textarea', { class: 'ta', rows: '7', placeholder: 'Scrivi la caption…' });
      cap.value = post.caption || '';
      var counter = A.el('div', { class: 'counter' });
      function countUp() {
        var n = cap.value.length;
        counter.textContent = n + ' / ' + capMax.toLocaleString('it-IT') + ' caratteri';
        counter.classList.toggle('over', n > capMax);
      }
      cap.addEventListener('input', function () {
        post.caption = cap.value;
        countUp();
        if (post.inStories) A.syncMirror(post.id);
        A.commit({ render: false });
        repaintCard(post);
      });
      countUp();
      body.appendChild(field('Caption', A.el('div', { style: 'display:flex;flex-direction:column;gap:4px;' }, [cap, counter])));

      /* classification */
      var cats = A.categoriesOf(client.id);
      var sel = A.el('select', { class: 'sel' });
      sel.appendChild(A.el('option', { value: '', text: 'Nessuna categoria' }));
      cats.forEach(function (c) {
        sel.appendChild(A.el('option', { value: c.id, text: c.name, selected: post.categoryId === c.id }));
      });
      sel.addEventListener('change', function () { A.updatePost(post.id, { categoryId: sel.value }, { render: false }); A.render(); });
      body.appendChild(field('Categoria', sel,
        cats.length ? null : 'Nessuna categoria definita per ' + client.name + '. Le trovi nella scheda cliente.'));

      /* nature: paid and partnership are independent, and can both be true */
      var isPartner = !!(post.partner || '').trim() || post._partnerOpen;
      var natWrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' }, [
        tickRow('Sponsorizzato', 'Contenuto messo a budget.', post.paid,
          function (v) { A.updatePost(post.id, { paid: v }, { render: false }); A.render(); redraw(); }, 'paid'),
        tickRow('In collaborazione', 'Contenuto fatto insieme a qualcun altro.', isPartner,
          function (v) {
            post._partnerOpen = v;
            A.updatePost(post.id, { partner: v ? post.partner : '' }, { render: false });
            A.render(); redraw();
          }, 'partner')
      ]);
      if (isPartner) {
        var pin = A.el('input', { class: 'inp', value: post.partner || '', placeholder: 'Con chi: brand, creator, ente…' });
        pin.addEventListener('input', function () { post.partner = pin.value; A.commit({ render: false }); });
        pin.addEventListener('change', function () { A.render(); });
        natWrap.appendChild(pin);
      }
      body.appendChild(field('Natura del contenuto', natWrap,
        'Si combinano: una collaborazione può anche essere sponsorizzata. Compare nell\'angolo in alto a sinistra.'));

      /* cross-posting to the client's other accounts */
      var sibs = A.siblingAccounts(post.accountId);
      if (sibs.length) {
        var cross = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' });
        sibs.forEach(function (a) {
          var on = (post.alsoOn || []).indexOf(a.id) >= 0;
          var f2 = A.formatOfAccount(a);
          cross.appendChild(tickRow(
            a.platform + ' · ' + a.handle,
            f2.sizeLabel + ' · ' + f2.w + '×' + f2.h + ' · max ' + f2.platform.captionMax.toLocaleString('it-IT') + ' caratteri',
            on,
            function (v) {
              var ids = (post.alsoOn || []).slice();
              var i = ids.indexOf(a.id);
              if (v && i < 0) ids.push(a.id);
              if (!v && i >= 0) ids.splice(i, 1);
              A.updatePost(post.id, { alsoOn: ids }, { render: false });
              A.render(); redraw();
            }, 'also-' + a.id));
        });
        body.appendChild(field('Pubblica anche su', cross,
          'Lo stesso contenuto compare nel feed di quegli account. Resta un record solo: la caption corretta una volta è corretta ovunque.'));
      }

      /* ticks */
      var ticks = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' }, [
        tickRow('Pubblica anche nelle Stories', 'Crea e tiene allineata una story collegata a questo contenuto.',
          post.inStories, function (v) { A.setInStories(post.id, v); redraw(); }, 'stories'),
        tickRow('Mostra la data in griglia', null,
          post.showDate, function (v) { A.updatePost(post.id, { showDate: v }, { render: false }); A.render(); redraw(); }, 'showdate')
      ]);
      body.appendChild(field('Opzioni', ticks));

      /* status, notes, history */
      var st = A.statusOf(post.status);
      body.appendChild(field('Stato', A.el('button', {
        type: 'button', class: 'btn',
        style: 'width:100%;justify-content:flex-start;border-color:' + st.c + ';background:' + st.sub + ';',
        html: '<span style="width:8px;height:8px;border-radius:50%;background:' + st.c + '"></span>' + A.esc(st.label),
        onclick: function () { A.openStatusModal(post); }
      }), post.revisions ? post.revisions + (post.revisions === 1 ? ' revisione richiesta dal cliente' : ' revisioni richieste dal cliente') : null));

      var note = A.el('textarea', { class: 'ta', rows: '3', placeholder: 'Visibile solo allo studio' });
      note.value = post.internalNote || '';
      note.addEventListener('input', function () { post.internalNote = note.value; A.commit({ render: false }); });
      body.appendChild(field('Nota interna', note));

      if (post.clientNote) {
        body.appendChild(A.el('div', {
          class: 'pv-note',
          html: '<b>' + A.esc(client.name) + (post.clientNoteAt ? ' · ' + new Date(post.clientNoteAt).toLocaleDateString('it-IT') : '') + '</b>' + A.esc(post.clientNote)
        }));
      }

      if (post.history && post.history.length) {
        var hist = A.el('div', { style: 'display:flex;flex-direction:column;gap:6px;' });
        post.history.slice().reverse().forEach(function (h) {
          var to = A.statusOf(h.to);
          hist.appendChild(A.el('div', { style: 'display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);line-height:1.45;' }, [
            A.el('span', { style: 'width:7px;height:7px;border-radius:50%;background:' + to.c + ';margin-top:5px;flex:0 0 auto;' }),
            A.el('span', {}, [
              A.el('b', { text: to.label }),
              ' · ' + (h.by === 'cliente' ? 'cliente' : 'studio') + ' · ' + new Date(h.at).toLocaleDateString('it-IT'),
              h.note ? A.el('div', { style: 'color:var(--ink-3);', text: h.note }) : null
            ])
          ]));
        });
        body.appendChild(field('Storico', hist));
      }
    }

    build();

    function cancel() {
      var live = A.get(postId);
      if (!live) return;
      if (opts.isNew) {
        A.S.posts = A.S.posts.filter(function (p) { return p.id !== postId; });
        var mirror = A.mirrorOf(postId);
        if (mirror) A.S.stories = A.S.stories.filter(function (x) { return x.id !== mirror.id; });
      } else {
        A.restore(live, snapshot);
        A.syncMirror(postId);
      }
      A.index();
      A.setSaveState(wasDirty ? 'dirty' : 'saved');
      A.render();
    }

    A.modal({
      title: opts.isNew ? 'Nuovo contenuto' : 'Contenuto',
      wide: true,
      body: [body],
      onClose: function () { if (!closedBySave) cancel(); },
      actions: [
        {
          label: 'Elimina', kind: 'danger', keepOpen: true, run: function () {
            A.confirm({
              title: 'Eliminare il contenuto?',
              body: 'L\'eliminazione viene scritta subito. Puoi annullarla dal messaggio in basso.',
              ok: 'Elimina', danger: true,
              run: function () { closedBySave = true; A.closeModal(); A.deletePost(postId); A.save({ quiet: true }); }
            });
            return false;
          }
        },
        { label: 'Anteprima', keepOpen: true, run: function () { A.openPostView(A.visiblePosts(), postId); } },
        { label: 'Annulla', run: function () { closedBySave = false; } },
        {
          label: 'Salva', kind: 'primary', run: function () {
            closedBySave = true;
            delete A.get(postId)._partnerOpen;
            A.save({ quiet: true });
            A.toast(opts.isNew ? 'Contenuto creato' : 'Contenuto salvato');
          }
        }
      ]
    });
  };

  /* ── Toolbar ──────────────────────────────────────────── */

  /* ── Filter panel ─────────────────────────────────────
     The filters used to sit in the toolbar as a wall of chips that
     wrapped onto a second row and pushed the grid down. They live
     behind one button now: the button says how many are on, so the
     state is never hidden, and the grid starts higher up.
  ──────────────────────────────────────────────────────── */

  function filterPanel(host, close) {
    var posts = A.curPosts();
    var client = A.curClient();
    var f = A.ui.filters;

    function section(title) {
      host.appendChild(A.el('div', { class: 'pop-sec', text: title }));
    }

    function option(cfg) {
      var row = A.el('button', {
        type: 'button', class: 'pop-opt', 'aria-pressed': cfg.on ? 'true' : 'false',
        disabled: cfg.n === 0 && !cfg.on ? true : null,
        onclick: function () { cfg.toggle(); A.render(); A.popover(A.$('#filter-btn'), filterPanel); }
      }, [
        A.el('span', { class: 'box', html: A.icon('check', 11) }),
        cfg.color ? A.el('span', { class: 'dot', style: 'background:' + cfg.color + ';' }) : null,
        A.el('span', { class: 'nm', text: cfg.label }),
        A.el('span', { class: 'n', text: String(cfg.n) })
      ]);
      host.appendChild(row);
    }

    section('Stato');
    A.STATUS.forEach(function (st) {
      option({
        label: st.label, color: st.c,
        n: posts.filter(function (p) { return p.status === st.key; }).length,
        on: (f.status || []).indexOf(st.key) >= 0,
        toggle: function () { A.toggleFilter('status', st.key); }
      });
    });

    section('Natura');
    option({
      label: 'Sponsorizzati',
      n: posts.filter(function (p) { return p.paid; }).length,
      on: f.paid, toggle: function () { f.paid = !f.paid; }
    });
    option({
      label: 'In collaborazione',
      n: posts.filter(function (p) { return (p.partner || '').trim(); }).length,
      on: f.partner, toggle: function () { f.partner = !f.partner; }
    });

    var cats = A.categoriesOf(client.id);
    if (cats.length) {
      section('Categoria');
      cats.forEach(function (c) {
        option({
          label: c.name, color: c.color,
          n: posts.filter(function (p) { return p.categoryId === c.id; }).length,
          on: (f.categoryId || []).indexOf(c.id) >= 0,
          toggle: function () { A.toggleFilter('categoryId', c.id); }
        });
      });
    }

    var n = A.filterCount();
    host.appendChild(A.el('div', { class: 'pop-foot' }, [
      A.el('span', { class: 'hint', text: n ? A.visiblePosts().length + ' di ' + posts.length + ' visibili' : 'Nessun filtro attivo' }),
      A.el('div', { class: 'bar-space' }),
      n ? A.el('button', {
        class: 'btn ghost sm', text: 'Azzera',
        onclick: function () { A.ui.filters = A.emptyFilters(); close(); A.render(); }
      }) : null
    ]));
  }

  /* ── Toolbar ──────────────────────────────────────────── */

  function toolbar() {
    var bar = A.el('div', { class: 'toolbar' });
    var posts = A.curPosts();
    var acc = A.curAccount();
    var client = A.curClient();
    if (!acc || !client) return bar;

    var counts = { foto: 0, reel: 0, carosello: 0, editoriale: 0 };
    posts.forEach(function (p) { counts[p.kind] = (counts[p.kind] || 0) + 1; });

    var stats = A.el('div', { class: 'toolbar-stats' });
    [['post', posts.length], ['reel', counts.reel], ['caroselli', counts.carosello], ['card', counts.editoriale]]
      .forEach(function (s) {
        stats.appendChild(A.el('span', { class: 'stat' }, [A.el('b', { text: String(s[1]) }), A.el('span', { text: s[0] })]));
      });
    bar.appendChild(stats);

    /* the format is a fact about the account, not a filter — it stays out
       in the open because it tells you how the grid is cropping */
    var fmt = A.formatOfAccount(acc);
    bar.appendChild(A.el('span', { class: 'bar-sep' }));
    bar.appendChild(A.el('button', {
      type: 'button', class: 'fmt-note', title: 'Formato impostato sull\'account — modificalo in Clienti',
      html: '<span class="dot" style="background:' + fmt.platform.color + '"></span>' +
            A.esc(acc.platform) + ' · ' + A.esc(fmt.sizeLabel) + ' · ' + fmt.w + '×' + fmt.h,
      onclick: function () { A.goClient(A.ui.clientId); }
    }));

    bar.appendChild(A.el('div', { class: 'bar-space' }));

    var active = A.filterCount();
    var fbtn = A.el('button', {
      type: 'button', id: 'filter-btn',
      class: 'btn sm' + (active ? ' on' : ''),
      html: A.icon('filter', 13) + 'Filtri' + (active ? '<span class="count">' + active + '</span>' : ''),
      onclick: function () { A.popover(fbtn, filterPanel); }
    });
    bar.appendChild(fbtn);

    [['date', 'Data'], ['caption', 'Testo']].forEach(function (t) {
      bar.appendChild(A.el('button', {
        type: 'button', class: 'toggle hide-sm', 'aria-pressed': A.ui.show[t[0]] ? 'true' : 'false',
        html: '<span class="led"></span>' + t[1],
        onclick: function () { A.ui.show[t[0]] = !A.ui.show[t[0]]; A.render(); }
      }));
    });

    bar.appendChild(A.el('button', {
      type: 'button', class: 'btn primary sm', html: A.icon('plus', 13) + 'Aggiungi', onclick: openAddMenu
    }));
    return bar;
  }

  function openAddMenu() {
    var grid = A.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px;' });
    A.KINDS.forEach(function (k) {
      grid.appendChild(A.el('button', {
        type: 'button',
        style: 'display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px;border:1px solid var(--rule);' +
               'border-radius:9px;background:var(--panel-2);text-align:left;font-size:13px;font-weight:600;color:var(--ink);',
        html: A.icon(k.icon, 17) + '<span>' + k.label + '</span>',
        onclick: function () {
          A.closeModal();
          var extra = {};
          if (k.key === 'carosello') {
            extra.slides = [{ id: A.uid('sl'), url: '', caption: '' }, { id: A.uid('sl'), url: '', caption: '' }];
          }
          if (k.key === 'editoriale') extra.editorial = { eyebrow: '', title: 'Scrivi il titolo', sub: '' };
          var p = A.addPost(k.key, extra);
          if (p) A.openPostEditor(p.id, { isNew: true });
        }
      }));
    });
    A.modal({ title: 'Nuovo contenuto', body: [grid] });
  }

  /* ── Grid ─────────────────────────────────────────────── */

  function grid() {
    var acc = A.curAccount();
    var wrap = A.el('div', { class: 'grid-wrap' });
    if (!acc) {
      wrap.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Nessun account selezionato' }),
        A.el('p', { text: 'Scegli un cliente e un account nella barra in alto per iniziare a comporre il mese.' })
      ]));
      return wrap;
    }

    var fmt = A.formatOfAccount(acc);
    var all = A.curPosts();
    var list = A.visiblePosts();

    if (!all.length) {
      wrap.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: A.monthLabel(A.ui.month) + ' è vuoto' }),
        A.el('p', { text: 'Aggiungi il primo contenuto: una foto, un reel, un carosello o una card di solo testo.' }),
        A.el('button', { class: 'btn primary', html: A.icon('plus', 13) + 'Aggiungi contenuto', onclick: openAddMenu })
      ]));
      return wrap;
    }

    var g = A.el('div', { class: 'grid', style: '--cols:' + fmt.cols + ';' });
    list.forEach(function (p) {
      g.appendChild(A.postCard(p, {
        onOpen: function (post) { A.openPostEditor(post.id); },
        onSelect: function (post) { A.openPostEditor(post.id); },
        onState: function (post) { A.openStatusModal(post); }
      }));
    });
    g.appendChild(A.el('button', {
      type: 'button', class: 'addcell', style: '--ratio:' + fmt.ratio + ';',
      html: A.icon('plus', 18) + '<span>Aggiungi</span>', onclick: openAddMenu
    }));
    wrap.appendChild(g);

    var foot = A.el('div', { style: 'margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);' });
    foot.appendChild(A.el('span', { text: 'Ordinati per data di pubblicazione. I contenuti senza data restano in fondo.' }));
    if (list.length < all.length) {
      foot.appendChild(A.el('span', { text: '·' }));
      foot.appendChild(A.el('span', { text: (all.length - list.length) + ' nascosti dai filtri' }));
      foot.appendChild(A.el('button', {
        class: 'btn ghost sm', text: 'Mostra tutti',
        onclick: function () { A.ui.filters = A.emptyFilters(); A.render(); }
      }));
    }
    wrap.appendChild(foot);
    return wrap;
  }

  /* Typing in the caption repaints only the card that changed. */
  function repaintCard(post) {
    var node = A.$('.card[data-id="' + post.id + '"]');
    if (!node) return;
    node.replaceWith(A.postCard(post, {
      onOpen: function (p) { A.openPostEditor(p.id); },
      onSelect: function (p) { A.openPostEditor(p.id); },
      onState: function (p) { A.openStatusModal(p); }
    }));
  }

  A.views = A.views || {};
  A.views.feed = function (host) {
    A.clear(host);
    host.appendChild(toolbar());
    var canvas = A.el('div', { class: 'canvas' });
    canvas.appendChild(grid());
    host.appendChild(canvas);
  };
})(window.IDE);
</script>
<script>
/* src/js/06-stories.js */
/* ============================================================
   Ideology — Stories
   Single stories and storyboards live in the same collection:
   a storyboard is a story with frames. The feed links to them
   by id, so a storyboard can be reordered or deleted without
   stranding the posts that reference it.
   ============================================================ */

(function (A) {
  'use strict';


  function toolbar() {
    var bar = A.el('div', { class: 'toolbar' });
    var list = A.curStories();
    var boards = list.filter(function (s) { return s.kind === 'storyboard'; });
    var stats = A.el('div', { class: 'toolbar-stats' }, [
      A.el('span', { class: 'stat' }, [A.el('b', { text: String(list.length - boards.length) }), A.el('span', { text: 'stories' })]),
      A.el('span', { class: 'stat' }, [A.el('b', { text: String(boards.length) }), A.el('span', { text: 'storyboard' })]),
      A.el('span', { class: 'stat' }, [A.el('b', { text: String(A.highlightsIn(A.ui.accountId).length) }), A.el('span', { text: 'in evidenza' })])
    ]);
    bar.appendChild(stats);
    bar.appendChild(A.el('div', { class: 'bar-space' }));
    bar.appendChild(A.el('button', {
      class: 'btn sm', html: A.icon('story', 12) + 'Story',
      onclick: function () { var st = A.addStory('story'); if (st) A.openStoryEditor(st.id, { isNew: true }); }
    }));
    bar.appendChild(A.el('button', {
      class: 'btn primary sm', html: A.icon('grid', 12) + 'Storyboard',
      onclick: function () { var st = A.addStory('storyboard'); if (st) A.openStoryEditor(st.id, { isNew: true }); }
    }));
    return bar;
  }

  function highlights() {
    var wrap = A.el('div');
    wrap.appendChild(A.el('div', { class: 'sec-title', text: 'In evidenza' }));
    var row = A.el('div', { class: 'hl-row' });
    A.highlightsIn(A.ui.accountId).forEach(function (h) {
      var b = A.el('button', { class: 'hl', title: h.title, type: 'button' });
      var ring = A.el('div', { class: 'ring' });
      if (h.coverUrl) ring.appendChild(A.el('img', { src: h.coverUrl, alt: '' }));
      else ring.innerHTML = A.icon('story', 18);
      b.appendChild(ring);
      b.appendChild(A.el('span', { class: 'nm', text: h.title }));
      b.addEventListener('click', function () { editHighlight(h); });
      row.appendChild(b);
    });
    var add = A.el('button', { class: 'hl', type: 'button', title: 'Nuova evidenza' });
    var ring2 = A.el('div', { class: 'ring', style: 'border-style:dashed;' });
    ring2.innerHTML = A.icon('plus', 18);
    add.appendChild(ring2);
    add.appendChild(A.el('span', { class: 'nm', text: 'Nuova' }));
    add.addEventListener('click', function () {
      var h = { id: A.uid('hl'), accountId: A.ui.accountId, title: 'Evidenza', coverUrl: '', storyIds: [] };
      A.S.highlights.push(h);
      A.commit();
      editHighlight(h, true);
    });
    row.appendChild(add);
    wrap.appendChild(row);
    return wrap;
  }

  function editHighlight(h, isNew) {
    var hSnap = A.snap(h), hWasDirty = A.dirty, hSaved = false, hNew = !!isNew;
    var name = A.el('input', { class: 'inp', value: h.title });
    var prev = A.el('div', {
      style: 'width:64px;height:64px;border-radius:50%;overflow:hidden;border:1px solid var(--rule);' +
             'background:var(--paper-2);display:flex;align-items:center;justify-content:center;color:var(--ink-4);'
    });
    function paint() {
      A.clear(prev);
      if (h.coverUrl) prev.appendChild(A.el('img', { src: h.coverUrl, alt: '', style: 'width:100%;height:100%;object-fit:cover;' }));
      else prev.innerHTML = A.icon('story', 18);
    }
    paint();
    A.modal({
      title: 'Evidenza',
      body: [
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Nome' }), name]),
        A.el('div', { style: 'display:flex;align-items:center;gap:12px;' }, [
          prev,
          A.el('div', { style: 'flex:1 1 auto;min-width:0;' }, [
            A.mediaControl(h.coverUrl, function (url) { h.coverUrl = url; paint(); A.commit({ render: false }); },
              function () { h.coverUrl = ''; paint(); A.commit({ render: false }); })
          ])
        ])
      ],
      onClose: function () { if (!hSaved) { A.restore(h, hSnap); if (hNew) A.S.highlights = A.S.highlights.filter(function (x) { return x.id !== h.id; }); A.index(); A.setSaveState(hWasDirty ? 'dirty' : 'saved'); A.render(); } },
      actions: [
        {
          label: 'Elimina', kind: 'danger', run: function () {
            hSaved = true;
            A.S.highlights = A.S.highlights.filter(function (x) { return x.id !== h.id; });
            A.commit(); A.save({ quiet: true });
          }
        },
        { label: 'Annulla' },
        { label: 'Salva', kind: 'primary', run: function () { hSaved = true; h.title = name.value.trim() || 'Evidenza'; A.commit(); A.save({ quiet: true }); } }
      ]
    });
  }

  function grid() {
    var list = A.curStories();
    var wrap = A.el('div');
    wrap.appendChild(A.el('div', { class: 'sec-title', text: 'Stories di ' + A.monthLabel(A.ui.month).toLowerCase() }));
    if (!list.length) {
      wrap.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Ancora nessuna story' }),
        A.el('p', { text: 'Una story singola per i contenuti del giorno, uno storyboard quando serve pianificare la sequenza frame per frame.' })
      ]));
      return wrap;
    }
    var g = A.el('div', { class: 'grid', style: '--cols:5;--gap:10px;' });
    list.forEach(function (st) {
      var card = A.el('div', {
        class: 'card', dataset: { id: st.id }
      });
      var cell = A.el('div', { class: 'cell', style: '--ratio:9/16;', role: 'button', tabindex: '0' });
      if (st.mediaUrl) cell.appendChild(A.el('img', { src: st.mediaUrl, alt: '', loading: 'lazy' }));
      else cell.appendChild(A.el('div', { class: 'ph' }, [
        (function () { var s = A.el('span'); s.innerHTML = A.icon('story', 18); return s; })(), 'Vuota'
      ]));
      if (st.kind === 'storyboard') {
        cell.appendChild(A.el('span', { class: 'cell-badge', html: A.icon('grid', 9) + '<span>' + st.frames.length + '</span>' }));
      }
      if (st.isUgc) {
        cell.appendChild(A.el('span', { class: 'c-bl', html: '<span class="dot" style="background:var(--ugc-girato)"></span>UGC' }));
      }
      if (st.fromPostId) {
        cell.appendChild(A.el('span', { class: 'c-tl', title: 'Collegata a un contenuto del feed', text: 'Dal feed' }));
      }
      if (st.date) cell.appendChild(A.el('span', { class: 'c-br', text: A.dayLabel(st.date) }));
      cell.addEventListener('click', function () { A.openStoryViewer(st); });
      cell.addEventListener('keydown', function (e) { if (e.key === 'Enter') A.openStoryViewer(st); });
      card.appendChild(cell);
      card.appendChild(A.el('div', { class: 'card-body' }, [
        A.el('div', { style: 'font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;', text: st.title || 'Senza titolo' })
      ]));
      card.addEventListener('click', function (e) {
        if (e.target.closest('.cell')) return;
        A.openStoryEditor(st.id);
      });
      g.appendChild(card);
    });
    wrap.appendChild(g);
    return wrap;
  }

  /* ── Editor ───────────────────────────────────────────── */

  A.openStoryEditor = function (storyId, opts) {
    opts = opts || {};
    var body = A.el('div', { style: 'display:flex;flex-direction:column;gap:15px;' });
    var snapshot = A.snap(A.get(storyId));
    var wasDirty = A.dirty;
    var closedBySave = false;

    function field(label, control, hint) {
      var f = A.el('div', { class: 'field' }, [A.el('label', { text: label }), control]);
      if (hint) f.appendChild(A.el('div', { class: 'hint', text: hint }));
      return f;
    }

    function redraw() { A.rebuild(build); }

    function build() {
      var st = A.get(storyId);
      if (!st) { A.closeModal(); return; }
      A.clear(body);

      var src = st.fromPostId ? A.get(st.fromPostId) : null;
      if (src) {
        body.appendChild(A.el('div', { class: 'pv-note internal' }, [
          A.el('b', { text: 'Collegata a un contenuto del feed' }),
          A.el('span', { text: 'Visual, titolo e data seguono il post. Per scollegarla, togli la spunta "Pubblica anche nelle Stories" dal contenuto.' })
        ]));
      }

      var title = A.el('input', { class: 'inp', value: st.title || '', placeholder: 'Titolo' });
      title.disabled = !!src;
      title.addEventListener('input', function () { st.title = title.value; A.commit({ render: false }); });
      body.appendChild(field('Titolo', title));

      var dIn = A.el('input', { class: 'inp', type: 'date', value: st.date || '' });
      dIn.disabled = !!src;
      dIn.addEventListener('change', function () { st.date = dIn.value; A.commit(); redraw(); });
      body.appendChild(field('Data', dIn));

      if (st.kind === 'storyboard') {
        var fr = A.el('div', { style: 'display:flex;flex-direction:column;gap:9px;' });
        st.frames.forEach(function (f, i) {
          var row = A.el('div', { class: 'slide-row' });
          var th = A.el('div', { class: 'slide-th' });
          if (f.url) th.appendChild(A.el('img', { src: f.url, alt: '' }));
          else th.textContent = String(i + 1);
          row.appendChild(th);
          var col = A.el('div', { style: 'flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;' });
          var note = A.el('input', { class: 'inp', value: f.note || '', placeholder: 'Nota di regia' });
          note.addEventListener('input', function () { f.note = note.value; A.commit({ render: false }); });
          col.appendChild(note);
          col.appendChild(A.mediaControl(f.url, function (u) {
            f.url = u;
            if (i === 0) st.mediaUrl = u;
            A.commit({ render: false }); A.render(); redraw();
          }, function () {
            f.url = '';
            if (i === 0) st.mediaUrl = st.frames[0] ? st.frames[0].url : '';
            A.commit({ render: false }); A.render(); redraw();
          }));
          row.appendChild(col);
          row.appendChild(A.el('button', {
            class: 'btn ghost sm icon', title: 'Rimuovi frame', html: A.icon('trash', 12),
            onclick: function () {
              st.frames = st.frames.filter(function (x) { return x.id !== f.id; });
              st.mediaUrl = st.frames[0] ? st.frames[0].url : '';
              A.commit({ render: false }); A.render(); redraw();
            }
          }));
          fr.appendChild(row);
        });
        fr.appendChild(A.el('button', {
          class: 'btn sm', html: A.icon('plus', 12) + 'Aggiungi frame',
          onclick: function () { st.frames.push({ id: A.uid('fr'), url: '', note: '' }); A.commit({ render: false }); A.render(); redraw(); }
        }));
        body.appendChild(field('Frame (' + st.frames.length + ')', fr));
      } else if (!src) {
        body.appendChild(field('Visual', A.mediaControl(st.mediaUrl,
          function (u) { st.mediaUrl = u; A.commit({ render: false }); A.render(); redraw(); },
          function () { st.mediaUrl = ''; A.commit({ render: false }); A.render(); redraw(); })));
      }

      body.appendChild(field('Origine', A.el('button', {
        type: 'button', class: 'tick', 'aria-pressed': st.isUgc ? 'true' : 'false',
        'data-focus': 'ugc',
        onclick: function () { st.isUgc = !st.isUgc; A.commit({ render: false }); A.render(); redraw(); }
      }, [
        A.el('span', { class: 'box', html: A.icon('check', 11) }),
        A.el('span', {}, [A.el('span', { class: 'tl', text: 'Contenuto UGC' })])
      ])));

      var linked = A.S.posts.filter(function (p) { return (p.storyIds || []).indexOf(st.id) >= 0; });
      if (linked.length) {
        var lw = A.el('div', { style: 'display:flex;flex-direction:column;gap:5px;' });
        linked.forEach(function (p) {
          lw.appendChild(A.el('button', {
            class: 'btn sm', style: 'justify-content:flex-start;width:100%;',
            text: (p.caption || 'Contenuto senza testo').slice(0, 40),
            onclick: function () { A.closeModal(); A.ui.tab = 'feed'; A.render(); A.openPostEditor(p.id); }
          }));
        });
        body.appendChild(field('Collegata a', lw));
      }
    }

    build();

    function cancel() {
      var live = A.get(storyId);
      if (!live) return;
      if (opts.isNew) A.S.stories = A.S.stories.filter(function (x) { return x.id !== storyId; });
      else A.restore(live, snapshot);
      A.index();
      A.setSaveState(wasDirty ? 'dirty' : 'saved');
      A.render();
    }

    A.modal({
      title: (A.get(storyId) || {}).kind === 'storyboard' ? 'Storyboard' : 'Story',
      wide: true,
      body: [body],
      onClose: function () { if (!closedBySave) cancel(); },
      actions: [
        {
          label: 'Elimina', kind: 'danger', keepOpen: true, run: function () {
            A.confirm({
              title: 'Eliminare?', body: 'L\'eliminazione viene scritta subito.',
              ok: 'Elimina', danger: true,
              run: function () { closedBySave = true; A.closeModal(); A.deleteStory(storyId); A.save({ quiet: true }); }
            });
            return false;
          }
        },
        { label: 'Annulla' },
        { label: 'Salva', kind: 'primary', run: function () { closedBySave = true; A.save({ quiet: true }); A.toast('Story salvata'); } }
      ]
    });
  };

  A.views = A.views || {};
  A.views.stories = function (host) {
    A.clear(host);
    if (!A.ui.accountId) {
      host.appendChild(A.el('div', { class: 'empty' }, [A.el('h4', { text: 'Nessun account selezionato' })]));
      return;
    }
    host.appendChild(toolbar());
    var canvas = A.el('div', { class: 'canvas' });
    canvas.appendChild(highlights());
    canvas.appendChild(grid());
    host.appendChild(canvas);
  };
})(window.IDE);
</script>
<script>
/* src/js/07-ugc.js */
/* ============================================================
   Ideology — UGC
   The plan is keyed on the account id, not the client's name,
   so renaming a client never orphans a month of work. Slots,
   creators and briefs are one collection each with real ids.
   ============================================================ */

(function (A) {
  'use strict';

  var MODES = [
    { key: 'autonoma', label: 'Spontaneo' },
    { key: 'creator',  label: 'Creator' },
    { key: 'template', label: 'Template' }
  ];
  function modeLabel(k) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].key === k) return MODES[i].label;
    return k;
  }

  function toolbar() {
    A.ui.ugcTab = A.ui.ugcTab || 'calendario';
    var bar = A.el('div', { class: 'toolbar' });
    var slots = A.curUgc();
    var client = A.curClient();

    var seg = A.el('div', { class: 'segment', style: 'max-width:340px;flex:0 0 auto;' });
    [['calendario', 'Calendario'], ['elenco', 'Elenco'], ['creator', 'Creator'], ['anno', 'Anno']].forEach(function (t) {
      seg.appendChild(A.el('button', {
        type: 'button', 'aria-pressed': A.ui.ugcTab === t[0] ? 'true' : 'false', text: t[1],
        onclick: function () { A.ui.ugcTab = t[0]; A.render(); }
      }));
    });
    bar.appendChild(seg);
    bar.appendChild(A.el('span', { class: 'bar-sep' }));

    var stats = A.el('div', { class: 'toolbar-stats' });
    A.UGC_STATUS.forEach(function (s) {
      var n = slots.filter(function (u) { return u.status === s.key; }).length;
      stats.appendChild(A.el('span', { class: 'stat' }, [
        A.el('b', { text: String(n), style: 'color:' + s.c }),
        A.el('span', { text: s.label.toLowerCase() })
      ]));
    });
    bar.appendChild(stats);
    bar.appendChild(A.el('div', { class: 'bar-space' }));

    if (A.ui.ugcTab === 'calendario' || A.ui.ugcTab === 'elenco') {
      var days = A.el('div', { class: 'daybtns hide-sm' });
      A.DAY_NAMES.forEach(function (d, i) {
        days.appendChild(A.el('button', {
          type: 'button', class: 'daybtn', text: d[0],
          title: d, 'aria-pressed': (A.S.prefs.ugcDays || []).indexOf(i) >= 0 ? 'true' : 'false',
          onclick: function () {
            var arr = (A.S.prefs.ugcDays || []).slice();
            var k = arr.indexOf(i);
            if (k >= 0) arr.splice(k, 1); else arr.push(i);
            A.S.prefs.ugcDays = arr;
            A.commit();
          }
        }));
      });
      bar.appendChild(days);
      bar.appendChild(A.el('button', { class: 'btn sm', text: 'Genera mese', onclick: A.generateUgcMonth }));
      bar.appendChild(A.el('button', { class: 'btn ghost sm', text: 'Pulisci vuoti', onclick: A.clearEmptyUgc }));
      bar.appendChild(A.el('button', {
        class: 'btn primary sm', html: A.icon('plus', 12) + 'Slot',
        onclick: function () { var s = A.addUgcSlot(A.ui.month + '-' + A.pad(new Date().getDate())); if (s) A.openSlotEditor(s.id, { isNew: true }); }
      }));
    }
    if (A.ui.ugcTab === 'creator' && client) {
      bar.appendChild(A.el('button', {
        class: 'btn primary sm', html: A.icon('plus', 12) + 'Creator',
        onclick: function () { editCreator(A.addCreator(client.id, { name: 'Nuovo creator' }), true); }
      }));
    }
    return bar;
  }

  /* ── Calendar ─────────────────────────────────────────── */

  function calendar() {
    var wrap = A.el('div', { class: 'cal' });
    var mk = A.ui.month.split('-');
    var y = parseInt(mk[0], 10), m = parseInt(mk[1], 10);
    var first = new Date(y, m - 1, 1);
    var startDow = (first.getDay() + 6) % 7;
    var daysIn = new Date(y, m, 0).getDate();
    var prevDays = new Date(y, m - 1, 0).getDate();
    var today = A.todayKey();

    var byDate = {};
    A.curUgc().forEach(function (u) { (byDate[u.date] = byDate[u.date] || []).push(u); });
    var postsByDate = {};
    A.curPosts().forEach(function (p) { if (p.date) (postsByDate[p.date] = postsByDate[p.date] || []).push(p); });
    var storiesByDate = {};
    A.curStories().forEach(function (s) { if (s.date) (storiesByDate[s.date] = storiesByDate[s.date] || []).push(s); });

    var head = A.el('div', { class: 'cal-head' });
    A.DAY_NAMES.forEach(function (d) { head.appendChild(A.el('div', { class: 'cal-dh', text: d })); });
    wrap.appendChild(head);

    var grid = A.el('div', { class: 'cal-grid' });
    var cells = Math.ceil((startDow + daysIn) / 7) * 7;
    var day = 1, next = 1;

    for (var i = 0; i < cells; i++) {
      var off = false, dd, mm = m, yy = y;
      if (i < startDow) { dd = prevDays - startDow + i + 1; mm = m - 1; off = true; if (mm < 1) { mm = 12; yy = y - 1; } }
      else if (day > daysIn) { dd = next++; mm = m + 1; off = true; if (mm > 12) { mm = 1; yy = y + 1; } }
      else dd = day++;

      var iso = yy + '-' + A.pad(mm) + '-' + A.pad(dd);
      var cell = A.el('button', {
        type: 'button',
        class: 'cal-day' + (off ? ' off' : '') + (iso === today ? ' today' : ''),
        dataset: { date: iso }
      });
      cell.appendChild(A.el('span', { class: 'd', text: String(dd) }));

      if (!off) {
        (postsByDate[iso] || []).slice(0, 1).forEach(function (p) {
          cell.appendChild(A.el('span', {
            class: 'ev', style: '--c:var(--ink-3);',
            text: p.kind === 'reel' ? 'Reel in feed' : 'Post in feed'
          }));
        });
        (storiesByDate[iso] || []).slice(0, 1).forEach(function (s) {
          cell.appendChild(A.el('span', { class: 'ev', style: '--c:var(--cobalt);', text: s.title || 'Story' }));
        });
        (byDate[iso] || []).slice(0, 2).forEach(function (u) {
          var st = A.ugcStatusOf(u.status);
          cell.appendChild(A.el('span', {
            class: 'ev', style: '--c:' + st.c + ';',
            html: '<span class="dot"></span>' + A.esc(u.brief || modeLabel(u.mode))
          }));
        });
        var extra = (byDate[iso] || []).length - 2;
        if (extra > 0) cell.appendChild(A.el('span', { class: 'cal-more', text: '+' + extra }));
      }

      (function (isoDate, isOff) {
        cell.addEventListener('click', function () {
          if (isOff) return;
          var existing = byDate[isoDate] || [];
          if (existing.length) { A.openSlotEditor(existing[0].id); }
          else { var s = A.addUgcSlot(isoDate); if (s) A.openSlotEditor(s.id, { isNew: true }); }
        });
      })(iso, off);

      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  /* ── List ─────────────────────────────────────────────── */

  function list() {
    var wrap = A.el('div');
    var slots = A.curUgc();
    if (!slots.length) {
      wrap.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Nessuno slot per ' + A.monthLabel(A.ui.month).toLowerCase() }),
        A.el('p', { text: 'Scegli i giorni della settimana nella barra e usa "Genera mese" per riempire il calendario con la frequenza concordata.' })
      ]));
      return wrap;
    }
    slots.forEach(function (u) {
      var st = A.ugcStatusOf(u.status);
      var cr = A.get(u.creatorId);
      var row = A.el('button', {
        type: 'button', class: 'creator',
        onclick: function () { A.openSlotEditor(u.id); }
      }, [
        A.el('span', { style: 'width:3px;height:30px;border-radius:2px;background:' + st.c + ';flex:0 0 auto;' }),
        A.el('span', { style: 'min-width:62px;font-size:11.5px;font-weight:700;color:var(--ink-2);', text: A.dayLabel(u.date) }),
        A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
          A.el('span', { class: 'nm', style: 'display:block;', text: u.brief || modeLabel(u.mode) }),
          A.el('span', { class: 'sub', text: st.label + (cr ? ' · ' + cr.name : '') })
        ]),
        A.el('span', { class: 'tagpill', text: modeLabel(u.mode) })
      ]);
      wrap.appendChild(row);
    });
    return wrap;
  }

  /* ── Creators ─────────────────────────────────────────── */

  function creators() {
    var client = A.curClient();
    var wrap = A.el('div');
    var list = A.creatorsOf(client.id);
    if (!list.length) {
      wrap.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Nessun creator in rubrica' }),
        A.el('p', { text: 'Tieni qui chi collabora con il cliente: tariffa, stato della trattativa e slot assegnati.' })
      ]));
      return wrap;
    }
    var totFee = list.reduce(function (s, c) { return s + (Number(c.fee) || 0); }, 0);
    var reach = list.reduce(function (s, c) { return s + (Number(c.followers) || 0); }, 0);
    wrap.appendChild(A.el('div', { class: 'toolbar-stats', style: 'margin-bottom:16px;gap:22px;' }, [
      A.el('span', { class: 'stat' }, [A.el('b', { text: String(list.length) }), A.el('span', { text: 'creator' })]),
      A.el('span', { class: 'stat' }, [A.el('b', { text: '€' + totFee.toLocaleString('it-IT') }), A.el('span', { text: 'budget impegnato' })]),
      A.el('span', { class: 'stat' }, [A.el('b', { text: A.fmtNum(reach) }), A.el('span', { text: 'follower complessivi' })])
    ]));
    list.forEach(function (c) {
      var slots = A.S.ugcSlots.filter(function (u) { return u.creatorId === c.id; });
      wrap.appendChild(A.el('button', {
        type: 'button', class: 'creator', onclick: function () { editCreator(c); }
      }, [
        A.el('span', { class: 'av', text: A.initials(c.name) }),
        A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
          A.el('span', { class: 'nm', style: 'display:block;', text: c.name || 'Senza nome' }),
          A.el('span', { class: 'sub', text: (c.handle || '') + ' · ' + A.fmtNum(c.followers) + ' follower' + (slots.length ? ' · ' + slots.length + ' slot' : '') })
        ]),
        A.el('span', { class: 'tagpill', text: (A.CREATOR_STATUS.filter(function (s) { return s.key === c.status; })[0] || {}).label || c.status }),
        A.el('span', { style: 'font-size:11.5px;font-weight:700;color:var(--ink-2);', text: c.fee ? '€' + c.fee : '—' })
      ]));
    });
    return wrap;
  }

  function editCreator(c, isNew) {
    var cSnap = A.snap(c), cWasDirty = A.dirty, cSaved = false;
    var name = A.el('input', { class: 'inp', value: c.name });
    var handle = A.el('input', { class: 'inp', value: c.handle, placeholder: '@handle' });
    var fol = A.el('input', { class: 'inp', type: 'number', value: c.followers || 0 });
    var fee = A.el('input', { class: 'inp', type: 'number', value: c.fee || 0 });
    var stat = A.el('select', { class: 'sel' });
    A.CREATOR_STATUS.forEach(function (s) {
      stat.appendChild(A.el('option', { value: s.key, text: s.label, selected: c.status === s.key }));
    });
    var note = A.el('textarea', { class: 'ta', rows: '3' });
    note.value = c.note || '';
    A.modal({
      title: 'Creator',
      body: [
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Nome' }), name]),
        A.el('div', { class: 'row' }, [
          A.el('div', { class: 'field' }, [A.el('label', { text: 'Handle' }), handle]),
          A.el('div', { class: 'field' }, [A.el('label', { text: 'Follower' }), fol])
        ]),
        A.el('div', { class: 'row' }, [
          A.el('div', { class: 'field' }, [A.el('label', { text: 'Compenso €' }), fee]),
          A.el('div', { class: 'field' }, [A.el('label', { text: 'Stato' }), stat])
        ]),
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Note' }), note])
      ],
      onClose: function () {
        if (cSaved) return;
        if (isNew) A.deleteCreator(c.id);
        else { A.restore(c, cSnap); A.index(); }
        A.setSaveState(cWasDirty ? 'dirty' : 'saved');
        A.render();
      },
      actions: [
        { label: 'Elimina', kind: 'danger', run: function () { cSaved = true; A.deleteCreator(c.id); A.save({ quiet: true }); } },
        { label: 'Annulla' },
        {
          label: 'Salva', kind: 'primary', run: function () {
            cSaved = true;
            c.name = name.value.trim() || 'Senza nome';
            c.handle = handle.value.trim();
            c.followers = Number(fol.value) || 0;
            c.fee = Number(fee.value) || 0;
            c.status = stat.value;
            c.note = note.value;
            A.commit();
            A.save({ quiet: true });
          }
        }
      ]
    });
  }

  /* ── Year ─────────────────────────────────────────────── */

  function year() {
    var wrap = A.el('div');
    var y = A.ui.month.split('-')[0];
    var all = A.ugcInYear(A.ui.accountId, y);
    var max = 1;
    var byMonth = {};
    for (var i = 1; i <= 12; i++) byMonth[y + '-' + A.pad(i)] = [];
    all.forEach(function (u) {
      var k = A.monthOfDay(u.date);
      if (byMonth[k]) byMonth[k].push(u);
    });
    Object.keys(byMonth).forEach(function (k) { max = Math.max(max, byMonth[k].length); });

    wrap.appendChild(A.el('div', { class: 'sec-title', text: 'Anno ' + y + ' · ' + all.length + ' slot' }));
    var g = A.el('div', { class: 'year' });
    for (var m = 1; m <= 12; m++) {
      (function (mi) {
        var key = y + '-' + A.pad(mi);
        var slots = byMonth[key];
        var done = slots.filter(function (u) { return u.status === 'consegnato'; }).length;
        var cell = A.el('button', {
          type: 'button',
          class: 'ymonth' + (key === A.thisMonth() ? ' now' : ''),
          onclick: function () { A.ui.month = key; A.ui.ugcTab = 'calendario'; A.render(); }
        }, [
          A.el('span', { class: 'm', text: A.MONTH_NAMES[mi - 1] }),
          A.el('span', { class: 'track' }, [
            A.el('span', { class: 'fill', style: 'width:' + Math.round(slots.length / max * 100) + '%;' })
          ]),
          A.el('span', { class: 'n', text: slots.length ? slots.length + ' slot · ' + done + ' consegnati' : 'vuoto' })
        ]);
        g.appendChild(cell);
      })(m);
    }
    wrap.appendChild(g);
    return wrap;
  }

  /* ── Slot editor ──────────────────────────────────────── */

  A.openSlotEditor = function (slotId, opts) {
    opts = opts || {};
    var body = A.el('div', { style: 'display:flex;flex-direction:column;gap:15px;' });
    var snapshot = A.snap(A.get(slotId));
    var wasDirty = A.dirty;
    var closedBySave = false;

    function field(label, control) {
      return A.el('div', { class: 'field' }, [A.el('label', { text: label }), control]);
    }

    function redraw() { A.rebuild(build); }

    function build() {
      var u = A.get(slotId);
      if (!u) { A.closeModal(); return; }
      var client = A.clientOfAccount(u.accountId);
      A.clear(body);

      var dIn = A.el('input', { class: 'inp', type: 'date', value: u.date });
      dIn.addEventListener('change', function () { u.date = dIn.value; A.commit(); redraw(); });
      body.appendChild(field('Data', dIn));

      var seg = A.el('div', { class: 'segment' });
      MODES.forEach(function (m) {
        seg.appendChild(A.el('button', {
          type: 'button', 'aria-pressed': u.mode === m.key ? 'true' : 'false', text: m.label,
          'data-focus': 'mode-' + m.key,
          onclick: function () { u.mode = m.key; A.commit({ render: false }); A.render(); redraw(); }
        }));
      });
      body.appendChild(field('Origine', seg));

      var stSeg = A.el('div', { style: 'display:flex;flex-direction:column;gap:5px;' });
      A.UGC_STATUS.forEach(function (st) {
        var on = u.status === st.key;
        stSeg.appendChild(A.el('button', {
          type: 'button',
          style: 'display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:7px;text-align:left;font-size:12.5px;font-weight:600;' +
                 'border:1px solid ' + (on ? st.c : 'var(--rule)') + ';background:' + (on ? 'var(--panel-2)' : 'transparent') + ';color:var(--ink);',
          'data-focus': 'ugcst-' + st.key,
          html: '<span style="width:7px;height:7px;border-radius:50%;background:' + st.c + '"></span>' + st.label,
          onclick: function () { u.status = st.key; A.commit({ render: false }); A.render(); redraw(); }
        }));
      });
      body.appendChild(field('Stato', stSeg));

      var brief = A.el('textarea', { class: 'ta', rows: '4', placeholder: 'Cosa deve mostrare il contenuto' });
      brief.value = u.brief || '';
      brief.addEventListener('input', function () { u.brief = brief.value; A.commit({ render: false }); });
      body.appendChild(field('Brief', brief));

      if (u.mode === 'creator') {
        var sel = A.el('select', { class: 'sel' });
        sel.appendChild(A.el('option', { value: '', text: 'Nessun creator' }));
        A.creatorsOf(client.id).forEach(function (c) {
          sel.appendChild(A.el('option', { value: c.id, text: c.name, selected: u.creatorId === c.id }));
        });
        sel.addEventListener('change', function () { u.creatorId = sel.value; A.commit({ render: false }); A.render(); });
        body.appendChild(field('Creator', sel));
      }

      var note = A.el('textarea', { class: 'ta', rows: '3' });
      note.value = u.note || '';
      note.addEventListener('input', function () { u.note = note.value; A.commit({ render: false }); });
      body.appendChild(field('Note', note));
    }

    build();
    var slot = A.get(slotId);
    function cancel() {
      var live = A.get(slotId);
      if (!live) return;
      if (opts.isNew) A.S.ugcSlots = A.S.ugcSlots.filter(function (x) { return x.id !== slotId; });
      else A.restore(live, snapshot);
      A.index();
      A.setSaveState(wasDirty ? 'dirty' : 'saved');
      A.render();
    }

    A.modal({
      title: 'Slot UGC · ' + (slot ? A.dayLabel(slot.date) : ''),
      body: [body],
      onClose: function () { if (!closedBySave) cancel(); },
      actions: [
        {
          label: 'Elimina', kind: 'danger', keepOpen: true, run: function () {
            A.confirm({
              title: 'Eliminare lo slot?', body: 'L\'eliminazione viene scritta subito.',
              ok: 'Elimina', danger: true,
              run: function () { closedBySave = true; A.closeModal(); A.deleteUgcSlot(slotId); A.save({ quiet: true }); }
            });
            return false;
          }
        },
        { label: 'Annulla' },
        { label: 'Salva', kind: 'primary', run: function () { closedBySave = true; A.save({ quiet: true }); A.toast('Slot salvato'); } }
      ]
    });
  };

  A.views = A.views || {};
  A.views.ugc = function (host) {
    A.clear(host);
    if (!A.ui.accountId) {
      host.appendChild(A.el('div', { class: 'empty' }, [A.el('h4', { text: 'Nessun account selezionato' })]));
      return;
    }
    A.ui.ugcTab = A.ui.ugcTab || 'calendario';
    host.appendChild(toolbar());
    var canvas = A.el('div', { class: 'canvas' });
    if (A.ui.ugcTab === 'calendario') canvas.appendChild(calendar());
    else if (A.ui.ugcTab === 'elenco') canvas.appendChild(list());
    else if (A.ui.ugcTab === 'creator') canvas.appendChild(creators());
    else canvas.appendChild(year());
    host.appendChild(canvas);
  };
})(window.IDE);
</script>
<script>
/* src/js/08-calendar.js */
/* ============================================================
   Ideology — Calendario
   Everything dated in one month: feed posts, stories and UGC
   slots. Dragging a post onto a day moves its publication date.
   ============================================================ */

(function (A) {
  'use strict';

  function eventsFor(month) {
    var map = {};
    function push(iso, ev) { if (!iso) return; (map[iso] = map[iso] || []).push(ev); }
    A.postsIn(A.ui.accountId, month).forEach(function (p) {
      var st = A.statusOf(p.status);
      push(p.date, {
        c: st.c, kind: 'post', id: p.id,
        label: (A.natureOf(p).short ? A.natureOf(p).short + ' · ' : '') +
               (p.kind === 'reel' ? 'Reel' : p.kind === 'carosello' ? 'Carosello' : p.kind === 'editoriale' ? 'Card' : 'Post') +
               (p.caption ? ' · ' + p.caption.split('\n')[0].slice(0, 24) : '')
      });
    });
    A.storiesIn(A.ui.accountId, month).forEach(function (s) {
      push(s.date, { c: 'var(--cobalt)', kind: 'story', id: s.id, label: (s.kind === 'storyboard' ? 'Storyboard' : 'Story') + ' · ' + (s.title || '') });
    });
    A.ugcIn(A.ui.accountId, month).forEach(function (u) {
      var st = A.ugcStatusOf(u.status);
      push(u.date, { c: st.c, kind: 'ugc', id: u.id, label: 'UGC · ' + (u.brief || st.label) });
    });
    return map;
  }

  function legend() {
    var bar = A.el('div', { class: 'toolbar' });
    var items = [
      ['Feed', 'var(--ink-3)'],
      ['Stories', 'var(--cobalt)'],
      ['UGC', 'var(--ugc-girato)']
    ];
    var wrap = A.el('div', { class: 'toolbar-stats' });
    items.forEach(function (i) {
      wrap.appendChild(A.el('span', {
        style: 'display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2);',
        html: '<span style="width:8px;height:8px;border-radius:2px;background:' + i[1] + '"></span>' + i[0]
      }));
    });
    bar.appendChild(wrap);
    bar.appendChild(A.el('div', { class: 'bar-space' }));
    bar.appendChild(A.el('span', {
      style: 'font-size:11.5px;color:var(--ink-3);',
      text: 'Trascina un contenuto su un altro giorno per spostarne la data.'
    }));
    return bar;
  }

  function monthGrid() {
    var wrap = A.el('div', { class: 'cal' });
    var mk = A.ui.month.split('-');
    var y = parseInt(mk[0], 10), m = parseInt(mk[1], 10);
    var startDow = (new Date(y, m - 1, 1).getDay() + 6) % 7;
    var daysIn = new Date(y, m, 0).getDate();
    var prevDays = new Date(y, m - 1, 0).getDate();
    var today = A.todayKey();
    var map = eventsFor(A.ui.month);

    var head = A.el('div', { class: 'cal-head' });
    A.DAY_NAMES.forEach(function (d) { head.appendChild(A.el('div', { class: 'cal-dh', text: d })); });
    wrap.appendChild(head);

    var grid = A.el('div', { class: 'cal-grid' });
    var cells = Math.ceil((startDow + daysIn) / 7) * 7;
    var day = 1, next = 1;

    for (var i = 0; i < cells; i++) {
      var off = false, dd, mm = m, yy = y;
      if (i < startDow) { dd = prevDays - startDow + i + 1; mm = m - 1; off = true; if (mm < 1) { mm = 12; yy = y - 1; } }
      else if (day > daysIn) { dd = next++; mm = m + 1; off = true; if (mm > 12) { mm = 1; yy = y + 1; } }
      else dd = day++;

      var iso = yy + '-' + A.pad(mm) + '-' + A.pad(dd);
      var cell = A.el('div', {
        class: 'cal-day' + (off ? ' off' : '') + (iso === today ? ' today' : ''),
        style: 'min-height:116px;'
      });
      cell.appendChild(A.el('span', { class: 'd', text: String(dd) }));

      if (!off) {
        (map[iso] || []).slice(0, 3).forEach(function (ev) {
          var node = A.el('span', {
            class: 'ev', style: '--c:' + ev.c + ';', text: ev.label, title: ev.label
          });
          if (ev.kind === 'post') {
            node.setAttribute('draggable', 'true');
            node.style.cursor = 'grab';
            node.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', ev.id); });
          }
          node.addEventListener('click', function (e) {
            e.stopPropagation();
            if (ev.kind === 'post') { A.ui.tab = 'feed'; A.render(); A.openPostEditor(ev.id); return; }
            if (ev.kind === 'story') { A.ui.tab = 'stories'; A.render(); A.openStoryEditor(ev.id); return; }
            A.ui.tab = 'ugc'; A.ui.ugcTab = 'calendario'; A.render(); A.openSlotEditor(ev.id);
          });
          cell.appendChild(node);
        });
        var extra = (map[iso] || []).length - 3;
        if (extra > 0) cell.appendChild(A.el('span', { class: 'cal-more', text: '+' + extra + ' altri' }));

        (function (isoDate) {
          cell.addEventListener('dragover', function (e) { e.preventDefault(); cell.style.borderColor = 'var(--cobalt)'; });
          cell.addEventListener('dragleave', function () { cell.style.borderColor = ''; });
          cell.addEventListener('drop', function (e) {
            e.preventDefault();
            cell.style.borderColor = '';
            var id = e.dataTransfer.getData('text/plain');
            var p = A.get(id);
            if (p && p.date !== isoDate) {
              A.updatePost(id, { date: isoDate, showDate: true });
              A.toast('Spostato al ' + A.dayLabel(isoDate));
            }
          });
        })(iso);
      }
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    return wrap;
  }

  function unscheduled() {
    var list = A.curPosts().filter(function (p) { return !p.date; });
    if (!list.length) return null;
    var wrap = A.el('div', { style: 'margin-top:22px;' });
    wrap.appendChild(A.el('div', { class: 'sec-title', text: 'Senza data (' + list.length + ')' }));
    var row = A.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' });
    list.forEach(function (p) {
      var st = A.statusOf(p.status);
      row.appendChild(A.el('button', {
        type: 'button', class: 'chip',
        draggable: 'true',
        html: '<span class="dot" style="background:' + st.c + '"></span>' + A.esc((p.caption || 'Senza testo').slice(0, 28)),
        onclick: function () { A.ui.tab = 'feed'; A.render(); A.openPostEditor(p.id); },
        ondragstart: function (e) { e.dataTransfer.setData('text/plain', p.id); }
      }));
    });
    wrap.appendChild(row);
    return wrap;
  }

  A.views = A.views || {};
  A.views.calendario = function (host) {
    A.clear(host);
    if (!A.ui.accountId) {
      host.appendChild(A.el('div', { class: 'empty' }, [A.el('h4', { text: 'Nessun account selezionato' })]));
      return;
    }
    host.appendChild(legend());
    var canvas = A.el('div', { class: 'canvas' });
    canvas.appendChild(monthGrid());
    var un = unscheduled();
    if (un) canvas.appendChild(un);
    host.appendChild(canvas);
  };
})(window.IDE);
</script>
<script>
/* src/js/09-preview.js */
/* ============================================================
   Ideology — Anteprima (studio)

   The month as a profile: header, then the grid exactly as the
   account will look. Clicking a tile opens the post the way
   someone actually reads it — media on the left, everything
   written about it on the right.

   This screen is for the studio. The client-facing version is
   a separate surface opened by the share link; the two are kept
   apart on purpose so neither has to compromise for the other.
   ============================================================ */

(function (A) {
  'use strict';

  function visible() {
    var all = A.curPosts();
    if (A.ui.previewFilter) all = all.filter(function (p) { return p.status === A.ui.previewFilter; });
    return all;
  }

  /* ── Toolbar ──────────────────────────────────────────── */

  function toolbar() {
    var bar = A.el('div', { class: 'toolbar' });
    var client = A.curClient();
    var acc = A.curAccount();

    bar.appendChild(A.el('span', {
      style: 'font-size:12px;font-weight:600;color:var(--ink-3);',
      text: 'Il mese come apparirà sul profilo'
    }));
    bar.appendChild(A.el('div', { class: 'bar-space' }));

    bar.appendChild(A.el('button', {
      class: 'btn sm', html: A.icon('pencil', 12) + 'Profilo', onclick: function () { editProfile(acc); }
    }));
    bar.appendChild(A.el('button', {
      class: 'btn sm hide-sm', html: A.icon('link', 12) + 'Copia link cliente',
      onclick: function () {
        var url = A.clientUrl(client);
        A.copy(url).then(function (ok) { A.toast(ok ? 'Link copiato negli appunti' : url); });
      }
    }));
    var drafts = A.curPosts().filter(function (p) { return p.status === 'bozza'; }).length;
    bar.appendChild(A.el('button', {
      class: 'btn primary sm', html: A.icon('send', 12) + 'Invia in approvazione',
      disabled: drafts === 0 ? true : null,
      onclick: sendForApproval
    }));
    return bar;
  }

  function sendForApproval() {
    var drafts = A.curPosts().filter(function (p) { return p.status === 'bozza'; });
    if (!drafts.length) { A.toast('Nessuna bozza da inviare'); return; }
    A.confirm({
      title: 'Inviare ' + drafts.length + (drafts.length === 1 ? ' contenuto' : ' contenuti') + ' al cliente?',
      body: 'Passano in "Da approvare" e compaiono nel link cliente. Le bozze restano fuori.',
      ok: 'Invia',
      run: function () {
        drafts.forEach(function (p) { A.setStatus(p.id, 'da_approvare', 'studio', ''); });
        A.save({ quiet: true });
        A.toast(drafts.length + ' contenuti inviati');
      }
    });
  }

  function editProfile(acc) {
    if (!acc) return;
    var h = A.el('input', { class: 'inp', value: acc.handle || '' });
    var f = A.el('input', { class: 'inp', type: 'number', value: acc.followers || 0 });
    var g = A.el('input', { class: 'inp', type: 'number', value: acc.following || 0 });
    var bio = A.el('textarea', { class: 'ta', rows: '4' });
    bio.value = acc.bio || '';
    var prev = A.el('div', {
      style: 'width:54px;height:54px;border-radius:50%;overflow:hidden;background:var(--paper-2);border:1px solid var(--rule);' +
             'display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--ink-3);'
    });
    function paint() {
      A.clear(prev);
      if (acc.avatarUrl) prev.appendChild(A.el('img', { src: acc.avatarUrl, alt: '', style: 'width:100%;height:100%;object-fit:cover;' }));
      else prev.textContent = A.initials(A.curClient().name);
    }
    paint();

    A.modal({
      title: 'Profilo ' + (acc.platform || ''),
      body: [
        A.el('div', { style: 'display:flex;align-items:flex-start;gap:12px;' }, [
          prev,
          A.el('div', { style: 'flex:1 1 auto;min-width:0;' }, [
            A.mediaControl(acc.avatarUrl,
              function (u) { acc.avatarUrl = u; paint(); A.commit({ render: false }); },
              function () { acc.avatarUrl = ''; paint(); A.commit({ render: false }); })
          ])
        ]),
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Handle' }), h]),
        A.el('div', { class: 'row' }, [
          A.el('div', { class: 'field' }, [A.el('label', { text: 'Follower' }), f]),
          A.el('div', { class: 'field' }, [A.el('label', { text: 'Seguiti' }), g])
        ]),
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Bio' }), bio])
      ],
      actions: [
        { label: 'Annulla' },
        {
          label: 'Salva', kind: 'primary', run: function () {
            acc.handle = h.value.trim();
            acc.followers = Number(f.value) || 0;
            acc.following = Number(g.value) || 0;
