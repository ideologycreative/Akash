            acc.bio = bio.value;
            A.commit();
            A.save({ quiet: true });
          }
        }
      ]
    });
  }

  /* ── Pieces ───────────────────────────────────────────── */

  function stateBar() {
    var posts = A.curPosts();
    var bar = A.el('div', { class: 'statebar' });
    A.STATUS.forEach(function (st) {
      var n = posts.filter(function (p) { return p.status === st.key; }).length;
      bar.appendChild(A.el('button', {
        type: 'button', 'aria-pressed': A.ui.previewFilter === st.key ? 'true' : 'false',
        style: '--c:' + st.c + ';--sub:' + st.sub + ';',
        onclick: function () { A.ui.previewFilter = A.ui.previewFilter === st.key ? '' : st.key; A.render(); }
      }, [A.el('b', { text: String(n) }), A.el('span', { text: st.short })]));
    });
    return bar;
  }

  function profileBlock() {
    var acc = A.curAccount();
    var client = A.curClient();
    var posts = A.curPosts();
    var box = A.el('div', { class: 'profile' });
    var av = A.el('div', { class: 'av' });
    if (acc.avatarUrl) av.appendChild(A.el('img', { src: acc.avatarUrl, alt: '' }));
    else av.textContent = A.initials(client.name);
    box.appendChild(A.el('div', { class: 'profile-top' }, [
      av,
      A.el('div', { class: 'profile-nums' }, [
        A.el('div', {}, [A.el('b', { text: String(posts.length) }), A.el('span', { text: 'in piano' })]),
        A.el('div', {}, [A.el('b', { text: A.fmtNum(acc.followers) }), A.el('span', { text: 'follower' })]),
        A.el('div', {}, [A.el('b', { text: A.fmtNum(acc.following) }), A.el('span', { text: 'seguiti' })])
      ])
    ]));
    box.appendChild(A.el('div', { class: 'handle', text: acc.handle || client.name }));
    if (acc.bio) box.appendChild(A.el('div', { class: 'bio', text: acc.bio }));
    return box;
  }

  function mosaic(list) {
    var g = A.el('div', { class: 'pv-grid' });
    list.forEach(function (p) {
      var st = A.statusOf(p.status);
      var nat = A.natureOf(p);
      var cell = A.el('div', {
        class: 'pv-cell', style: '--ratio:' + A.ratioFor(p.accountId) + ';',
        role: 'button', tabindex: '0', 'aria-label': 'Apri il contenuto'
      });
      cell.appendChild(A.mediaFill(p));
      if (p.kind === 'reel' || p.kind === 'carosello') {
        cell.appendChild(A.el('span', { class: 'mk', html: A.icon(p.kind === 'reel' ? 'play' : 'layers', 14) }));
      }
      if (nat.short) {
        cell.appendChild(A.el('span', { class: 'mk badge ' + nat.cls, text: nat.short, title: nat.label }));
      }
      cell.appendChild(A.el('span', { class: 'st', style: 'background:' + st.c + ';' }));
      function open() { A.openPostView(list, p.id); }
      cell.addEventListener('click', open);
      cell.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
      g.appendChild(cell);
    });
    return g;
  }

  /* ── View ─────────────────────────────────────────────── */

  A.views = A.views || {};
  A.views.anteprima = function (host) {
    A.clear(host);
    var client = A.curClient();
    var acc = A.curAccount();
    if (!client || !acc) {
      host.appendChild(A.el('div', { class: 'empty' }, [A.el('h4', { text: 'Nessun account selezionato' })]));
      return;
    }

    host.appendChild(toolbar());

    var scroll = A.el('div', { class: 'preview-scroll' });
    var stage = A.el('div', { class: 'stage' });
    stage.appendChild(stateBar());

    var list = visible();
    var sheet = A.el('div', { class: 'sheet' });
    sheet.appendChild(profileBlock());

    if (!list.length) {
      sheet.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Nessun contenuto' }),
        A.el('p', { text: 'Aggiungi contenuti dal Feed: qui vedi come si comporranno sul profilo.' })
      ]));
    } else {
      sheet.appendChild(mosaic(list));
    }

    stage.appendChild(sheet);
    stage.appendChild(A.el('div', { class: 'pv-foot' }, [
      A.el('div', { text: 'Clicca un contenuto per aprirlo · ' + A.monthLabel(A.ui.month) }),
      A.el('div', { class: 'sig', text: 'Ideology · ideology.it' })
    ]));
    scroll.appendChild(stage);
    host.appendChild(scroll);
  };
})(window.IDE);
</script>
<script>
/* src/js/11-home.js */
/* ============================================================
   Ideology — Home
   What needs attention this morning, across every client. The
   numbers are links: each one drops you into the exact account
   and month it counted.
   ============================================================ */

(function (A) {
  'use strict';

  function allAccounts() {
    var out = [];
    A.S.clients.forEach(function (c) {
      if (c.status === 'chiuso') return;
      (c.accounts || []).forEach(function (a) { out.push({ client: c, account: a }); });
    });
    return out;
  }

  function postsThisMonth() {
    var m = A.ui.month;
    var ids = {};
    allAccounts().forEach(function (x) { ids[x.account.id] = 1; });
    return A.S.posts.filter(function (p) { return p.month === m && ids[p.accountId]; });
  }

  function goTo(filterStatus) {
    return function () {
      var posts = postsThisMonth().filter(function (p) { return !filterStatus || p.status === filterStatus; });
      if (!posts.length) { A.toast('Niente da mostrare in ' + A.monthLabel(A.ui.month).toLowerCase()); return; }
      var ctx = A.accountCtx(posts[0].accountId);
      if (ctx) { A.ui.clientId = ctx.client.id; A.ui.accountId = ctx.account.id; }
      A.ui.section = 'contenuti';
      A.ui.tab = filterStatus === 'in_revisione' || filterStatus === 'da_approvare' ? 'anteprima' : 'feed';
      A.ui.filters = A.emptyFilters();
      if (filterStatus) A.ui.filters.status = [filterStatus];
      A.ui.previewFilter = filterStatus || '';
      A.ui.previewMode = 'studio';
      A.render();
    };
  }

  function kpis() {
    var posts = postsThisMonth();
    var box = A.el('div', { class: 'kpis' });
    var rows = [
      { n: posts.filter(function (p) { return p.status === 'in_revisione'; }).length,
        label: 'Da rilavorare', sub: 'il cliente ha chiesto modifiche', c: 'var(--st-revisione)', f: 'in_revisione' },
      { n: posts.filter(function (p) { return p.status === 'da_approvare'; }).length,
        label: 'In attesa del cliente', sub: 'inviati, nessuna risposta', c: 'var(--st-approvare)', f: 'da_approvare' },
      { n: posts.filter(function (p) { return p.status === 'bozza'; }).length,
        label: 'Bozze da inviare', sub: 'non ancora visibili al cliente', c: 'var(--st-bozza)', f: 'bozza' },
      { n: posts.filter(function (p) { return p.status === 'approvato'; }).length,
        label: 'Pronti a uscire', sub: 'approvati, non pubblicati', c: 'var(--st-approvato)', f: 'approvato' }
    ];
    rows.forEach(function (r) {
      box.appendChild(A.el('button', { type: 'button', class: 'kpi', style: '--c:' + r.c + ';', onclick: goTo(r.f) }, [
        A.el('b', { text: String(r.n) }),
        A.el('span', { text: r.label }),
        A.el('em', { text: r.sub })
      ]));
    });
    return box;
  }

  function clientList() {
    var col = A.el('div');
    col.appendChild(A.el('div', { class: 'sec-title', text: 'Clienti · ' + A.monthLabel(A.ui.month) }));
    var any = false;
    A.S.clients.forEach(function (c) {
      (c.accounts || []).forEach(function (acc) {
        any = true;
        var posts = A.postsIn(acc.id, A.ui.month);
        var counts = {};
        A.STATUS.forEach(function (s) { counts[s.key] = posts.filter(function (p) { return p.status === s.key; }).length; });
        var bars = A.el('div', { class: 'bars', title: posts.length + ' contenuti' });
        A.STATUS.forEach(function (s) {
          if (!counts[s.key]) return;
          bars.appendChild(A.el('i', {
            style: 'flex:' + counts[s.key] + ';background:' + s.c + ';',
            title: counts[s.key] + ' ' + s.label.toLowerCase()
          }));
        });
        if (!posts.length) bars.appendChild(A.el('i', { style: 'flex:1;background:var(--rule);' }));

        var fmt = A.formatOfAccount(acc);
        col.appendChild(A.el('button', {
          type: 'button', class: 'crow',
          onclick: function () {
            A.ui.clientId = c.id; A.ui.accountId = acc.id;
            A.ui.section = 'contenuti'; A.ui.tab = 'feed';
            A.ui.filters = A.emptyFilters();
            A.render();
          }
        }, [
          A.el('span', { class: 'mark', style: 'background:' + A.markColor(c.id) + ';', text: A.initials(c.name) }),
          A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
            A.el('span', { class: 'nm', style: 'display:block;', text: c.name }),
            A.el('span', { class: 'sub', text: acc.platform + ' · ' + acc.handle + ' · ' + fmt.sizeLabel })
          ]),
          posts.length ? A.el('span', { class: 'sub', style: 'min-width:54px;text-align:right;', text: posts.length + ' pezzi' })
                       : A.el('span', { class: 'sub', style: 'min-width:54px;text-align:right;', text: 'vuoto' }),
          bars
        ]));
      });
    });
    if (!any) {
      col.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Nessun cliente' }),
        A.el('p', { text: 'Aggiungine uno dalla sezione Clienti per cominciare.' }),
        A.el('button', { class: 'btn primary', text: 'Vai a Clienti', onclick: function () { A.ui.section = 'clienti'; A.render(); } })
      ]));
    }
    return col;
  }

  function goals() {
    var col = A.el('div');
    var cl = A.curClient();
    var acc = A.curAccount();
    if (!cl || !acc) return col;
    col.appendChild(A.el('div', { class: 'sec-title', text: 'Impegni del mese · ' + cl.name }));
    A.progressOf(acc.id, A.ui.month, cl.id).forEach(function (g) {
      if (!g.goal && !g.done) return;
      var pct = g.goal ? Math.min(100, Math.round(g.done / g.goal * 100)) : 100;
      col.appendChild(A.el('div', { class: 'goal' }, [
        A.el('span', { class: 'gn', text: g.label }),
        A.el('span', { class: 'track' }, [A.el('i', { style: 'width:' + pct + '%;background:' + (g.goal && g.done >= g.goal ? 'var(--st-approvato)' : 'var(--ink)') + ';' })]),
        A.el('span', { class: 'done', text: g.goal ? g.done + ' / ' + g.goal : String(g.done) })
      ]));
    });
    return col;
  }

  function activity() {
    var col = A.el('div', { style: 'margin-top:26px;' });
    col.appendChild(A.el('div', { class: 'sec-title', text: 'Ultimi movimenti' }));
    var rows = A.recentActivity(9);
    if (!rows.length) {
      col.appendChild(A.el('p', { style: 'font-size:12px;color:var(--ink-3);margin:0;', text: 'Ancora nessun passaggio di stato registrato.' }));
      return col;
    }
    rows.forEach(function (r) {
      var st = A.statusOf(r.to);
      var ctx = A.accountCtx(r.accountId);
      var when = r.at ? new Date(r.at) : null;
      col.appendChild(A.el('button', {
        type: 'button', class: 'feedline',
        style: 'width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);',
        onclick: function () {
          if (ctx) { A.ui.clientId = ctx.client.id; A.ui.accountId = ctx.account.id; }
          A.ui.section = 'contenuti'; A.ui.tab = 'feed';
          A.ui.filters = A.emptyFilters();
          A.render();
          A.openPostEditor(r.postId);
        }
      }, [
        A.el('span', { class: 'pip', style: 'background:' + st.c + ';' }),
        A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
          A.el('span', {}, [
            A.el('b', { text: r.by === 'cliente' ? (ctx ? ctx.client.name : 'Il cliente') : 'Lo studio' }),
            ' · ' + st.label.toLowerCase()
          ]),
          r.note ? A.el('div', { style: 'color:var(--ink-3);font-size:11.5px;', text: r.note }) : null,
          A.el('div', { class: 'when', text: when ? when.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' }) : '' })
        ])
      ]));
    });
    return col;
  }

  A.views = A.views || {};
  A.views.home = function (host) {
    A.clear(host);

    var head = A.el('div', { class: 'sec-head' }, [
      A.el('div', {}, [
        A.el('h1', { text: 'Buongiorno' }),
        A.el('p', { text: A.S.clients.length + ' clienti · ' + A.monthLabel(A.ui.month) })
      ]),
      A.el('div', { class: 'bar-space' }),
      A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Mese precedente', html: A.icon('left', 14), onclick: function () { A.ui.month = A.shiftMonth(A.ui.month, -1); A.render(); } }),
      A.el('span', { style: 'font-size:12px;font-weight:600;min-width:104px;text-align:center;', text: A.monthLabel(A.ui.month) }),
      A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Mese successivo', html: A.icon('right', 14), onclick: function () { A.ui.month = A.shiftMonth(A.ui.month, 1); A.render(); } })
    ]);
    host.appendChild(head);

    var scroll = A.el('div', { class: 'canvas', style: 'padding:0;' });
    var page = A.el('div', { class: 'home' });
    page.appendChild(kpis());
    var board = A.el('div', { class: 'board' });
    board.appendChild(clientList());
    var right = A.el('div');
    right.appendChild(goals());
    right.appendChild(activity());
    board.appendChild(right);
    page.appendChild(board);
    scroll.appendChild(page);
    host.appendChild(scroll);
  };
})(window.IDE);
</script>
<script>
/* src/js/12-clients.js */
/* ============================================================
   Ideology — Clienti

   The client record is where every content decision is set once:
   which platforms, and therefore which aspect ratio, which grid,
   which export size and which caption limit; the brand palette
   the text cards are drawn from; the pillars and formats the
   feed classifies against; and the monthly commitment the Home
   measures progress against.

   Picking a platform is the only size decision in the product.
   Nothing downstream asks again.
   ============================================================ */

(function (A) {
  'use strict';

  A.goClient = function (id) {
    A.ui.section = 'clienti';
    A.ui.clientDetailId = id || null;
    A.render();
  };

  function field(label, control, hint) {
    var f = A.el('div', { class: 'field' }, [A.el('label', { text: label }), control]);
    if (hint) f.appendChild(A.el('div', { class: 'hint', text: hint }));
    return f;
  }

  function section(title, desc, action) {
    var s = A.el('div', { class: 'dsec' });
    var h = A.el('h2', {}, [A.el('span', { text: title })]);
    if (action) { h.appendChild(A.el('div', { class: 'bar-space' })); h.appendChild(action); }
    s.appendChild(h);
    if (desc) s.appendChild(A.el('p', { text: desc }));
    return s;
  }

  /* ── List ─────────────────────────────────────────────── */

  function listView(host) {
    var head = A.el('div', { class: 'sec-head' }, [
      A.el('div', {}, [
        A.el('h1', { text: 'Clienti' }),
        A.el('p', { text: 'Account, formati, identità visiva e impegni mensili.' })
      ]),
      A.el('div', { class: 'bar-space' }),
      A.el('button', { class: 'btn primary', html: A.icon('plus', 13) + 'Nuovo cliente', onclick: newClientModal })
    ]);
    host.appendChild(head);

    var scroll = A.el('div', { class: 'canvas', style: 'padding:0;' });
    var page = A.el('div', { class: 'clients' });

    if (!A.S.clients.length) {
      page.appendChild(A.el('div', { class: 'empty' }, [
        A.el('h4', { text: 'Nessun cliente' }),
        A.el('p', { text: 'Crea il primo cliente: bastano un nome e la piattaforma principale, il resto si imposta dopo.' }),
        A.el('button', { class: 'btn primary', html: A.icon('plus', 13) + 'Nuovo cliente', onclick: newClientModal })
      ]));
      scroll.appendChild(page); host.appendChild(scroll); return;
    }

    var grid = A.el('div', { class: 'client-grid' });
    A.S.clients.forEach(function (c) {
      var accounts = c.accounts || [];
      var posts = 0, pending = 0;
      accounts.forEach(function (a) {
        var list = A.postsIn(a.id, A.ui.month);
        posts += list.length;
        pending += list.filter(function (p) { return p.status === 'da_approvare' || p.status === 'in_revisione'; }).length;
      });
      var stat = (A.CLIENT_STATUS.filter(function (s) { return s.key === c.status; })[0] || {}).label || 'Attivo';

      var card = A.el('button', { type: 'button', class: 'client-card', onclick: function () { A.goClient(c.id); } });
      card.appendChild(A.el('div', { class: 'top' }, [
        A.el('span', { class: 'mark', style: 'background:' + A.markColor(c.id) + ';', text: A.initials(c.name) }),
        A.el('div', { style: 'min-width:0;flex:1 1 auto;' }, [
          A.el('h3', { text: c.name }),
          A.el('div', { class: 'sub', text: accounts.length + (accounts.length === 1 ? ' account' : ' account') + ' · ' + posts + ' contenuti in ' + A.monthShort(A.ui.month).toLowerCase() })
        ]),
        A.el('span', { class: 'statuspill ' + (c.status || 'attivo'), text: stat })
      ]));

      var row = A.el('div', { class: 'plat-row' });
      accounts.forEach(function (a) {
        var fmt = A.formatOfAccount(a);
        row.appendChild(A.el('span', {
          class: 'plat-chip',
          html: '<span class="dot" style="background:' + fmt.platform.color + '"></span>' +
                A.esc(a.platform) + ' <span style="opacity:.6">' + A.esc(fmt.sizeLabel) + '</span>'
        }));
      });
      card.appendChild(row);

      if (pending) {
        card.appendChild(A.el('div', {
          style: 'font-size:11.5px;font-weight:700;color:var(--st-approvare);',
          text: pending + (pending === 1 ? ' contenuto in attesa' : ' contenuti in attesa')
        }));
      }
      grid.appendChild(card);
    });
    page.appendChild(grid);
    scroll.appendChild(page);
    host.appendChild(scroll);
  }

  function newClientModal() {
    var name = A.el('input', { class: 'inp', placeholder: 'Nome del cliente' });
    var handle = A.el('input', { class: 'inp', placeholder: '@handle (facoltativo)' });
    var chosen = 'Instagram';
    var pick = A.el('div', { class: 'plat-pick' });

    function paint() {
      A.clear(pick);
      A.PLATFORM_LIST.forEach(function (k) {
        var p = A.PLATFORMS[k];
        pick.appendChild(A.el('button', {
          type: 'button', class: 'plat-opt', 'aria-pressed': chosen === k ? 'true' : 'false',
          onclick: function () { chosen = k; paint(); }
        }, [
          A.el('span', { class: 'pn', html: '<span class="pdot" style="background:' + p.color + '"></span>' + A.esc(p.label) }),
          A.el('span', { class: 'pd', text: p.sizeLabel + ' · ' + p.w + '×' + p.h })
        ]));
      });
    }
    paint();

    A.modal({
      title: 'Nuovo cliente',
      body: [
        field('Nome', name),
        field('Piattaforma principale', pick, 'Decide formato, griglia e limite caption. Puoi aggiungere altri account dopo.'),
        field('Handle', handle)
      ],
      actions: [
        { label: 'Annulla' },
        {
          label: 'Crea', kind: 'primary',
          run: function () {
            var n = name.value.trim();
            if (!n) { name.focus(); return false; }
            var cl = A.addClient(n, chosen, handle.value.trim());
            A.goClient(cl.id);
            A.toast('Cliente creato');
          }
        }
      ]
    });
  }

  /* ── Detail ───────────────────────────────────────────── */

  function identity(cl) {
    var s = section('Anagrafica', null);
    var name = A.el('input', { class: 'inp', value: cl.name });
    name.addEventListener('change', function () { A.updateClient(cl.id, { name: name.value.trim() || cl.name }); });

    var status = A.el('select', { class: 'sel' });
    A.CLIENT_STATUS.forEach(function (st) {
      status.appendChild(A.el('option', { value: st.key, text: st.label, selected: cl.status === st.key }));
    });
    status.addEventListener('change', function () { A.updateClient(cl.id, { status: status.value }); });

    s.appendChild(A.el('div', { class: 'row' }, [field('Nome', name), field('Stato', status)]));

    var note = A.el('textarea', { class: 'ta', rows: '2', placeholder: 'Contesto utile allo studio: tono di voce, vincoli, referente…' });
    note.value = cl.note || '';
    note.addEventListener('input', function () { cl.note = note.value; A.commit({ render: false }); });
    s.appendChild(field('Note', note));

    var url = A.clientUrl(cl);
    s.appendChild(field('Link di approvazione', A.el('div', { class: 'linkbox' }, [
      A.el('code', { text: url }),
      A.el('button', {
        class: 'btn ghost sm', text: 'Copia',
        onclick: function () { A.copy(url).then(function (ok) { A.toast(ok ? 'Link copiato' : url); }); }
      }),
      A.el('button', {
        class: 'btn ghost sm', text: 'Rigenera',
        onclick: function () {
          A.confirm({
            title: 'Rigenerare il link?',
            body: 'Il link precedente smette di funzionare subito. Usalo se è finito nelle mani sbagliate.',
            ok: 'Rigenera', danger: true,
            run: function () { A.updateClient(cl.id, { shareToken: A.newToken() }); A.toast('Nuovo link generato'); }
          });
        }
      })
    ]), 'Apre solo l\'anteprima di questo cliente, in sola lettura. Le bozze non sono mai incluse.'));
    return s;
  }

  function accountsSection(cl) {
    var s = section(
      'Account social',
      'La piattaforma scelta qui decide tutto il resto: proporzione delle celle, colonne della griglia, dimensioni di esportazione e limite della caption. Non viene richiesta una seconda volta da nessuna parte.',
      A.el('button', { class: 'btn sm', html: A.icon('plus', 12) + 'Account', onclick: function () { addAccountModal(cl); } })
    );

    if (!cl.accounts.length) {
      s.appendChild(A.el('div', { class: 'empty', style: 'padding:30px;' }, [
        A.el('p', { text: 'Nessun account. Aggiungine uno per poter pianificare contenuti.' })
      ]));
      return s;
    }

    cl.accounts.forEach(function (acc) {
      var fmt = A.formatOfAccount(acc);
      var card = A.el('div', { class: 'acc-card' });

      /* avatar */
      var av = A.el('div', { class: 'acc-av', title: 'Cambia foto profilo' });
      function paintAv() {
        A.clear(av);
        if (acc.avatarUrl) av.appendChild(A.el('img', { src: acc.avatarUrl, alt: '' }));
        else av.innerHTML = A.icon('users', 20);
      }
      paintAv();
      var file = A.el('input', { type: 'file', accept: 'image/*', style: 'display:none' });
      file.addEventListener('change', function () {
        var f = file.files && file.files[0];
        if (!f) return;
        A.readImage(f).then(function (u) { acc.avatarUrl = u; paintAv(); A.commit({ render: false }); })
          .catch(function (e) { A.toast(e.message); });
      });
      av.addEventListener('click', function () { file.click(); });
      card.appendChild(A.el('div', {}, [av, file]));

      var main = A.el('div', { class: 'acc-main' });

      var handle = A.el('input', { class: 'inp', value: acc.handle || '', placeholder: '@handle', style: 'max-width:220px;' });
      handle.addEventListener('input', function () { acc.handle = handle.value; A.commit({ render: false }); });
      var top = A.el('div', { class: 'acc-top' }, [
        handle,
        A.el('span', { class: 'plat-chip', html: '<span class="dot" style="background:' + fmt.platform.color + '"></span>' + A.esc(acc.platform) }),
        A.el('div', { class: 'bar-space' }),
        A.el('button', {
          class: 'btn ghost sm icon', title: 'Rimuovi account', html: A.icon('trash', 12),
          onclick: function () { removeAccount(cl, acc); }
        })
      ]);
      main.appendChild(top);

      /* platform picker — the single size decision */
      var pick = A.el('div', { class: 'plat-pick' });
      A.PLATFORM_LIST.forEach(function (k) {
        var p = A.PLATFORMS[k];
        pick.appendChild(A.el('button', {
          type: 'button', class: 'plat-opt', 'aria-pressed': acc.platform === k ? 'true' : 'false',
          onclick: function () { acc.platform = k; acc.ratio = ''; A.commit(); }
        }, [
          A.el('span', { class: 'pn', html: '<span class="pdot" style="background:' + p.color + '"></span>' + A.esc(p.label) }),
          A.el('span', { class: 'pd', text: p.sizeLabel + ' · ' + p.w + '×' + p.h })
        ]));
      });
      main.appendChild(pick);

      /* alternative ratios offered by that platform */
      if (fmt.platform.alts && fmt.platform.alts.length) {
        var alts = A.el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;align-items:center;' });
        alts.appendChild(A.el('span', { style: 'font-size:10.5px;font-weight:700;color:var(--ink-3);', text: 'Formato in griglia' }));
        alts.appendChild(A.el('button', {
          type: 'button', class: 'chip', 'aria-pressed': !acc.ratio ? 'true' : 'false',
          text: fmt.platform.sizeLabel + ' (predefinito)',
          onclick: function () { acc.ratio = ''; A.commit(); }
        }));
        fmt.platform.alts.forEach(function (al) {
          alts.appendChild(A.el('button', {
            type: 'button', class: 'chip', 'aria-pressed': acc.ratio === al.ratio ? 'true' : 'false',
            text: al.label,
            onclick: function () { acc.ratio = al.ratio; A.commit(); }
          }));
        });
        main.appendChild(alts);
      }

      /* what the choice produced */
      var spec = A.el('div', { class: 'acc-spec' }, [
        A.el('div', {}, [A.el('b', { text: fmt.sizeLabel }), A.el('span', { text: 'proporzione' })]),
        A.el('div', {}, [A.el('b', { text: fmt.w + ' × ' + fmt.h }), A.el('span', { text: 'pixel di esportazione' })]),
        A.el('div', {}, [A.el('b', { text: String(fmt.cols) }), A.el('span', { text: 'colonne in griglia' })]),
        A.el('div', {}, [A.el('b', { text: fmt.platform.captionMax.toLocaleString('it-IT') }), A.el('span', { text: 'caratteri caption' })]),
        A.el('div', {}, [
          A.el('b', { text: fmt.platform.story ? fmt.platform.story.label : '—' }),
          A.el('span', { text: 'stories' })
        ])
      ]);
      main.appendChild(spec);
      main.appendChild(A.el('div', { style: 'font-size:11.5px;color:var(--ink-3);line-height:1.5;', text: fmt.platform.note }));

      var bio = A.el('textarea', { class: 'ta', rows: '2', placeholder: 'Bio del profilo — compare nell\'anteprima cliente' });
      bio.value = acc.bio || '';
      bio.addEventListener('input', function () { acc.bio = bio.value; A.commit({ render: false }); });
      var nums = A.el('div', { class: 'row' }, [
        (function () {
          var i = A.el('input', { class: 'inp', type: 'number', value: acc.followers || 0 });
          i.addEventListener('input', function () { acc.followers = Number(i.value) || 0; A.commit({ render: false }); });
          return field('Follower', i);
        })(),
        (function () {
          var i = A.el('input', { class: 'inp', type: 'number', value: acc.following || 0 });
          i.addEventListener('input', function () { acc.following = Number(i.value) || 0; A.commit({ render: false }); });
          return field('Seguiti', i);
        })()
      ]);
      main.appendChild(field('Bio', bio));
      main.appendChild(nums);

      var counts = A.countAccountContent(acc.id);
      main.appendChild(A.el('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' }, [
        A.el('span', { style: 'font-size:11.5px;color:var(--ink-3);', text: counts.posts + ' contenuti · ' + counts.stories + ' stories · ' + counts.ugc + ' slot UGC' }),
        A.el('div', { class: 'bar-space' }),
        A.el('button', {
          class: 'btn sm', html: A.icon('grid', 12) + 'Apri il feed',
          onclick: function () {
            A.ui.clientId = cl.id; A.ui.accountId = acc.id;
            A.ui.section = 'contenuti'; A.ui.tab = 'feed';
            A.render();
          }
        })
      ]));

      card.appendChild(main);
      s.appendChild(card);
    });
    return s;
  }

  function addAccountModal(cl) {
    var handle = A.el('input', { class: 'inp', placeholder: '@handle' });
    var chosen = 'Instagram';
    var pick = A.el('div', { class: 'plat-pick' });
    function paint() {
      A.clear(pick);
      A.PLATFORM_LIST.forEach(function (k) {
        var p = A.PLATFORMS[k];
        pick.appendChild(A.el('button', {
          type: 'button', class: 'plat-opt', 'aria-pressed': chosen === k ? 'true' : 'false',
          onclick: function () { chosen = k; paint(); }
        }, [
          A.el('span', { class: 'pn', html: '<span class="pdot" style="background:' + p.color + '"></span>' + A.esc(p.label) }),
          A.el('span', { class: 'pd', text: p.sizeLabel + ' · ' + p.w + '×' + p.h })
        ]));
      });
    }
    paint();
    A.modal({
      title: 'Nuovo account · ' + cl.name,
      body: [field('Piattaforma', pick), field('Handle', handle)],
      actions: [
        { label: 'Annulla' },
        { label: 'Aggiungi', kind: 'primary', run: function () { A.addAccount(cl.id, chosen, handle.value.trim()); A.toast('Account aggiunto'); } }
      ]
    });
  }

  function removeAccount(cl, acc) {
    var c = A.countAccountContent(acc.id);
    var total = c.posts + c.stories + c.ugc;
    A.confirm({
      title: 'Rimuovere ' + (acc.handle || 'questo account') + '?',
      body: total
        ? 'Vengono eliminati anche ' + c.posts + ' contenuti, ' + c.stories + ' stories e ' + c.ugc + ' slot UGC collegati. Esporta un backup se non sei sicuro.'
        : 'Non ci sono contenuti collegati: la rimozione non cancella nulla di pianificato.',
      ok: 'Rimuovi', danger: true,
      run: function () { A.deleteAccount(cl.id, acc.id); A.toast('Account rimosso'); }
    });
  }

  /* ── Brand palette ────────────────────────────────────── */

  function paletteSection(cl) {
    var s = section('Identità visiva',
      'I colori usati dalle card di solo testo nel feed e nelle stories. Niente file da aprire: la card si disegna da qui.');

    var pal = cl.palette;
    var preview = A.el('div', { class: 'pal-preview' });

    function paintPreview() {
      A.clear(preview);
      var feed = A.el('div', { class: 'pal-card', style: 'background:' + pal.bg + ';color:' + pal.ink + ';' }, [
        A.el('div', { class: 'e', style: 'color:' + pal.accent + ';', text: 'Dalla bottega' }),
        A.el('div', { class: 't', text: 'Il titolo di una card di solo testo' }),
        A.el('div', { class: 'r' }),
        A.el('div', { class: 's', text: 'Sottotitolo su due righe, come comparirebbe nel feed.' })
      ]);
      var story = A.el('div', { class: 'pal-card story', style: 'background:' + pal.accent + ';color:' + pal.bg + ';' }, [
        A.el('div', { class: 'e', style: 'color:' + pal.alt + ';', text: 'UGC' }),
        A.el('div', { class: 't', text: 'Una citazione dal cliente' }),
        A.el('div', { class: 'r' }),
        A.el('div', { class: 's', text: cl.name })
      ]);
      preview.appendChild(feed);
      preview.appendChild(story);
    }

    var grid = A.el('div', { class: 'pal-grid' });
    A.PALETTE_KEYS.forEach(function (k) {
      var item = A.el('div', { class: 'pal-item' });
      var sw = A.el('div', { class: 'swatch', style: 'background:' + (pal[k.key] || '#eee') + ';' });
      var picker = A.el('input', { type: 'color', value: pal[k.key] || '#000000', style: 'position:absolute;opacity:0;width:0;height:0;' });
      var hex = A.el('input', { class: 'inp', value: pal[k.key] || '' });

      function apply(v) {
        if (!/^#[0-9a-fA-F]{6}$/.test(v)) return;
        pal[k.key] = v;
        sw.style.background = v;
        hex.value = v;
        picker.value = v;
        paintPreview();
        A.commit({ render: false });
      }
      sw.addEventListener('click', function () { picker.click(); });
      sw.style.cursor = 'pointer';
      picker.addEventListener('input', function () { apply(picker.value); });
      hex.addEventListener('change', function () {
        if (!/^#[0-9a-fA-F]{6}$/.test(hex.value.trim())) { hex.value = pal[k.key]; A.toast('Serve un colore in formato #RRGGBB'); return; }
        apply(hex.value.trim());
      });

      item.appendChild(sw);
      item.appendChild(A.el('label', { style: 'font-size:10.5px;font-weight:700;color:var(--ink-3);', text: k.label }));
      item.appendChild(hex);
      item.appendChild(picker);
      grid.appendChild(item);
    });

    paintPreview();
    s.appendChild(grid);
    s.appendChild(preview);
    return s;
  }

  /* ── Categories ───────────────────────────────────────
     One classification axis, defined per client. A ceramics
     studio sorts by "prodotto / dietro le quinte", a restaurant
     by "piatti / persone in cucina": the names belong to the
     client, the single axis belongs to the product, which is
     why it fits in one corner of every card.
  ──────────────────────────────────────────────────────── */

  function categoriesSection(cl) {
    var items = A.categoriesOf(cl.id);
    var s = section(
      'Categorie di contenuto',
      'L\'unico modo in cui i contenuti di ' + cl.name + ' vengono classificati. Compaiono nell\'angolo in basso a destra di ogni card e come filtro nel feed.',
      A.el('button', {
        class: 'btn sm', html: A.icon('plus', 12) + 'Aggiungi',
        onclick: function () { A.addCategory(cl.id); }
      })
    );

    if (!items.length) {
      s.appendChild(A.el('p', { style: 'font-size:12px;color:var(--ink-4);margin:0 0 10px;', text: 'Nessuna categoria. Aggiungi quelle che usate con questo cliente.' }));
      var presets = ['Prodotto', 'Dietro le quinte', 'Community', 'Educativo', 'Promozionale'];
      var row = A.el('div', { style: 'display:flex;gap:6px;flex-wrap:wrap;' });
      presets.forEach(function (name) {
        row.appendChild(A.el('button', {
          class: 'chip', text: '+ ' + name,
          onclick: function () { A.addCategory(cl.id, name); }
        }));
      });
      s.appendChild(row);
      return s;
    }

    items.forEach(function (it) {
      var used = A.usageOfCategory(it.id);
      var row = A.el('div', { class: 'taxrow' });

      var sw = A.el('div', { class: 'sw', style: 'background:' + it.color + ';', title: 'Cambia colore' });
      var picker = A.el('input', { type: 'color', value: it.color, style: 'position:absolute;opacity:0;width:0;height:0;' });
      sw.addEventListener('click', function () { picker.click(); });
      picker.addEventListener('input', function () { it.color = picker.value; sw.style.background = it.color; A.commit({ render: false }); });

      var name = A.el('input', { class: 'inp', value: it.name, style: 'flex:0 0 180px;font-weight:600;' });
      name.addEventListener('input', function () { it.name = name.value; A.commit({ render: false }); });

      var desc = A.el('input', { class: 'inp', value: it.description || '', placeholder: 'A cosa serve', style: 'flex:1 1 auto;' });
      desc.addEventListener('input', function () { it.description = desc.value; A.commit({ render: false }); });

      row.appendChild(sw); row.appendChild(picker);
      row.appendChild(name); row.appendChild(desc);
      row.appendChild(A.el('span', { class: 'cnt', text: used + (used === 1 ? ' uso' : ' usi') }));
      row.appendChild(A.el('button', {
        class: 'btn ghost sm icon', title: 'Elimina', html: A.icon('trash', 12),
        onclick: function () {
          A.confirm({
            title: 'Eliminare "' + it.name + '"?',
            body: used
              ? used + ' contenuti perdono questa classificazione, ma restano al loro posto.'
              : 'Non è usata da nessun contenuto.',
            ok: 'Elimina', danger: true,
            run: function () { A.deleteCategory(it.id); }
          });
        }
      }));
      s.appendChild(row);
    });
    return s;
  }

  /* ── Monthly commitment ───────────────────────────────── */

  function goalsSection(cl) {
    var s = section('Impegni mensili',
      'Quanto è stato concordato per ogni mese. La Home misura su questi numeri quanto manca a chiudere il mese.');
    var acc = cl.accounts[0];
    A.GOALS.forEach(function (g) {
      var done = acc ? A.progressOf(acc.id, A.ui.month, cl.id).filter(function (x) { return x.key === g.key; })[0].done : 0;
      var inp = A.el('input', { class: 'inp', type: 'number', min: '0', value: cl.goals[g.key] || 0 });
      inp.addEventListener('input', function () { cl.goals[g.key] = Number(inp.value) || 0; A.commit({ render: false }); });
      var target = cl.goals[g.key] || 0;
      var pct = target ? Math.min(100, Math.round(done / target * 100)) : 0;
      s.appendChild(A.el('div', { class: 'goal' }, [
        A.el('span', { class: 'gn', text: g.label }),
        A.el('span', { class: 'track' }, [A.el('i', { style: 'width:' + pct + '%;' })]),
        A.el('span', { class: 'done', text: done + ' fatti' }),
        inp
      ]));
    });
    return s;
  }

  function dangerSection(cl) {
    var s = section('Zona pericolosa', null);
    var accIds = (cl.accounts || []).map(function (a) { return a.id; });
    var posts = A.S.posts.filter(function (p) { return accIds.indexOf(p.accountId) >= 0; }).length;
    s.appendChild(A.el('div', { class: 'danger-zone' }, [
      A.el('h3', { text: 'Elimina il cliente' }),
      A.el('p', { text: 'Spariscono ' + posts + ' contenuti, le stories, gli slot UGC, i creator, i pilastri e i formati. Non è reversibile: esporta prima un backup.' }),
      A.el('button', {
        class: 'btn danger', html: A.icon('trash', 13) + 'Elimina ' + cl.name,
        onclick: function () {
          A.confirm({
            title: 'Eliminare ' + cl.name + '?',
            body: 'Tutto il lavoro collegato viene rimosso. Questa azione non si annulla.',
            ok: 'Elimina tutto', danger: true,
            run: function () { A.deleteClient(cl.id); A.ui.clientDetailId = null; A.toast('Cliente eliminato'); }
          });
        }
      })
    ]));
    return s;
  }

  function detailView(host, cl) {
    var head = A.el('div', { class: 'sec-head' }, [
      A.el('button', { class: 'btn ghost icon', 'aria-label': 'Torna ai clienti', html: A.icon('left', 15), onclick: function () { A.goClient(null); } }),
      A.el('span', { class: 'mark', style: 'width:40px;height:40px;border-radius:11px;background:' + A.markColor(cl.id) + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto;', text: A.initials(cl.name) }),
      A.el('div', {}, [
        A.el('h1', { style: 'font-size:22px;', text: cl.name }),
        A.el('p', { text: (cl.accounts || []).map(function (a) { return a.platform; }).join(' · ') || 'Nessun account' })
      ]),
      A.el('div', { class: 'bar-space' }),
      A.el('button', {
        class: 'btn', html: A.icon('grid', 13) + 'Vai ai contenuti',
        onclick: function () {
          A.ui.clientId = cl.id;
          A.ui.accountId = cl.accounts[0] ? cl.accounts[0].id : null;
          A.ui.section = 'contenuti'; A.ui.tab = 'feed';
          A.render();
        }
      })
    ]);
    host.appendChild(head);

    var scroll = A.el('div', { class: 'canvas', style: 'padding:0;' });
    var page = A.el('div', { class: 'detail' });
    page.appendChild(identity(cl));
    page.appendChild(accountsSection(cl));
    page.appendChild(paletteSection(cl));
    page.appendChild(categoriesSection(cl));
    page.appendChild(goalsSection(cl));
    page.appendChild(dangerSection(cl));
    scroll.appendChild(page);
    host.appendChild(scroll);
  }

  A.views = A.views || {};
  A.views.clienti = function (host) {
    A.clear(host);
    var cl = A.get(A.ui.clientDetailId);
    if (cl && cl.accounts) detailView(host, cl);
    else listView(host);
  };
})(window.IDE);
</script>
<script>
/* src/js/20-app.js */
/* ============================================================
   Ideology — shell
   Left rail for the three areas. The context bar (client,
   account, month) belongs to Contenuti only; Home and Clienti
   draw their own headers.
   ============================================================ */

(function (A) {
  'use strict';

  var TABS = [
    { key: 'feed',       label: 'Feed' },
    { key: 'stories',    label: 'Stories' },
    { key: 'ugc',        label: 'UGC' },
    { key: 'calendario', label: 'Calendario' },
    { key: 'anteprima',  label: 'Anteprima' }
  ];

  var SECTIONS = [
    { key: 'home',      label: 'Home',      icon: 'grid' },
    { key: 'clienti',   label: 'Clienti',   icon: 'users' },
    { key: 'contenuti', label: 'Contenuti', icon: 'image' }
  ];

  /* ── Left rail ────────────────────────────────────────── */

  function pendingAcrossStudio() {
    var ids = {};
    A.S.clients.forEach(function (c) {
      if (c.status === 'chiuso') return;
      (c.accounts || []).forEach(function (a) { ids[a.id] = 1; });
    });
    return A.S.posts.filter(function (p) {
      return p.month === A.ui.month && ids[p.accountId] &&
        (p.status === 'in_revisione' || p.status === 'da_approvare');
    }).length;
  }

  function railItem(cfg) {
    var btn = A.el('button', {
      type: 'button', class: 'rail-item', title: cfg.title || cfg.label,
      'aria-current': cfg.current ? 'page' : null,
      onclick: cfg.onclick
    });
    var i = A.el('span', { class: 'ic', style: 'display:inline-flex;' });
    i.innerHTML = A.icon(cfg.icon, 16);
    btn.appendChild(i);
    btn.appendChild(A.el('span', { class: 'rtxt', text: cfg.label }));
    if (cfg.badge) btn.appendChild(A.el('span', { class: 'n', text: String(cfg.badge) }));
    return btn;
  }

  function rail() {
    var r = A.el('nav', { class: 'rail', 'aria-label': 'Sezioni' });

    r.appendChild(A.el('div', { class: 'rail-brand' }, [
      A.el('span', { class: 'mark', text: 'I' }),
      A.el('span', {}, [
        A.el('div', { class: 'nm', text: 'Ideology' }),
        A.el('div', { class: 'sub', text: 'ideology.it' })
      ])
    ]));

    var pending = pendingAcrossStudio();
    SECTIONS.forEach(function (s) {
      r.appendChild(railItem({
        label: s.label, icon: s.icon,
        current: A.ui.section === s.key,
        badge: (s.key === 'home' || s.key === 'contenuti') ? pending : 0,
        onclick: function () {
          A.ui.section = s.key;
          if (s.key === 'clienti') A.ui.clientDetailId = null;
          A.render();
        }
      }));
    });

    var foot = A.el('div', { class: 'rail-foot' });
    foot.appendChild(railItem({ label: 'Backup', icon: 'down', title: 'Dati e backup', onclick: dataMenu }));

    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    foot.appendChild(railItem({
      label: dark ? 'Chiaro' : 'Scuro', icon: dark ? 'sun' : 'moon', title: 'Tema chiaro o scuro',
      onclick: function () { toggleTheme(); }
    }));

    if (A.dirty) {
      foot.appendChild(A.el('button', {
        class: 'btn primary sm rail-save', html: A.icon('check', 13) + '<span class="rtxt">Salva</span>',
        title: 'Salva le modifiche', onclick: function () { A.save(); }
      }));
      foot.appendChild(A.el('button', {
        class: 'btn ghost sm rail-save', html: A.icon('left', 13) + '<span class="rtxt">Annulla</span>',
        title: 'Torna all\'ultimo salvataggio',
        onclick: function () {
          A.confirm({
            title: 'Annullare le modifiche?',
            body: 'Tutto quello che non è stato salvato torna com\'era all\'ultimo salvataggio.',
            ok: 'Annulla modifiche', danger: true,
            run: function () { A.revert(); A.toast('Modifiche annullate'); }
          });
        }
      }));
    } else {
      var saved = A.el('span', { class: 'saved', id: 'save-state', dataset: { s: 'saved' }, style: 'padding:7px 10px;' });
      saved.appendChild(A.el('span', { class: 'pip' }));
      saved.appendChild(document.createTextNode('Salvato'));
      foot.appendChild(saved);
    }

    r.appendChild(foot);
    return r;
  }

  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ideology.theme', next); } catch (e) {}
    A.render();
  }

  /* ── Context bar (Contenuti only) ─────────────────────── */

  function contextBar() {
    var bar = A.el('div', { class: 'bar' });
    var client = A.curClient();
    var acc = A.curAccount();

    {
      var cw = A.el('span', { class: 'ctx-wrap' });
      var cs = A.el('select', { class: 'ctx', 'aria-label': 'Cliente' });
      A.S.clients.forEach(function (c) {
        cs.appendChild(A.el('option', { value: c.id, text: c.name, selected: A.ui.clientId === c.id }));
      });
      cs.addEventListener('change', function () { selectClient(cs.value); });
      cw.appendChild(cs);
      bar.appendChild(cw);
    }

    if (client && client.accounts.length > 1) {
      var aw = A.el('span', { class: 'ctx-wrap' });
      var as = A.el('select', { class: 'ctx', 'aria-label': 'Account' });
      client.accounts.forEach(function (a) {
        as.appendChild(A.el('option', {
          value: a.id, text: a.platform + ' · ' + a.handle, selected: A.ui.accountId === a.id
        }));
      });
      as.addEventListener('change', function () {
        A.ui.accountId = as.value;
        A.ui.selectedPostId = null; A.ui.selectedStoryId = null; A.ui.selectedSlotId = null;
        A.render();
      });
      aw.appendChild(as);
      bar.appendChild(aw);
    } else if (acc) {
      bar.appendChild(A.el('span', { class: 'ctx', style: 'font-weight:600;', text: acc.platform + ' · ' + acc.handle }));
    }

    bar.appendChild(A.el('span', { class: 'bar-sep' }));
    bar.appendChild(A.el('div', { class: 'monthnav' }, [
      A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Mese precedente', html: A.icon('left', 14), onclick: function () { A.ui.month = A.shiftMonth(A.ui.month, -1); A.render(); } }),
      A.el('span', { class: 'm', text: A.monthLabel(A.ui.month) }),
      A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Mese successivo', html: A.icon('right', 14), onclick: function () { A.ui.month = A.shiftMonth(A.ui.month, 1); A.render(); } })
    ]));
    if (A.ui.month !== A.thisMonth()) {
      bar.appendChild(A.el('button', { class: 'btn ghost sm hide-sm', text: 'Oggi', onclick: function () { A.ui.month = A.thisMonth(); A.render(); } }));
    }

    bar.appendChild(A.el('div', { class: 'bar-space' }));

    if (client) {
      bar.appendChild(A.el('button', {
        class: 'btn ghost sm hide-sm', html: A.icon('pencil', 12) + 'Scheda cliente',
        onclick: function () { A.goClient(client.id); }
      }));
    }
    return bar;
  }

  function selectClient(id) {
    A.ui.clientId = id;
    var c = A.get(id);
    A.ui.accountId = c && c.accounts[0] ? c.accounts[0].id : null;
    A.ui.selectedPostId = null;
    A.ui.selectedStoryId = null;
    A.ui.selectedSlotId = null;
    A.render();
  }

  /* ── Data menu ────────────────────────────────────────── */

  function dataMenu() {
    var fileInput = A.el('input', { type: 'file', accept: 'application/json', style: 'display:none' });
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { A.importAll(fr.result); A.closeModal(); A.toast('Backup importato'); }
        catch (e) { A.toast('File non valido: ' + e.message); }
      };
      fr.readAsText(f);
    });

    var counts = A.serialize().counts;
    var lines = [
      ['Clienti', counts.clients],
      ['Contenuti feed', counts.posts],
      ['Stories e storyboard', counts.stories],
      ['Slot UGC', counts.ugcSlots],
      ['Creator', counts.creators]
    ];
    var table = A.el('div', { style: 'display:flex;flex-direction:column;gap:5px;' });
    lines.forEach(function (l) {
      table.appendChild(A.el('div', {
        style: 'display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);' +
               'padding:5px 0;border-bottom:1px solid var(--rule);'
      }, [A.el('span', { text: l[0] }), A.el('b', { text: String(l[1]) })]));
    });

    A.modal({
      title: 'Dati e backup',
      body: [
        A.el('p', {
          style: 'margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2);',
          text: 'Tutto il lavoro resta in questo browser. Esporta un backup prima di cambiare macchina, o per passare il piano a un collega.'
        }),
        table,
        A.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' }, [
          A.el('button', { class: 'btn', html: A.icon('down', 13) + 'Esporta backup', onclick: A.exportAll }),
          A.el('button', { class: 'btn', html: A.icon('up', 13) + 'Importa backup', onclick: function () { fileInput.click(); } }),
          fileInput
        ])
      ],
      actions: [
        {
          label: 'Ricarica dati demo', kind: 'danger', keepOpen: true, run: function () {
            A.confirm({
              title: 'Ricaricare i dati demo?',
              body: 'Il lavoro salvato in questo browser viene sostituito dallo studio di esempio. Esporta prima un backup se ti serve.',
              ok: 'Ricarica', danger: true,
              run: function () { A.resetAll(); A.toast('Dati demo ricaricati'); }
            });
            return false;
          }
        },
        { label: 'Chiudi', kind: 'primary' }
      ]
    });
  }

  /* ── Tabs ─────────────────────────────────────────────── */

  function tabBar() {
    var bar = A.el('div', { class: 'tabs', role: 'tablist' });
    var posts = A.curPosts();
    var counts = {
      feed: posts.length,
      stories: A.curStories().length,
      ugc: A.curUgc().length,
      calendario: 0,
      anteprima: posts.filter(function (p) { return p.status === 'da_approvare' || p.status === 'in_revisione'; }).length
    };
    TABS.forEach(function (t) {
      var btn = A.el('button', {
        class: 'tab', role: 'tab', 'aria-selected': A.ui.tab === t.key ? 'true' : 'false',
        onclick: function () { A.ui.tab = t.key; A.render(); }
      }, [A.el('span', { text: t.label })]);
      if (counts[t.key]) btn.appendChild(A.el('span', { class: 'count', text: String(counts[t.key]) }));
      bar.appendChild(btn);
    });
    return bar;
  }

  /* ── Render ───────────────────────────────────────────── */

  A.render = function () {
    var root = A.$('#root');
    if (!root) return;

    if (!A.get(A.ui.clientId)) {
      var c0 = A.S.clients[0];
      A.ui.clientId = c0 ? c0.id : null;
      A.ui.accountId = c0 && c0.accounts[0] ? c0.accounts[0].id : null;
    }
    var client = A.curClient();
    if (client && !A.accountCtx(A.ui.accountId)) {
      A.ui.accountId = client.accounts[0] ? client.accounts[0].id : null;
    }

    var old = A.$('.canvas') || A.$('.preview-scroll');
    var scrollTop = old ? old.scrollTop : 0;

    A.clear(root);
    root.appendChild(rail());

    var main = A.el('div', { class: 'main' });

    if (A.ui.section === 'contenuti') {
      main.appendChild(contextBar());
      main.appendChild(tabBar());
      var pages = A.el('div', { class: 'pages' });
      var page = A.el('div', { class: 'page on' });
      (A.views[A.ui.tab] || A.views.feed)(page);
      pages.appendChild(page);
      main.appendChild(pages);
    } else {
      (A.views[A.ui.section] || A.views.home)(main);
    }

    root.appendChild(main);

    var fresh = A.$('.canvas') || A.$('.preview-scroll');
    if (fresh && scrollTop) fresh.scrollTop = scrollTop;
  };

  /* ── Boot ─────────────────────────────────────────────── */

  /* A client link must never open the studio. If one arrives here —
     an old link, or a host that served this page for a path it did
     not recognise — the studio does not render at all. It says where
     the link was meant to go and stops, because the alternative is
     handing a client the whole tool. */
  function clientLinkArrived() {
    var m = /[?&](?:c|cliente)=([^&]+)/.exec(location.search);
    if (!m) return false;

    var target = new URL('cliente.html?c=' + m[1], document.baseURI).href;
    var root = A.$('#root');
    A.clear(root);
    root.appendChild(A.el('div', { class: 'gate' }, [
      A.el('div', { class: 'gate-box' }, [
        A.el('span', { class: 'gate-mark', text: 'I' }),
        A.el('h1', { text: 'Questo è un link cliente' }),
        A.el('p', { text: 'L\'anteprima cliente è una pagina a parte. Questo indirizzo apre lo studio, quindi non prosegue da solo.' }),
        A.el('a', { class: 'btn primary', href: target, text: 'Apri l\'anteprima cliente' }),
        A.el('code', { class: 'gate-url', text: target })
      ])
    ]));
    return true;
  }

  A.boot = function () {
    try {
      var savedTheme = localStorage.getItem('ideology.theme');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}


    if (!A.load()) { A.seed(); A.save({ quiet: true }); }
    A.index();

    if (clientLinkArrived()) return;

    if (!A.ui.clientId) {
      var c = A.S.clients[0];
      if (c) { A.ui.clientId = c.id; A.ui.accountId = c.accounts[0] ? c.accounts[0].id : null; }
    }
    A.ui.section = 'home';

    A.setSaveState('saved');
    A.render();
  };

  window.addEventListener('beforeunload', function (e) {
    if (!A.dirty) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', A.boot);
  } else {
    A.boot();
  }
})(window.IDE);
</script>
