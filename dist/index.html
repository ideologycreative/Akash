  function refuse(t, e, err) {
    rejected[keyOf(t, e.id)] = e.s;
    console.error('[Ideology] il server ha rifiutato', t.name, e.id, err);
    A.toast('Una modifica non è stata salvata (' + (err.message || err.code) + ')');
  }

  /* ── Conflicts ─────────────────────────────────────────── */

  var LABELS = {
    caption: 'Didascalia', publish_date: 'Data', publish_time: 'Ora', status: 'Stato',
    media: 'Media', cover: 'Copertina', slides: 'Slide', kind: 'Formato', category_id: 'Categoria',
    paid: 'Sponsorizzato', partner: 'Collaborazione', internal_note: 'Nota interna',
    also_on: 'Pubblicato anche su', in_stories: 'Anche nelle Stories', editorial: 'Testo della card',
    title: 'Titolo', note: 'Nota', name: 'Nome', handle: 'Account', bio: 'Bio', brief: 'Brief',
    frames: 'Fotogrammi', story_date: 'Data', slot_date: 'Data', prefs: 'Impostazioni',
    palette: 'Colori', goals: 'Obiettivi', description: 'Descrizione', color: 'Colore',
    month: 'Mese', sort_order: 'Ordine', show_date: 'Mostra data', creator_id: 'Creator',
    mode: 'Modalità', fee: 'Compenso', followers: 'Follower', following: 'Seguiti',
    avatar: 'Immagine profilo', video_name: 'Video', story_ids: 'Stories collegate', ratio: 'Formato',
    platform: 'Piattaforma', share_token: 'Link cliente', share_enabled: 'Link cliente attivo'
  };

  R.whoIs = function (userId) {
    if (!userId) return 'il cliente';
    if (R.user && userId === R.user.id) return 'tu, da un\'altra finestra';
    var m = R.members[userId];
    return m ? (m.display_name || m.email || 'un collega') : 'un collega';
  };

  async function reconcile(t, e) {
    var k = keyOf(t, e.id), b = base[k];
    var got = await R.sb.from(t.name).select('*').eq('id', e.id).maybeSingle();
    alive();
    if (got.error) boom(got);

    if (!got.data) {
      removeLocal(t, e.id);
      delete base[k];
      A.index(); A.scheduleRender();
      A.toast('Un elemento che stavi modificando è stato eliminato da un collega');
      return;
    }

    /* "Mine" is the record as it is now, not as it was when this save
       started: anything typed while the request was in flight stays. */
    var theirs = canon(t, got.data);
    var loc = findLocal(t, e.id) || { rec: e.rec, parent: e.parent };
    var mine = toRow(t, loc.rec, loc.parent);
    var merged = {}, clash = [];
    Object.keys(mine).forEach(function (col) {
      var bs = stable(b.row[col]), ls = stable(mine[col]), ts = stable(theirs[col]);
      if (ls === bs) merged[col] = theirs[col];
      else if (ts === bs || ts === ls) merged[col] = mine[col];
      else { clash.push(col); merged[col] = mine[col]; }
    });

    setBase(t, got.data);
    var before = clone(loc.rec);
    writeInto(t, loc.rec, merged);
    changed(t.name, e.id, diffFields(before, loc.rec));

    if (!clash.length) { again = true; return; }

    conflicts[k] = { t: t, id: e.id, rec: loc.rec, cols: clash, theirs: theirs, by: got.data.updated_by };
    showConflicts();
  }

  function describe(c) {
    var r = c.rec;
    if (c.t.name === 'posts') {
      var first = (r.caption || '').split('\n')[0].trim().slice(0, 40);
      return 'il contenuto' + (r.date ? ' del ' + A.dayLabel(r.date) : '') + (first ? ' «' + first + '…»' : '');
    }
    if (c.t.name === 'clients') return 'il cliente ' + (r.name || '');
    if (c.t.name === 'stories') return 'la story ' + (r.title ? '«' + r.title + '»' : '');
    return 'un elemento';
  }

  function showConflicts() {
    var host = document.getElementById('conflict-bar');
    if (!host) {
      host = A.el('div', { id: 'conflict-bar', class: 'conflict-bar', role: 'alertdialog', 'aria-live': 'assertive' });
      document.body.appendChild(host);
    }
    A.clear(host);
    var keys = Object.keys(conflicts);
    if (!keys.length) { host.remove(); A.setSaveState(R.pendingCount() ? 'pending' : 'saved'); return; }
    var c = conflicts[keys[0]];
    host.appendChild(A.el('div', { class: 'cb-text' }, [
      A.el('strong', { text: 'Modifiche in contemporanea. ' }),
      document.createTextNode('Mentre lavoravi su ' + describe(c) + ', ' + R.whoIs(c.by) +
        ' ha cambiato: ' + c.cols.map(function (col) { return LABELS[col] || col; }).join(', ') + '.'),
      keys.length > 1 ? A.el('span', { class: 'cb-more', text: ' (+' + (keys.length - 1) + ')' }) : null
    ]));
    host.appendChild(A.el('div', { class: 'cb-actions' }, [
      A.el('button', { class: 'btn sm', text: 'Usa la loro versione', onclick: function () { settle(keys[0], 'theirs'); } }),
      A.el('button', { class: 'btn primary sm', text: 'Tieni la mia', onclick: function () { settle(keys[0], 'mine'); } })
    ]));
    A.setSaveState('conflict');
  }

  function settle(k, choice) {
    var c = conflicts[k];
    if (!c) return;
    delete conflicts[k];
    if (choice === 'theirs') {
      var patch = {};
      c.cols.forEach(function (col) { patch[col] = c.theirs[col]; });
      var loc = findLocal(c.t, c.id);
      if (loc) {
        var row = toRow(c.t, loc.rec, loc.parent);
        Object.assign(row, patch);
        var before = clone(loc.rec);
        writeInto(c.t, loc.rec, row);
        changed(c.t.name, c.id, diffFields(before, loc.rec));
      }
      A.render();
    }
    showConflicts();
    R.flush();
  }
  R._conflicts = conflicts;
  R._settle = settle;

  /* ── History ───────────────────────────────────────────── */

  async function flushEvents() {
    var rows = [], entries = [];
    A.S.posts.forEach(function (p) {
      if (!base[keyOf(BY_NAME.posts, p.id)]) return;      // post not on the server yet
      (p.history || []).forEach(function (h) {
        if (!isUuid(h.id)) h.id = A.uuid();
        if (baseEvents[h.id]) return;
        rows.push({
          id: h.id, workspace_id: R.ws, post_id: p.id,
          at: V.ts.row(h.at) || new Date().toISOString(),
          from_status: h.from || null, to_status: h.to,
          actor: 'studio',
          note: (h.by === 'cliente' ? '[dal cliente] ' : '') + (h.note || '')
        });
        entries.push(h);
      });
    });
    if (!rows.length) return;
    var res = await R.sb.from('post_events').insert(rows).select('id, actor_user');
    alive();
    if (res.error) {
      if (isNetworkError(res.error)) boom(res);
      console.error('[Ideology] cronologia', res.error);
      rows.forEach(function (r) { baseEvents[r.id] = true; });      // do not retry forever
      return;
    }
    res.data.forEach(function (r) { baseEvents[r.id] = true; });
    entries.forEach(function (h) { if (!h.user && R.user) h.user = R.user.id; });
  }

  /* ── Live changes from colleagues ──────────────────────── */

  var channel = null, lastSync = Date.now(), hiddenAt = 0;

  /* → the record fields that changed, or false if the row could not be
     placed (its parent has not arrived yet). */
  function applyRemote(t, row) {
    var loc = findLocal(t, row.id), fields = [];
    if (loc) {
      var before = clone(loc.rec);
      writeInto(t, loc.rec, canon(t, row));
      fields = diffFields(before, loc.rec);
    } else if (!addLocal(t, row)) return false;
    setBase(t, row);
    return fields;
  }

  function diffFields(a, b) {
    var out = [];
    Object.keys(b).forEach(function (k) { if (k.charAt(0) !== '_' && stable(a[k]) !== stable(b[k])) out.push(k); });
    return out;
  }

  function onChange(payload) {
    lastSync = Date.now();
    if (payload.table === 'post_events') return onEvent(payload.new);
    var t = BY_NAME[payload.table];
    if (!t) return;

    if (payload.eventType === 'DELETE') {
      var id = payload.old && payload.old.id;
      if (!id) return;
      if (!base[keyOf(t, id)] && !findLocal(t, id)) return;
      removeLocal(t, id);
      delete base[keyOf(t, id)];
      changed(t.name, id);
      return;
    }

    var row = payload.new;
    if (!row || !row.id) return;
    var k = keyOf(t, row.id), b = base[k];
    if (b && b.version >= row.version) return;           // our own write, echoed back
    if (!b && findLocal(t, row.id)) return;               // our insert, answer still on its way
    if (b && isPending(t, row.id)) return;                // unsaved edits here: the save will merge
    var fields = applyRemote(t, row);
    if (fields) changed(t.name, row.id, fields);
    else R.refresh();                                     // arrived before its parent
  }

  function onEvent(e) {
    if (!e || baseEvents[e.id]) return;
    baseEvents[e.id] = true;
    var p = A.get(e.post_id);
    if (p) {
      p.history = p.history || [];
      if (!p.history.some(function (h) { return h.id === e.id; })) p.history.push(eventToEntry(e));
      changed('post_events', e.post_id, ['history']);
    }
  }

  var listeners = [];
  R.onRemote = function (fn) { listeners.push(fn); return function () { listeners = listeners.filter(function (f) { return f !== fn; }); }; };
  function changed(table, id, fields) {
    A.index();
    A.scheduleRender();
    listeners.slice().forEach(function (fn) { try { fn(table, id, fields || []); } catch (e) { console.error(e); } });
  }

  /* An open dialog keeps a snapshot for "Annulla modifiche". When a
     colleague or the client changes the same record meanwhile, their
     change is folded into the snapshot — so undoing my edits never
     undoes theirs (a client's approval, a colleague's new date). */
  A.followSnapshot = function (id, holder) {
    if (!R.on || !R.onRemote) return function () {};
    return R.onRemote(function (table, rid, fields) {
      if (rid !== id || !fields || !fields.length) return;
      var rec = A.get(id);
      if (!rec) return;
      var snap = JSON.parse(holder.snap);
      fields.forEach(function (f) { snap[f] = clone(rec[f]); });
      holder.snap = JSON.stringify(snap);
    });
  };

  R.subscribe = function () {
    if (channel) R.sb.removeChannel(channel);
    var filter = 'workspace_id=eq.' + R.ws;
    channel = R.sb.channel('studio:' + R.ws);
    TABLES.forEach(function (t) {
      channel.on('postgres_changes',
        { event: '*', schema: 'public', table: t.name, filter: t.single ? 'id=eq.' + R.ws : filter },
        onChange);
    });
    channel.on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'post_events', filter: filter }, onChange);
    var wasDown = false;
    channel.subscribe(function (status) {
      if (status === 'SUBSCRIBED') { if (wasDown) R.refresh(); wasDown = false; }
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') wasDown = true;
    });
  };

  /* After being away (laptop asleep, connection dropped) the live feed
     may have missed something. Fetch everything and fold it in, never
     touching a record with unsaved edits. */
  var refreshing = false;
  R.refresh = async function () {
    if (!R.ready || refreshing) return;
    refreshing = true;
    var g = R.gen, w = R.ws;
    try {
      var seen = {};
      for (var i = 0; i < TABLES.length; i++) {
        var t = TABLES[i];
        var rows = t.single
          ? [(await R.sb.from('workspaces').select('*').eq('id', R.ws).single()).data].filter(Boolean)
          : await fetchAll(t.name);
        if (R.gen !== g || R.ws !== w) return;            // switched studio meanwhile
        rows.forEach(function (row) {
          var k = keyOf(t, row.id), b = base[k];
          seen[k] = true;
          if (b && b.version >= row.version) return;
          if (b && isPending(t, row.id)) return;
          if (!b && findLocal(t, row.id)) return;
          var f = applyRemote(t, row);
          if (f && f.length) changed(t.name, row.id, f);
        });
      }
      Object.keys(base).forEach(function (k) {
        if (seen[k]) return;
        var name = k.split(':')[0], id = k.slice(name.length + 1), t = BY_NAME[name];
        if (!t || t.single) return;
        if (isPending(t, id) && findLocal(t, id)) return;
        removeLocal(t, id);
        delete base[k];
      });
      var evs = await fetchAll('post_events');
      if (R.gen !== g || R.ws !== w) return;
      evs.forEach(onEvent);
      lastSync = Date.now();
      A.index(); A.scheduleRender();
    } catch (e) {
      if (!e.network) console.error('[Ideology] aggiornamento', e);
    } finally {
      refreshing = false;
    }
  };

  document.addEventListener('visibilitychange', function () {
    if (!R.ready) return;
    if (document.hidden) { hiddenAt = Date.now(); R.flush(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 60000) R.refresh();
  });
  window.addEventListener('online', function () { if (R.ready) { R.flush(); R.refresh(); } });

  /* ── Media in Storage ──────────────────────────────────── */

  var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  var SIGN_TTL = 3600;           // a removed member's links stop working within the hour
  var signed = {}, waiting = {}, signTimer = null;

  function isPath(ref) { return typeof ref === 'string' && ref !== '' && !/^[a-z][a-z0-9+.-]*:/i.test(ref); }
  R.isPath = isPath;

  /* Called by A.el for every src/poster: a storage path becomes a
     signed URL, fetched in batches; the element fills in when it
     arrives. Links and data URLs pass through untouched. */
  A.resolveMedia = function (ref, node, attr) {
    if (!R.on || !isPath(ref)) return ref;
    var hit = signed[ref];
    if (hit && hit.exp > Date.now() + 60000) return hit.url;
    (waiting[ref] = waiting[ref] || []).push([node, attr]);
    clearTimeout(signTimer);
    signTimer = setTimeout(signWaiting, 0);
    return attr === 'poster' ? '' : BLANK;
  };

  async function signPaths(paths) {
    for (var i = 0; i < paths.length; i += 300) {
      var chunk = paths.slice(i, i + 300);
      var res = await R.sb.storage.from('media').createSignedUrls(chunk, SIGN_TTL);
      if (res.error) { console.error('[Ideology] firma media', res.error); continue; }
      var exp = Date.now() + SIGN_TTL * 1000;
      (res.data || []).forEach(function (r) { if (r.signedUrl && r.path) signed[r.path] = { url: r.signedUrl, exp: exp }; });
    }
  }

  async function signWaiting() {
    var batch = waiting;
    waiting = {};
    var paths = Object.keys(batch);
    if (!paths.length) return;
    await signPaths(paths);
    paths.forEach(function (p) {
      var url = signed[p] && signed[p].url;
      if (!url) return;
      batch[p].forEach(function (pair) { if (pair[0]) pair[0].setAttribute(pair[1], url); });
    });
  }

  function mediaRefs() {
    var set = {};
    function add(v) { if (isPath(v)) set[v] = 1; }
    A.S.clients.forEach(function (c) { (c.accounts || []).forEach(function (a) { add(a.avatarUrl); }); });
    A.S.posts.forEach(function (p) {
      add(p.mediaUrl); add(p.coverUrl);
      (p.slides || []).forEach(function (s) { add(s.url); });
    });
    A.S.stories.forEach(function (s) { add(s.mediaUrl); (s.frames || []).forEach(function (f) { add(f.url); }); });
    A.S.highlights.forEach(function (h) { add(h.coverUrl); });
    return Object.keys(set);
  }

  R.preloadMedia = function () { return signPaths(mediaRefs()); };

  function extOf(type) {
    return ({ 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif',
      'image/avif': 'avif', 'video/mp4': 'mp4', 'video/quicktime': 'mov', 'video/webm': 'webm' })[type] || '';
  }

  function folder() {
    var c = A.ui.clientDetailId || A.ui.clientId || 'condivisi';
    return R.ws + '/' + (isUuid(c) ? c : 'condivisi');
  }

  R.MAX_UPLOAD = 50 * 1024 * 1024;

  R.uploadBlob = async function (blob, type) {
    type = type || blob.type;
    var ext = extOf(type);
    if (!ext) throw new Error('Formato non supportato (' + (type || 'sconosciuto') + ')');
    if (blob.size > R.MAX_UPLOAD) throw new Error('File oltre ' + A.humanSize(R.MAX_UPLOAD));
    var path = folder() + '/' + A.uuid() + '.' + ext;
    var res = await R.sb.storage.from('media').upload(path, blob, {
      contentType: type, cacheControl: '31536000', upsert: false
    });
    if (res.error) throw new Error('Caricamento non riuscito: ' + res.error.message);
    try { signed[path] = { url: URL.createObjectURL(blob), exp: Date.now() + 7 * 24 * 3600 * 1000 }; } catch (e) {}
    return path;
  };

  function dataUrlToBlob(d) {
    var m = /^data:([^;,]+)(;base64)?,(.*)$/.exec(d);
    if (!m) throw new Error('dato non valido');
    var bytes = m[2] ? atob(m[3]) : decodeURIComponent(m[3]);
    var arr = new Uint8Array(bytes.length);
    for (var i = 0; i < bytes.length; i++) arr[i] = bytes.charCodeAt(i);
    return new Blob([arr], { type: m[1] });
  }

  /* SVG can carry script, so the bucket refuses it. Anything that is
     not a plain raster image is drawn onto a canvas first. */
  function rasterize(dataUrl) {
    return new Promise(function (resolve, reject) {
      var probe = document.createElement('canvas');
      if (!probe.getContext || !probe.getContext('2d')) return reject(new Error('conversione non disponibile'));
      var timer = setTimeout(function () { reject(new Error('immagine non leggibile')); }, 15000);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth || 1080, h = img.naturalHeight || 1080;
          var s = Math.min(1, 1600 / Math.max(w, h));
          var cv = document.createElement('canvas');
          cv.width = Math.round(w * s); cv.height = Math.round(h * s);
          var cx = cv.getContext('2d');
          cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          cv.toBlob(function (b) { clearTimeout(timer); b ? resolve(b) : reject(new Error('conversione non riuscita')); }, 'image/jpeg', 0.86);
        } catch (e) { clearTimeout(timer); reject(e); }
      };
      img.onerror = function () { clearTimeout(timer); reject(new Error('immagine non leggibile')); };
      img.src = dataUrl;
    });
  }

  R.uploadDataUrl = async function (d) {
    var blob = dataUrlToBlob(d);
    if (!extOf(blob.type)) blob = await rasterize(d);
    return R.uploadBlob(blob, blob.type);
  };

  /* Used by every upload control: in the shared studio the file goes
     to Storage and the record keeps its path. */
  A.storeMedia = function (res, file) {
    if (!R.on) return Promise.resolve(res);
    if (typeof res === 'string') {
      return /^data:/.test(res) ? R.uploadDataUrl(res) : Promise.resolve(res);
    }
    if (res && typeof res === 'object') {
      var jobs = [];
      if (file && file.size <= R.MAX_UPLOAD && extOf(file.type)) {
        jobs.push(R.uploadBlob(file, file.type).then(function (p) { res.dataUrl = p; }));
      } else if (/^data:/.test(res.dataUrl || '')) {
        jobs.push(R.uploadDataUrl(res.dataUrl).then(function (p) { res.dataUrl = p; }));
      } else if (!/^https?:/i.test(res.dataUrl || '')) {
        res.dataUrl = '';
      }
      if (/^data:/.test(res.poster || '')) {
        jobs.push(R.uploadDataUrl(res.poster).then(function (p) { res.poster = p; }));
      }
      return Promise.all(jobs).then(function () { return res; });
    }
    return Promise.resolve(res);
  };

  /* Move every inline image in the current state into Storage. Used
     when a browser's own document, or the demo, becomes the studio's
     first content. Identical images are uploaded once. */
  R.uploadInlineMedia = async function (onProgress) {
    var refs = [];
    function visit(obj, key) { if (/^data:/.test(obj[key] || '')) refs.push([obj, key]); }
    A.S.clients.forEach(function (c) { (c.accounts || []).forEach(function (a) { visit(a, 'avatarUrl'); }); });
    A.S.posts.forEach(function (p) {
      visit(p, 'mediaUrl'); visit(p, 'coverUrl');
      (p.slides || []).forEach(function (s) { visit(s, 'url'); });
    });
    A.S.stories.forEach(function (s) { visit(s, 'mediaUrl'); (s.frames || []).forEach(function (f) { visit(f, 'url'); }); });
    A.S.highlights.forEach(function (h) { visit(h, 'coverUrl'); });

    var done = {}, unique = 0, n = 0;
    refs.forEach(function (r) { if (!done.hasOwnProperty(r[0][r[1]])) { done[r[0][r[1]]] = null; unique++; } });
    for (var i = 0; i < refs.length; i++) {
      var obj = refs[i][0], key = refs[i][1], d = obj[key];
      if (done[d] === null) {
        try { done[d] = await R.uploadDataUrl(d); }
        catch (e) { console.warn('[Ideology] immagine non caricata', e.message); done[d] = ''; }
        n++;
        if (onProgress) onProgress(n, unique);
      }
      obj[key] = done[d];
    }
  };

  /* Give every record a fresh UUID and repoint every reference to it.
     Browser documents use readable ids; the database uses UUIDs. */
  R.remapIds = function () {
    var S = A.S, map = {};
    function id(old) {
      if (!old) return old;
      if (!map[old]) map[old] = isUuid(old) ? old : A.uuid();
      return map[old];
    }
    S.clients.forEach(function (c) {
      c.id = id(c.id);
      if (!/^[A-Za-z0-9_-]{32,128}$/.test(c.shareToken || '')) c.shareToken = A.newToken();
      (c.accounts || []).forEach(function (a) { a.id = id(a.id); });
    });
    ['categories', 'creators', 'posts', 'stories', 'highlights', 'ugcSlots'].forEach(function (k) {
      S[k].forEach(function (r) { r.id = id(r.id); });
    });
    S.categories.forEach(function (c) { c.clientId = map[c.clientId] || c.clientId; });
    S.creators.forEach(function (c) { c.clientId = map[c.clientId] || c.clientId; });
    S.posts.forEach(function (p) {
      p.accountId = map[p.accountId] || p.accountId;
      p.categoryId = p.categoryId ? (map[p.categoryId] || '') : '';
      p.alsoOn = (p.alsoOn || []).map(function (x) { return map[x]; }).filter(Boolean);
      p.storyIds = (p.storyIds || []).map(function (x) { return map[x]; }).filter(Boolean);
      (p.history || []).forEach(function (h) { h.id = A.uuid(); });
    });
    S.stories.forEach(function (s) {
      s.accountId = map[s.accountId] || s.accountId;
      s.fromPostId = s.fromPostId ? (map[s.fromPostId] || '') : '';
    });
    S.highlights.forEach(function (h) {
      h.accountId = map[h.accountId] || h.accountId;
      h.storyIds = (h.storyIds || []).map(function (x) { return map[x]; }).filter(Boolean);
    });
    S.ugcSlots.forEach(function (u) {
      u.accountId = map[u.accountId] || u.accountId;
      u.creatorId = u.creatorId ? (map[u.creatorId] || '') : '';
    });
    ['clientId', 'accountId', 'clientDetailId', 'selectedPostId', 'selectedStoryId'].forEach(function (k) {
      if (A.ui[k]) A.ui[k] = map[A.ui[k]] || null;
    });
    A.index();
  };

  /* ── Members ───────────────────────────────────────────── */

  R.loadMembers = async function () {
    var res = await R.sb.from('workspace_members').select('*').eq('workspace_id', R.ws);
    if (res.error) boom(res);
    R.members = {};
    res.data.forEach(function (m) { R.members[m.user_id] = m; if (R.user && m.user_id === R.user.id) R.role = m.role; });
    return res.data;
  };

  R.start = function () {
    R.subscribe();
  };

  R.stop = function () {
    if (channel) { R.sb.removeChannel(channel); channel = null; }
    R.ready = false;
    R.gen++;
  };

  /* test hook */
  R._reset = function () {
    [base, baseEvents, rejected, conflicts].forEach(function (o) { Object.keys(o).forEach(function (k) { delete o[k]; }); });
    flushing = false; again = false;
  };
})(window.IDE);
</script>
<script>
/* src/js/16-session.js */
/* ============================================================
   Ideology — signing in, choosing the studio, the team

   Only used when 00-config.js names a Supabase project.

   Who gets in: people with a login (an owner creates it in the
   Supabase dashboard — public sign-up is off) who belong to a
   studio. Belonging comes from an invite: an owner adds the
   colleague's email here; the next time that person signs in they
   see the invite — studio, role, who sent it — and choose to
   accept or decline. Nothing is joined automatically. An email
   nobody invited gets an empty screen, never data: the database
   decides that, not this page.
   ============================================================ */

(function (A) {
  'use strict';

  var R = A.remote;
  var CFG = window.IDEOLOGY_CONFIG || {};
  var LAST_WS = 'ideology.workspace';
  var S = A.session = {};

  /* ── Screens ───────────────────────────────────────────── */

  function screen(title, text, nodes) {
    var root = A.$('#root');
    A.closeModal();
    A.clear(root);
    var box = A.el('div', { class: 'gate-box' }, [
      A.el('span', { class: 'gate-mark', text: 'I' }),
      A.el('h1', { text: title }),
      text ? A.el('p', { text: text }) : null
    ]);
    (nodes || []).forEach(function (n) { if (n) box.appendChild(n); });
    root.appendChild(A.el('div', { class: 'gate' }, [box]));
    var f = box.querySelector('input');
    if (f) setTimeout(function () { f.focus(); }, 30);
    return box;
  }

  S.problem = function (title, text, retry) {
    screen(title, text, [
      retry ? A.el('button', { class: 'btn primary', text: 'Riprova', onclick: retry }) : null
    ]);
  };

  function busy(text) { screen(text || 'Un momento…', ''); }

  function formError(form, msg) {
    var e = form.querySelector('.gate-err');
    if (!e) { e = A.el('div', { class: 'gate-err', role: 'alert' }); form.appendChild(e); }
    e.textContent = msg || '';
  }

  function italian(err) {
    var m = String((err && err.message) || err || '');
    if (/invalid login credentials/i.test(m)) return 'Email o password non corretti.';
    if (/email not confirmed/i.test(m)) return 'Questo indirizzo non è ancora confermato.';
    if (/rate limit|too many/i.test(m)) return 'Troppi tentativi. Riprova tra qualche minuto.';
    if (/password should be at least|weak/i.test(m)) return 'La password è troppo corta: almeno 10 caratteri.';
    if (/fetch|network|load failed/i.test(m)) return 'Non riesco a raggiungere il server. Controlla la connessione.';
    return m || 'Qualcosa non ha funzionato.';
  }

  /* ── Start ─────────────────────────────────────────────── */

  S.start = async function () {
    busy('Apro lo studio…');
    R.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'ideology.auth' }
    });

    R.sb.auth.onAuthStateChange(function (event) {
      if (event === 'PASSWORD_RECOVERY') setTimeout(showNewPassword, 0);
      if (event === 'SIGNED_OUT') { R.stop(); setTimeout(function () { showLogin(); }, 0); }
    });

    try {
      var res = await R.sb.auth.getSession();
      if (res.error) throw res.error;
      if (!res.data.session) return showLogin();
      if (/type=recovery/.test(location.hash)) return;   // the recovery event takes over
      await afterLogin(res.data.session.user);
    } catch (e) {
      S.problem('Lo studio non risponde', italian(e), S.start);
    }
  };

  function showLogin(msg) {
    var email = A.el('input', { class: 'inp', type: 'email', autocomplete: 'username', placeholder: 'nome@ideology.it', required: true });
    var pass = A.el('input', { class: 'inp', type: 'password', autocomplete: 'current-password', placeholder: 'Password', required: true });
    var go = A.el('button', { class: 'btn primary', type: 'submit', text: 'Entra' });
    var form = A.el('form', { class: 'gate-form' }, [
      A.el('label', { class: 'field' }, [A.el('span', { text: 'Email' }), email]),
      A.el('label', { class: 'field' }, [A.el('span', { text: 'Password' }), pass]),
      go,
      A.el('button', {
        class: 'btn ghost sm', type: 'button', text: 'Password dimenticata?',
        onclick: async function () {
          var addr = email.value.trim();
          if (!addr) { formError(form, 'Scrivi prima la tua email.'); email.focus(); return; }
          var r = await R.sb.auth.resetPasswordForEmail(addr, { redirectTo: location.origin + location.pathname });
          formError(form, r.error ? italian(r.error) : 'Se l\'indirizzo ha un accesso, arriva una mail con il link per una nuova password.');
        }
      })
    ]);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      go.disabled = true;
      formError(form, '');
      var r = await R.sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
      go.disabled = false;
      if (r.error) { formError(form, italian(r.error)); pass.select(); return; }
      afterLogin(r.data.user);
    });
    screen('Entra nello studio', msg || 'Accedi con l\'account che ti ha dato lo studio.', [form]);
  }

  function showNewPassword() {
    var pass = A.el('input', { class: 'inp', type: 'password', autocomplete: 'new-password', minlength: '10', placeholder: 'Almeno 10 caratteri', required: true });
    var go = A.el('button', { class: 'btn primary', type: 'submit', text: 'Salva la password' });
    var form = A.el('form', { class: 'gate-form' }, [
      A.el('label', { class: 'field' }, [A.el('span', { text: 'Nuova password' }), pass]), go
    ]);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      if (pass.value.length < 10) { formError(form, 'Almeno 10 caratteri.'); return; }
      go.disabled = true;
      var r = await R.sb.auth.updateUser({ password: pass.value });
      go.disabled = false;
      if (r.error) { formError(form, italian(r.error)); return; }
      history.replaceState(null, '', location.pathname);
      afterLogin(r.data.user);
    });
    screen('Nuova password', 'Scegli la password per entrare nello studio.', [form]);
  }

  /* ── Which studio ──────────────────────────────────────── */

  async function afterLogin(user) {
    R.user = user;
    busy('Apro lo studio…');
    try {
      var inv = await R.sb.rpc('pending_invites');
      if (inv.error) throw inv.error;
      if (inv.data && inv.data.length) return showInvites(inv.data);

      var mine = await R.sb.from('workspace_members')
        .select('workspace_id, role, created_at, workspaces(name)')
        .eq('user_id', user.id)
        .order('created_at', { ascending: true });
      if (mine.error) throw mine.error;

      R.workspaces = mine.data.map(function (m) {
        return { id: m.workspace_id, role: m.role, name: (m.workspaces && m.workspaces.name) || 'Studio' };
      });
      if (!R.workspaces.length) return showNoStudio();

      var last = null;
      try { last = localStorage.getItem(LAST_WS); } catch (e) {}
      var pick = R.workspaces.filter(function (w) { return w.id === last; })[0] || R.workspaces[0];
      await openWorkspace(pick);
    } catch (e) {
      S.problem('Lo studio non risponde', italian(e), function () { afterLogin(user); });
    }
  }

  /* One screen per sign-in that has invites waiting: who, which studio,
     which role — and the choice is the invited person's. */
  function showInvites(list) {
    var rows = list.map(function (i) {
      var line = A.el('div', { class: 'invite-row' }, [
        A.el('div', { class: 'invite-text' }, [
          A.el('strong', { text: i.workspace_name }),
          A.el('span', { text: (i.role === 'owner' ? 'come proprietario' : 'come editor') +
            (i.invited_by_email ? ' · invito di ' + i.invited_by_email : '') })
        ]),
        A.el('div', { class: 'invite-actions' }, [
          A.el('button', { class: 'btn sm', type: 'button', text: 'Rifiuta', onclick: function () { answer('decline_invite', i, line); } }),
          A.el('button', { class: 'btn primary sm', type: 'button', text: 'Accetta', onclick: function () { answer('accept_invite', i, line); } })
        ])
      ]);
      return line;
    });
    var box = screen(list.length === 1 ? 'Hai un invito' : 'Hai ' + list.length + ' inviti',
      'Entri in uno studio solo se accetti. Se non conosci chi ti ha invitato, rifiuta.', rows);

    async function answer(fn, i, line) {
      Array.prototype.forEach.call(line.querySelectorAll('button'), function (b) { b.disabled = true; });
      var r = await R.sb.rpc(fn, { p_workspace: i.workspace_id });
      if (r.error) { A.toast(italian(r.error)); Array.prototype.forEach.call(line.querySelectorAll('button'), function (b) { b.disabled = false; }); return; }
      if (fn === 'accept_invite') { try { localStorage.setItem(LAST_WS, i.workspace_id); } catch (e) {} }
      line.remove();
      if (!box.querySelector('.invite-row')) afterLogin(R.user);
    }
  }

  async function openWorkspace(w) {
    /* Finish saving the studio we are leaving before touching anything
       of the next one. */
    if (R.ready) {
      busy('Salvo…');
      await R.whenIdle();
      await A.saveNow();
      await R.whenIdle();
    }
    busy('Carico ' + w.name + '…');
    R.stop();
    R.ws = w.id;
    R.role = w.role;
    R.wsName = w.name;
    try { localStorage.setItem(LAST_WS, w.id); } catch (e) {}
    await R.loadMembers();
    await R.loadAll();
    R.start();
    if (!A.S.clients.length) return showFirstContent();
    A.finishBoot();
  }

  function showNoStudio() {
    var name = A.el('input', { class: 'inp', placeholder: 'Ideology', value: 'Ideology', required: true });
    var go = A.el('button', { class: 'btn primary', type: 'submit', text: 'Crea lo studio' });
    var form = A.el('form', { class: 'gate-form' }, [
      A.el('label', { class: 'field' }, [A.el('span', { text: 'Nome dello studio' }), name]), go
    ]);
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      go.disabled = true;
      var r = await R.sb.rpc('create_workspace', { p_name: name.value.trim() || 'Studio' });
      go.disabled = false;
      if (r.error) { formError(form, italian(r.error)); return; }
      afterLogin(R.user);
    });
    screen('Non fai ancora parte di uno studio',
      'Se un collega ti ha invitato, chiedigli di controllare che l\'invito sia per ' + (R.user.email || 'questa email') +
      '. Se sei il primo, crea lo studio: ne diventi il proprietario.', [
        form,
        A.el('button', { class: 'btn ghost sm', type: 'button', text: 'Esci', onclick: function () { R.sb.auth.signOut(); } })
      ]);
  }

  /* An empty studio, the first time: start from this browser's own
     work, from the example, or from nothing. */
  function showFirstContent() {
    var local = null;
    try {
      var raw = localStorage.getItem('ideology.content.v1');
      var parsed = raw ? JSON.parse(raw) : null;
      if (parsed && !parsed.__demo && Array.isArray(parsed.clients) && parsed.clients.length) local = parsed;
    } catch (e) { local = null; }

    var status = A.el('p', { class: 'gate-note' });
    function run(fill) {
      return async function () {
        Array.prototype.forEach.call(document.querySelectorAll('.gate-box button'), function (b) { b.disabled = true; });
        /* No autosave until every image is in Storage: the database
           refuses rows that still carry inline images. */
        R.paused = true;
        try {
          fill();
          R.remapIds();
          await R.uploadInlineMedia(function (n, tot) { status.textContent = 'Carico le immagini: ' + n + ' di ' + tot; });
          status.textContent = 'Salvo nello studio…';
          R.paused = false;
          await A.saveNow();
          if (A.ui.saveState === 'error') throw new Error('Una parte non è stata salvata: riprova dal pulsante in basso a sinistra.');
          A.finishBoot();
        } catch (e) {
          R.paused = false;
          status.textContent = italian(e);
          Array.prototype.forEach.call(document.querySelectorAll('.gate-box button'), function (b) { b.disabled = false; });
        }
      };
    }

    screen('Lo studio è vuoto', 'Da dove partiamo? Si fa una volta sola.', [
      local ? A.el('button', {
        class: 'btn primary', type: 'button',
        text: 'Porta qui il lavoro di questo browser (' + local.clients.length + (local.clients.length === 1 ? ' cliente' : ' clienti') + ')',
        onclick: run(function () { A.hydrate(JSON.parse(JSON.stringify(local))); })
      }) : null,
      A.el('button', {
        class: 'btn' + (local ? '' : ' primary'), type: 'button', text: 'Inizia con lo studio di esempio',
        onclick: run(function () { A.seed(); })
      }),
      A.el('button', {
        class: 'btn ghost', type: 'button', text: 'Inizia da zero',
        onclick: function () { A.finishBoot(); A.ui.section = 'clienti'; A.render(); }
      }),
      status
    ]);
  }

  /* ── Team ──────────────────────────────────────────────── */

  S.openTeam = async function () {
    var owner = R.role === 'owner';
    var body = A.el('div', { style: 'display:flex;flex-direction:column;gap:16px;' });
    A.modal({ title: 'Team · ' + R.wsName, body: [body], actions: [{ label: 'Chiudi', kind: 'primary' }] });

    async function paint() {
      A.clear(body);
      body.appendChild(A.el('p', { class: 'hint', text: 'Caricamento…' }));
      var members, invites;
      try {
        members = await R.loadMembers();
        var inv = await R.sb.from('workspace_invites').select('*').eq('workspace_id', R.ws).order('created_at');
        if (inv.error) throw inv.error;
        invites = inv.data;
      } catch (e) { A.clear(body); body.appendChild(A.el('p', { text: italian(e) })); return; }
      A.clear(body);

      body.appendChild(A.el('div', { class: 'team-me' }, [
        A.el('div', {}, [
          A.el('div', { class: 'tm-email', text: R.user.email || '' }),
          A.el('div', { class: 'hint', text: owner ? 'Proprietario' : 'Editor' })
        ]),
        A.el('button', { class: 'btn sm', text: 'Esci', onclick: function () { A.closeModal(); R.sb.auth.signOut(); } })
      ]));

      if (R.workspaces.length > 1) {
        var sel = A.el('select', { class: 'sel' });
        R.workspaces.forEach(function (w) { sel.appendChild(A.el('option', { value: w.id, text: w.name, selected: w.id === R.ws })); });
        sel.addEventListener('change', function () {
          var w = R.workspaces.filter(function (x) { return x.id === sel.value; })[0];
          if (w) { A.closeModal(); openWorkspace(w).catch(function (e) { S.problem('Lo studio non risponde', italian(e), S.start); }); }
        });
        body.appendChild(A.el('div', { class: 'field' }, [A.el('label', { text: 'Studio' }), sel]));
      }

      var list = A.el('div', { class: 'team-list' });
      members.forEach(function (m) {
        var me = m.user_id === R.user.id;
        list.appendChild(A.el('div', { class: 'team-row' }, [
          A.el('span', { class: 'tm-email', text: (m.display_name || m.email || 'Utente') + (me ? ' (tu)' : '') }),
          A.el('span', { class: 'tm-role', text: m.role === 'owner' ? 'Proprietario' : 'Editor' }),
          owner && !me ? A.el('button', {
            class: 'btn ghost sm', text: 'Rimuovi',
            onclick: function () {
              A.confirm({
                title: 'Rimuovere ' + (m.email || 'questo collega') + '?',
                body: 'Non vedrà più lo studio. Il suo lavoro resta.', ok: 'Rimuovi', danger: true,
                run: async function () {
                  var r = await R.sb.from('workspace_members').delete().eq('workspace_id', R.ws).eq('user_id', m.user_id);
                  A.toast(r.error ? italian(r.error) : 'Rimosso');
                  S.openTeam();
                }
              });
            }
          }) : null
        ]));
      });
      invites.forEach(function (i) {
        list.appendChild(A.el('div', { class: 'team-row pending' }, [
          A.el('span', { class: 'tm-email', text: i.email }),
          A.el('span', { class: 'tm-role', text: 'Invitato' }),
          owner ? A.el('button', {
            class: 'btn ghost sm', text: 'Annulla invito',
            onclick: async function () {
              var r = await R.sb.from('workspace_invites').delete().eq('workspace_id', R.ws).eq('email', i.email);
              if (r.error) A.toast(italian(r.error));
              paint();
            }
          }) : null
        ]));
      });
      body.appendChild(A.el('div', { class: 'field' }, [A.el('label', { text: 'Persone' }), list]));

      if (owner) {
        var email = A.el('input', { class: 'inp', type: 'email', placeholder: 'collega@ideology.it' });
        var role = A.el('select', { class: 'sel', style: 'max-width:140px;' }, [
          A.el('option', { value: 'editor', text: 'Editor' }),
          A.el('option', { value: 'owner', text: 'Proprietario' })
        ]);
        var add = A.el('button', {
          class: 'btn primary', type: 'button', text: 'Invita',
          onclick: async function () {
            var addr = email.value.trim().toLowerCase();
            if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(addr)) { A.toast('Email non valida'); return; }
            add.disabled = true;
            var r = await R.sb.from('workspace_invites').insert({ workspace_id: R.ws, email: addr, role: role.value });
            add.disabled = false;
            if (r.error) { A.toast(r.error.code === '23505' ? 'Già invitato' : italian(r.error)); return; }
            A.toast('Invito inviato: lo vedrà al prossimo accesso');
            paint();
          }
        });
        body.appendChild(A.el('div', { class: 'field' }, [
          A.el('label', { text: 'Invita un collega' }),
          A.el('div', { style: 'display:flex;gap:7px;flex-wrap:wrap;' }, [email, role, add]),
          A.el('div', { class: 'hint', text: 'Al prossimo accesso con questa email il collega vede l\'invito e sceglie se accettare. ' +
            'L\'accesso si crea in Supabase → Authentication → Add user (spunta "Auto Confirm User").' })
        ]));
      }
    }
    paint();
  };
})(window.IDE);
</script>
<script>
/* src/js/20-app.js */
/* ============================================================
   Ideology — shell
   Left rail for the three areas. The context bar (client,
   account, month) belongs to Contenuti only; Home and Clienti
   draw their own headers.
   ============================================================ */

(function (A) {
  'use strict';

  var TABS = [
    { key: 'feed',       label: 'Feed' },
    { key: 'stories',    label: 'Stories' },
    { key: 'ugc',        label: 'UGC' },
    { key: 'calendario', label: 'Calendario' },
    { key: 'anteprima',  label: 'Anteprima' }
  ];

  var SECTIONS = [
    { key: 'home',      label: 'Home',      icon: 'grid' },
    { key: 'clienti',   label: 'Clienti',   icon: 'users' },
    { key: 'contenuti', label: 'Contenuti', icon: 'image' }
  ];

  /* ── Left rail ────────────────────────────────────────── */

  function pendingAcrossStudio() {
    var ids = {};
    A.S.clients.forEach(function (c) {
      if (c.status === 'chiuso') return;
      (c.accounts || []).forEach(function (a) { ids[a.id] = 1; });
    });
    return A.S.posts.filter(function (p) {
      return p.month === A.ui.month && ids[p.accountId] &&
        (p.status === 'in_revisione' || p.status === 'da_approvare');
    }).length;
  }

  function railItem(cfg) {
    var btn = A.el('button', {
      type: 'button', class: 'rail-item', title: cfg.title || cfg.label,
      'aria-current': cfg.current ? 'page' : null,
      onclick: cfg.onclick
    });
    var i = A.el('span', { class: 'ic', style: 'display:inline-flex;' });
    i.innerHTML = A.icon(cfg.icon, 16);
    btn.appendChild(i);
    btn.appendChild(A.el('span', { class: 'rtxt', text: cfg.label }));
    if (cfg.badge) btn.appendChild(A.el('span', { class: 'n', text: String(cfg.badge) }));
    return btn;
  }

  function rail() {
    var r = A.el('nav', { class: 'rail', 'aria-label': 'Sezioni' });

    r.appendChild(A.el('div', { class: 'rail-brand' }, [
      A.el('span', { class: 'mark', text: 'I' }),
      A.el('span', {}, [
        A.el('div', { class: 'nm', text: 'Ideology' }),
        A.el('div', { class: 'sub', text: 'ideology.it' })
      ])
    ]));

    var pending = pendingAcrossStudio();
    SECTIONS.forEach(function (s) {
      r.appendChild(railItem({
        label: s.label, icon: s.icon,
        current: A.ui.section === s.key,
        badge: (s.key === 'home' || s.key === 'contenuti') ? pending : 0,
        onclick: function () {
          A.ui.section = s.key;
          if (s.key === 'clienti') A.ui.clientDetailId = null;
          A.render();
        }
      }));
    });

    var foot = A.el('div', { class: 'rail-foot' });
    foot.appendChild(railItem({ label: 'Backup', icon: 'down', title: 'Dati e backup', onclick: dataMenu }));

    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    foot.appendChild(railItem({
      label: dark ? 'Chiaro' : 'Scuro', icon: dark ? 'sun' : 'moon', title: 'Tema chiaro o scuro',
      onclick: function () { toggleTheme(); }
    }));

    if (A.remote && A.remote.on) {
      foot.appendChild(railItem({ label: 'Team', icon: 'users', title: 'Studio, colleghi e accesso', onclick: function () { A.session.openTeam(); } }));
    }

    /* Autosave: no Salva button, just the state of the last save. */
    var saved = A.el('button', {
      class: 'saved', id: 'save-state', type: 'button', style: 'padding:7px 10px;',
      onclick: function () { if (A.ui.saveState === 'error' || A.ui.saveState === 'offline') A.saveNow(); }
    });
    foot.appendChild(saved);
    paintSaveState(saved);

    r.appendChild(foot);
    return r;
  }

  var SAVE_LABELS = {
    saved:    ['Salvato', 'Tutto salvato'],
    pending:  ['Modifiche…', 'Salvataggio tra un attimo'],
    saving:   ['Salvataggio…', 'Salvataggio in corso'],
    offline:  ['Offline', 'Connessione assente: riprovo da solo. Clic per riprovare ora'],
    conflict: ['Da decidere', 'Un collega ha cambiato la stessa cosa: scegli in basso quale tenere'],
    error:    ['Non salvato', 'Qualcosa non è stato salvato. Clic per riprovare']
  };

  function paintSaveState(node) {
    var st = A.ui.saveState || 'saved';
    var l = SAVE_LABELS[st] || SAVE_LABELS.saved;
    node.setAttribute('data-s', st);
    node.title = l[1];
    A.clear(node);
    node.appendChild(A.el('span', { class: 'pip' }));
    node.appendChild(A.el('span', { class: 'rtxt', text: l[0] }));
  }

  /* Called by setSaveState: repaints the indicator alone, so typing
     never triggers a whole-page render. */
  A.renderSaveState = function () {
    var n = document.getElementById('save-state');
    if (n) paintSaveState(n);
  };

  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur === 'dark';
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('ideology.theme', next); } catch (e) {}
    A.render();
  }

  /* ── Context bar (Contenuti only) ─────────────────────── */

  function contextBar() {
    var bar = A.el('div', { class: 'bar' });
    var client = A.curClient();
    var acc = A.curAccount();

    {
      var cw = A.el('span', { class: 'ctx-wrap' });
      var cs = A.el('select', { class: 'ctx', 'aria-label': 'Cliente' });
      A.S.clients.forEach(function (c) {
        cs.appendChild(A.el('option', { value: c.id, text: c.name, selected: A.ui.clientId === c.id }));
      });
      cs.addEventListener('change', function () { selectClient(cs.value); });
      cw.appendChild(cs);
      bar.appendChild(cw);
    }

    if (client && client.accounts.length > 1) {
      var aw = A.el('span', { class: 'ctx-wrap' });
      var as = A.el('select', { class: 'ctx', 'aria-label': 'Account' });
      client.accounts.forEach(function (a) {
        as.appendChild(A.el('option', {
          value: a.id, text: a.platform + ' · ' + a.handle, selected: A.ui.accountId === a.id
        }));
      });
      as.addEventListener('change', function () {
        A.ui.accountId = as.value;
        A.ui.selectedPostId = null; A.ui.selectedStoryId = null; A.ui.selectedSlotId = null;
        A.render();
      });
      aw.appendChild(as);
      bar.appendChild(aw);
    } else if (acc) {
      bar.appendChild(A.el('span', { class: 'ctx', style: 'font-weight:600;', text: acc.platform + ' · ' + acc.handle }));
    }

    bar.appendChild(A.el('span', { class: 'bar-sep' }));
    bar.appendChild(A.el('div', { class: 'monthnav' }, [
      A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Mese precedente', html: A.icon('left', 14), onclick: function () { A.ui.month = A.shiftMonth(A.ui.month, -1); A.render(); } }),
      A.el('span', { class: 'm', text: A.monthLabel(A.ui.month) }),
      A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Mese successivo', html: A.icon('right', 14), onclick: function () { A.ui.month = A.shiftMonth(A.ui.month, 1); A.render(); } })
    ]));
    if (A.ui.month !== A.thisMonth()) {
      bar.appendChild(A.el('button', { class: 'btn ghost sm hide-sm', text: 'Oggi', onclick: function () { A.ui.month = A.thisMonth(); A.render(); } }));
    }

    bar.appendChild(A.el('div', { class: 'bar-space' }));

    if (client) {
      bar.appendChild(A.el('button', {
        class: 'btn ghost sm hide-sm', html: A.icon('pencil', 12) + 'Scheda cliente',
        onclick: function () { A.goClient(client.id); }
      }));
    }
    return bar;
  }

  function selectClient(id) {
    A.ui.clientId = id;
    var c = A.get(id);
    A.ui.accountId = c && c.accounts[0] ? c.accounts[0].id : null;
    A.ui.selectedPostId = null;
    A.ui.selectedStoryId = null;
    A.ui.selectedSlotId = null;
    A.render();
  }

  /* ── Data menu ────────────────────────────────────────── */

  function dataMenu() {
    var fileInput = A.el('input', { type: 'file', accept: 'application/json', style: 'display:none' });
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { A.importAll(fr.result); A.closeModal(); A.toast('Backup importato'); }
        catch (e) { A.toast('File non valido: ' + e.message); }
      };
      fr.readAsText(f);
    });

    var counts = A.serialize().counts;
    var shared = !!(A.remote && A.remote.on);
    var lines = [
      ['Clienti', counts.clients],
      ['Contenuti feed', counts.posts],
      ['Stories e storyboard', counts.stories],
      ['Slot UGC', counts.ugcSlots],
      ['Creator', counts.creators]
    ];
    var table = A.el('div', { style: 'display:flex;flex-direction:column;gap:5px;' });
    lines.forEach(function (l) {
      table.appendChild(A.el('div', {
        style: 'display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);' +
               'padding:5px 0;border-bottom:1px solid var(--rule);'
      }, [A.el('span', { text: l[0] }), A.el('b', { text: String(l[1]) })]));
    });

    A.modal({
      title: 'Dati e backup',
      body: [
        A.el('p', {
          style: 'margin:0;font-size:12.5px;line-height:1.55;color:var(--ink-2);',
          text: shared
            ? 'Il lavoro è salvato nel database dello studio e lo vedono tutti i colleghi. Il backup è una copia in un file, da tenere da parte.'
            : 'Tutto il lavoro resta in questo browser. Esporta un backup prima di cambiare macchina, o per passare il piano a un collega.'
        }),
        table,
        A.el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap;' }, [
          A.el('button', { class: 'btn', html: A.icon('down', 13) + 'Esporta backup', onclick: A.exportAll }),
          shared ? null : A.el('button', { class: 'btn', html: A.icon('up', 13) + 'Importa backup', onclick: function () { fileInput.click(); } }),
          fileInput
        ])
      ],
      actions: shared ? [{ label: 'Chiudi', kind: 'primary' }] : [
        {
          label: 'Ricarica dati demo', kind: 'danger', keepOpen: true, run: function () {
            A.confirm({
              title: 'Ricaricare i dati demo?',
              body: 'Il lavoro salvato in questo browser viene sostituito dallo studio di esempio. Esporta prima un backup se ti serve.',
              ok: 'Ricarica', danger: true,
              run: function () { A.resetAll(); A.toast('Dati demo ricaricati'); }
            });
            return false;
          }
        },
        { label: 'Chiudi', kind: 'primary' }
      ]
    });
  }

  /* ── Tabs ─────────────────────────────────────────────── */

  function tabBar() {
    var bar = A.el('div', { class: 'tabs', role: 'tablist' });
    var posts = A.curPosts();
    var counts = {
      feed: posts.length,
      stories: A.curStories().length,
      ugc: A.curUgc().length,
      calendario: 0,
      anteprima: posts.filter(function (p) { return p.status === 'da_approvare' || p.status === 'in_revisione'; }).length
    };
    TABS.forEach(function (t) {
      var btn = A.el('button', {
        class: 'tab', role: 'tab', 'aria-selected': A.ui.tab === t.key ? 'true' : 'false',
        onclick: function () { A.ui.tab = t.key; A.render(); }
      }, [A.el('span', { text: t.label })]);
      if (counts[t.key]) btn.appendChild(A.el('span', { class: 'count', text: String(counts[t.key]) }));
      bar.appendChild(btn);
    });
    return bar;
  }

  /* ── Render ───────────────────────────────────────────── */

  A.render = function () {
    var root = A.$('#root');
    if (!root) return;

    if (!A.get(A.ui.clientId)) {
      var c0 = A.S.clients[0];
      A.ui.clientId = c0 ? c0.id : null;
      A.ui.accountId = c0 && c0.accounts[0] ? c0.accounts[0].id : null;
    }
    var client = A.curClient();
    if (client && !A.accountCtx(A.ui.accountId)) {
      A.ui.accountId = client.accounts[0] ? client.accounts[0].id : null;
    }

    var old = A.$('.canvas') || A.$('.preview-scroll');
    var scrollTop = old ? old.scrollTop : 0;

    A.clear(root);
    root.appendChild(rail());

    var main = A.el('div', { class: 'main' });

    if (A.ui.section === 'contenuti') {
      main.appendChild(contextBar());
      main.appendChild(tabBar());
      var pages = A.el('div', { class: 'pages' });
      var page = A.el('div', { class: 'page on' });
      (A.views[A.ui.tab] || A.views.feed)(page);
      pages.appendChild(page);
      main.appendChild(pages);
    } else {
      (A.views[A.ui.section] || A.views.home)(main);
    }

    root.appendChild(main);

    var fresh = A.$('.canvas') || A.$('.preview-scroll');
    if (fresh && scrollTop) fresh.scrollTop = scrollTop;
  };

  /* ── Boot ─────────────────────────────────────────────── */

  /* A client link must never open the studio. If one arrives here —
     an old link, or a host that served this page for a path it did
     not recognise — the studio does not render at all. It says where
     the link was meant to go and stops, because the alternative is
     handing a client the whole tool. */
  function clientLinkArrived() {
    var m = /[?&](?:c|cliente)=([^&]+)/.exec(location.search) || /[#&]c=([^&]+)/.exec(location.hash);
    if (!m) return false;

    var target = new URL('cliente.html#c=' + m[1], document.baseURI).href;
    var root = A.$('#root');
    A.clear(root);
    root.appendChild(A.el('div', { class: 'gate' }, [
      A.el('div', { class: 'gate-box' }, [
        A.el('span', { class: 'gate-mark', text: 'I' }),
        A.el('h1', { text: 'Questo è un link cliente' }),
        A.el('p', { text: 'L\'anteprima cliente è una pagina a parte. Questo indirizzo apre lo studio, quindi non prosegue da solo.' }),
        A.el('a', { class: 'btn primary', href: target, text: 'Apri l\'anteprima cliente' }),
        A.el('code', { class: 'gate-url', text: target })
      ])
    ]));
    return true;
  }

  A.boot = function () {
    try {
      var savedTheme = localStorage.getItem('ideology.theme');
      if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}

    if (clientLinkArrived()) return;

    if (A.remote && A.remote.misconfigured) {
      A.session.problem('Configurazione da correggere', A.remote.misconfigured);
      return;
    }
    if (A.remote && A.remote.on) { A.session.start(); return; }

    if (!A.load()) { A.seed(); A.save({ quiet: true }); }
    A.index();
    A.finishBoot();
  };

  /* Common to both modes, once the data is in memory. */
  A.finishBoot = function () {
    var c = A.get(A.ui.clientId) ? null : A.S.clients[0];
    if (c) { A.ui.clientId = c.id; A.ui.accountId = c.accounts[0] ? c.accounts[0].id : null; }
    A.ui.section = 'home';
    A.setSaveState('saved');
    A.render();
  };

  /* Leaving the page. Alone, the browser's storage is synchronous, so the
     last keystrokes are written on the spot. Shared, the save is a
     request that may not finish in time — so the browser asks first. */
  window.addEventListener('beforeunload', function (e) {
    if (!A.dirty) return;
    var shared = A.remote && A.remote.on;
    A.saveNow();
    if (!shared) return;
    e.preventDefault();
    e.returnValue = '';
    return '';
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', A.boot);
  } else {
    A.boot();
  }
})(window.IDE);
</script>
</body>
</html>
