     same client. There is still only one record: the second account shows
     the same content, so a caption fixed once is fixed everywhere. */
  A.isOn = function (p, accountId) {
    return p.accountId === accountId || (p.alsoOn || []).indexOf(accountId) >= 0;
  };
  A.postsIn = function (accountId, month) {
    return S.posts.filter(function (p) { return A.isOn(p, accountId) && p.month === month; }).sort(byMoment);
  };
  A.storiesIn = function (accountId, month) {
    return S.stories.filter(function (s) { return s.accountId === accountId && s.month === month; }).sort(bySort);
  };
  A.highlightsIn = function (accountId) {
    return S.highlights.filter(function (h) { return h.accountId === accountId; });
  };
  A.ugcIn = function (accountId, month) {
    return S.ugcSlots.filter(function (u) { return u.accountId === accountId && A.monthOfDay(u.date) === month; })
      .sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); });
  };
  A.ugcInYear = function (accountId, year) {
    return S.ugcSlots.filter(function (u) { return u.accountId === accountId && (u.date || '').slice(0, 4) === String(year); });
  };
  A.creatorsOf = function (clientId) {
    return S.creators.filter(function (c) { return c.clientId === clientId; });
  };
  A.categoriesOf = function (clientId) {
    return S.categories.filter(function (c) { return c.clientId === clientId; });
  };
  /* The other accounts of the same client: what a post can be pushed to
     without re-uploading anything. */
  A.siblingAccounts = function (accountId) {
    var ctx = A.accountCtx(accountId);
    if (!ctx) return [];
    return (ctx.client.accounts || []).filter(function (a) { return a.id !== accountId; });
  };

  A.monthsWithContent = function (accountId) {
    var set = {};
    S.posts.forEach(function (p) { if (p.accountId === accountId) set[p.month] = 1; });
    return Object.keys(set).sort();
  };

  /* Current context shorthands */
  A.curClient = function () { return A.get(A.ui.clientId); };
  A.curAccount = function () { var c = A.accountCtx(A.ui.accountId); return c ? c.account : null; };
  A.curPosts = function () { return A.postsIn(A.ui.accountId, A.ui.month); };
  A.curStories = function () { return A.storiesIn(A.ui.accountId, A.ui.month); };
  A.curUgc = function () { return A.ugcIn(A.ui.accountId, A.ui.month); };

  /* Filters are lists: wanting to see "da approvare" and "in revisione"
     together is the normal question, not an edge case. An empty list means
     no constraint on that axis. */
  A.emptyFilters = function () { return { status: [], categoryId: [], paid: false, partner: false }; };

  A.filterCount = function () {
    var f = A.ui.filters;
    return (f.status || []).length + (f.categoryId || []).length + (f.paid ? 1 : 0) + (f.partner ? 1 : 0);
  };

  A.toggleFilter = function (axis, value) {
    var list = A.ui.filters[axis] || (A.ui.filters[axis] = []);
    var i = list.indexOf(value);
    if (i >= 0) list.splice(i, 1); else list.push(value);
  };

  A.visiblePosts = function () {
    var f = A.ui.filters;
    return A.curPosts().filter(function (p) {
      if ((f.status || []).length && f.status.indexOf(p.status) < 0) return false;
      if ((f.categoryId || []).length && f.categoryId.indexOf(p.categoryId) < 0) return false;
      if (f.paid && !p.paid) return false;
      if (f.partner && !(p.partner || '').trim()) return false;
      return true;
    });
  };

  /* ── Mutations: posts ─────────────────────────────────── */

  function nextOrder(list) {
    return list.reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0) + 10;
  }

  A.addPost = function (kind, extra) {
    if (!A.ui.accountId) { A.toast('Scegli prima un account'); return null; }
    var list = A.curPosts();
    var p = Object.assign({
      id: A.uid('post'),
      accountId: A.ui.accountId,
      month: A.ui.month,
      order: nextOrder(list),
      kind: kind || 'foto',
      mediaUrl: '', coverUrl: '', slides: [],
      date: '', time: '', showDate: true, caption: '',
      categoryId: '', paid: false, partner: '',
      videoName: '', alsoOn: [], inStories: false, storyIds: [],
      editorial: { eyebrow: '', title: '', sub: '' },
      status: 'bozza', revisions: 0,
      internalNote: '', clientNote: '', clientNoteAt: '',
      history: [],
      createdAt: new Date().toISOString()
    }, extra || {});
    S.posts.push(p);
    A.ui.selectedPostId = p.id;
    A.commit();
    return p;
  };

  A.updatePost = function (id, patch, opts) {
    var p = A.get(id);
    if (!p) return;
    Object.assign(p, patch);
    if (p.inStories) A.syncMirror(id);
    A.commit(opts);
  };

  A.deletePost = function (id) {
    var i = S.posts.findIndex(function (p) { return p.id === id; });
    if (i < 0) return;
    var snap = S.posts[i];
    var mirror = A.mirrorOf(id);
    if (mirror) S.stories = S.stories.filter(function (x) { return x.id !== mirror.id; });
    S.posts.splice(i, 1);
    if (A.ui.selectedPostId === id) A.ui.selectedPostId = null;
    A.commit();
    A.toast('Post eliminato', {
      undo: function () { S.posts.push(snap); if (mirror) S.stories.push(mirror); A.commit(); }
    });
  };

  A.duplicatePost = function (id) {
    var p = A.get(id);
    if (!p) return;
    var copy = JSON.parse(JSON.stringify(p));
    copy.id = A.uid('post');
    copy.order = (p.order || 0) + 5;
    copy.status = 'bozza';
    copy.revisions = 0;
    copy.history = [];
    copy.clientNote = '';
    copy.inStories = false;
    copy.storyIds = [];
    copy.slides = (copy.slides || []).map(function (s) { return Object.assign({}, s, { id: A.uid('sl') }); });
    S.posts.push(copy);
    A.ui.selectedPostId = copy.id;
    A.commit();
    return copy;
  };

  /* "Pubblica anche nelle Stories" keeps one mirrored story per post. The
     mirror carries fromPostId, so it is always recognisable, always exactly
     one, and it follows the post's media and date instead of drifting into
     a stale duplicate. */
  A.mirrorOf = function (postId) {
    var hit = null;
    S.stories.forEach(function (st) { if (st.fromPostId === postId) hit = st; });
    return hit;
  };

  function mirrorTitle(p) {
    var line = (p.caption || '').split('\n')[0].trim();
    return line ? line.slice(0, 48) : (p.kind === 'reel' ? 'Reel dal feed' : 'Dal feed');
  }

  A.syncMirror = function (postId) {
    var p = A.get(postId);
    if (!p) return;
    var st = A.mirrorOf(postId);
    if (p.inStories) {
      if (!st) {
        st = {
          id: A.uid('st'), accountId: p.accountId, month: p.month,
          order: (A.storiesIn(p.accountId, p.month).reduce(function (m, r) { return Math.max(m, r.order || 0); }, 0)) + 10,
          kind: 'story', title: mirrorTitle(p), mediaUrl: '', frames: [],
          date: p.date, note: '', isUgc: false, status: 'bozza', fromPostId: p.id
        };
        S.stories.push(st);
        if ((p.storyIds || []).indexOf(st.id) < 0) p.storyIds = (p.storyIds || []).concat([st.id]);
      }
      st.accountId = p.accountId;
      st.month = p.month;
      st.date = p.date;
      st.title = mirrorTitle(p);
      st.mediaUrl = p.coverUrl || p.mediaUrl || (p.slides && p.slides[0] ? p.slides[0].url : '');
    } else if (st) {
      S.stories = S.stories.filter(function (x) { return x.id !== st.id; });
      p.storyIds = (p.storyIds || []).filter(function (id) { return id !== st.id; });
    }
  };

  A.setInStories = function (postId, on) {
    var p = A.get(postId);
    if (!p) return;
    p.inStories = !!on;
    A.syncMirror(postId);
    A.commit();
  };

  /* The single place a status ever changes. Every transition is written to
     the post's own history with who did it, so "chi ha approvato cosa" is
     answerable months later. */
  A.setStatus = function (id, status, actor, note) {
    var p = A.get(id);
    if (!p || p.status === status) return;
    var from = p.status;
    p.status = status;
    if (status === 'in_revisione') p.revisions = (p.revisions || 0) + 1;
    if (!p.history) p.history = [];
    p.history.push({
      id: A.uuid(),
      at: new Date().toISOString(),
      from: from, to: status,
      by: actor || 'studio',
      note: note || ''
    });
    if (actor === 'cliente' && note) { p.clientNote = note; p.clientNoteAt = new Date().toISOString(); }
    A.commit();
  };

  /* ── Mutations: stories ───────────────────────────────── */

  A.addStory = function (kind) {
    if (!A.ui.accountId) { A.toast('Scegli prima un account'); return null; }
    var s = {
      id: A.uid('st'),
      accountId: A.ui.accountId, month: A.ui.month,
      order: nextOrder(A.curStories()),
      kind: kind || 'story',
      title: kind === 'storyboard' ? 'Nuovo storyboard' : '',
      mediaUrl: '', frames: [], date: '', note: '', isUgc: false, status: 'bozza'
    };
    if (kind === 'storyboard') {
      s.frames = [
        { id: A.uid('fr'), url: '', note: 'Hook — primi 2 secondi' },
        { id: A.uid('fr'), url: '', note: 'Contenuto' },
        { id: A.uid('fr'), url: '', note: 'Call to action' }
      ];
    }
    S.stories.push(s);
    A.ui.selectedStoryId = s.id;
    A.commit();
    return s;
  };

  A.deleteStory = function (id) {
    var i = S.stories.findIndex(function (s) { return s.id === id; });
    if (i < 0) return;
    var snap = S.stories[i];
    S.stories.splice(i, 1);
    /* Unlink from every post that referenced it. Because the link is an id,
       this is a clean removal — with index links the remaining references
       would silently shift onto the wrong story. */
    S.posts.forEach(function (p) {
      if (p.storyIds && p.storyIds.indexOf(id) >= 0) {
        p.storyIds = p.storyIds.filter(function (x) { return x !== id; });
      }
    });
    S.highlights.forEach(function (h) {
      if (h.storyIds) h.storyIds = h.storyIds.filter(function (x) { return x !== id; });
    });
    if (snap.fromPostId) {
      var src = A.get(snap.fromPostId);
      if (src) src.inStories = false;
    }
    if (A.ui.selectedStoryId === id) A.ui.selectedStoryId = null;
    A.commit();
    A.toast('Story eliminata', {
      undo: function () {
        S.stories.push(snap);
        if (snap.fromPostId) { var s2 = A.get(snap.fromPostId); if (s2) s2.inStories = true; }
        A.commit();
      }
    });
  };

  /* ── Mutations: UGC ───────────────────────────────────── */

  A.addUgcSlot = function (date, extra) {
    if (!A.ui.accountId) { A.toast('Scegli prima un account'); return null; }
    var slot = Object.assign({
      id: A.uid('ugc'),
      accountId: A.ui.accountId,
      date: date || A.todayKey(),
      mode: 'autonoma', status: 'idea',
      brief: '', creatorId: '', note: ''
    }, extra || {});
    S.ugcSlots.push(slot);
    A.commit();
    return slot;
  };

  A.deleteUgcSlot = function (id) {
    var i = S.ugcSlots.findIndex(function (u) { return u.id === id; });
    if (i < 0) return;
    var snap = S.ugcSlots[i];
    S.ugcSlots.splice(i, 1);
    A.commit();
    A.toast('Slot eliminato', { undo: function () { S.ugcSlots.push(snap); A.commit(); } });
  };

  A.generateUgcMonth = function () {
    var days = S.prefs.ugcDays || [];
    if (!days.length) { A.toast('Scegli almeno un giorno della settimana'); return; }
    var mk = A.ui.month, p = mk.split('-');
    var y = parseInt(p[0], 10), m = parseInt(p[1], 10);
    var last = new Date(y, m, 0).getDate();
    var taken = {};
    A.curUgc().forEach(function (u) { taken[u.date] = 1; });
    var made = 0;
    for (var d = 1; d <= last; d++) {
      var dt = new Date(y, m - 1, d);
      var dow = (dt.getDay() + 6) % 7;            // 0 = Monday
      var iso = mk + '-' + A.pad(d);
      if (days.indexOf(dow) >= 0 && !taken[iso]) {
        S.ugcSlots.push({
          id: A.uid('ugc'), accountId: A.ui.accountId, date: iso,
          mode: 'autonoma', status: 'idea', brief: '', creatorId: '', note: ''
        });
        made++;
      }
    }
    A.commit();
    A.toast(made ? made + ' slot aggiunti' : 'Nessuna data nuova da aggiungere');
  };

  A.clearEmptyUgc = function () {
    var before = S.ugcSlots.length;
    var removed = [];
    S.ugcSlots = S.ugcSlots.filter(function (u) {
      var empty = u.accountId === A.ui.accountId &&
        A.monthOfDay(u.date) === A.ui.month &&
        !u.brief.trim() && !u.creatorId && !u.note.trim() && u.status === 'idea';
      if (empty) removed.push(u);
      return !empty;
    });
    A.commit();
    A.toast((before - S.ugcSlots.length) + ' slot vuoti rimossi', {
      undo: function () { removed.forEach(function (u) { S.ugcSlots.push(u); }); A.commit(); }
    });
  };

  A.addCreator = function (clientId, data) {
    var c = Object.assign({
      id: A.uid('cr'), clientId: clientId,
      name: '', handle: '', followers: 0, fee: 0, status: 'contattato', note: ''
    }, data || {});
    S.creators.push(c);
    A.commit();
    return c;
  };

  A.deleteCreator = function (id) {
    S.creators = S.creators.filter(function (c) { return c.id !== id; });
    S.ugcSlots.forEach(function (u) { if (u.creatorId === id) u.creatorId = ''; });
    A.commit();
  };

  /* ── Mutations: clients, accounts, taxonomy ───────────
     Deleting anything that owns content removes that content
     explicitly and clears every reference to it. Nothing is
     left pointing at a record that no longer exists.
  ──────────────────────────────────────────────────────── */

  /* A file that lives with the studio (uploaded) rather than a link to
     somewhere else: a storage path, or inline data in browser-only mode. */
  A.isStoredMedia = function (ref) {
    return typeof ref === 'string' && ref !== '' && (/^data:/.test(ref) || !/^[a-z][a-z0-9+.-]*:/i.test(ref));
  };

  A.slugify = function (name) {
    return String(name || '').toLowerCase()
      .replace(/[àáâãä]/g, 'a').replace(/[èéêë]/g, 'e').replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o').replace(/[ùúûü]/g, 'u').replace(/[ç]/g, 'c')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  };

  /* The client link points at a different page. Building it in one
     place keeps the studio from ever handing out a URL that lands on
     the studio itself. */
  A.clientUrl = function (cl) {
    /* Resolved by the browser against this page, exactly as an
       <a href="cliente.html"> would be — string surgery on the path
       guesses wrong as soon as the host serves the page from a URL
       that does not end in a file name. */
    /* The token goes in the fragment: never sent to a server, so it
       never lands in an access log or a Referer header. */
    return new URL('cliente.html#c=' + encodeURIComponent(cl.shareToken), document.baseURI).href;
  };

  /* 192 bits from the browser's CSPRNG: a share link is a bearer
     secret, and the database refuses anything shorter than 32 chars. */
  A.newToken = function () {
    var b = new Uint8Array(24);
    window.crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  };

  A.MARK_COLORS = ['#9A5B3C', '#4F5E4A', '#3F4F6B', '#6E4C57', '#7A6420', '#3D5B58'];
  A.markColor = function (id) {
    var h = 0, str = String(id);
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return A.MARK_COLORS[h % A.MARK_COLORS.length];
  };

  A.addClient = function (name, platform, handle) {
    var cl = {
      id: A.uid('cl'),
      name: name || 'Nuovo cliente',
      slug: A.slugify(name || 'nuovo-cliente'),
      shareToken: A.newToken(),
      status: 'attivo',
      note: '',
      goals: { post: 12, reel: 4, stories: 20, ugc: 8 },
      palette: { bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C', alt: '#6E6256' },
      accounts: [{
        id: A.uid('ac'),
        handle: handle || '@' + A.slugify(name || 'account'),
        platform: platform || 'Instagram',
        ratio: '', bio: '', followers: 0, following: 0, avatarUrl: ''
      }]
    };
    S.clients.push(cl);
    A.commit({ render: false });
    return cl;
  };

  A.updateClient = function (id, patch) {
    var cl = A.get(id);
    if (!cl) return;
    if (patch.name && patch.name !== cl.name && !cl.slugLocked) patch.slug = A.slugify(patch.name);
    Object.assign(cl, patch);
    A.commit();
  };

  /* Removing a client removes everything that belongs to it: its posts,
     stories, highlights, UGC slots, creators and categories. No post is
     left pointing at a category that went away with its client. */
  A.deleteClient = function (id) {
    var cl = A.get(id);
    if (!cl) return;
    var accIds = {};
    (cl.accounts || []).forEach(function (a) { accIds[a.id] = 1; });
    S.posts = S.posts.filter(function (p) { return !accIds[p.accountId]; });
    S.posts.forEach(function (p) {
      if (p.alsoOn) p.alsoOn = p.alsoOn.filter(function (id) { return !accIds[id]; });
    });
    S.stories = S.stories.filter(function (s2) { return !accIds[s2.accountId]; });
    S.highlights = S.highlights.filter(function (h) { return !accIds[h.accountId]; });
    S.ugcSlots = S.ugcSlots.filter(function (u) { return !accIds[u.accountId]; });
    S.creators = S.creators.filter(function (c) { return c.clientId !== id; });
    S.categories = S.categories.filter(function (c) { return c.clientId !== id; });
    S.clients = S.clients.filter(function (c) { return c.id !== id; });
    if (A.ui.clientId === id) { A.ui.clientId = null; A.ui.accountId = null; }
    if (A.ui.clientDetailId === id) A.ui.clientDetailId = null;
    A.commit();
  };

  A.addAccount = function (clientId, platform, handle) {
    var cl = A.get(clientId);
    if (!cl) return null;
    var acc = {
      id: A.uid('ac'),
      handle: handle || '@' + (cl.slug || A.slugify(cl.name)),
      platform: platform || 'Instagram',
      ratio: '', bio: '', followers: 0, following: 0, avatarUrl: ''
    };
    cl.accounts.push(acc);
    A.commit();
    return acc;
  };

  A.countAccountContent = function (accountId) {
    return {
      posts: S.posts.filter(function (p) { return p.accountId === accountId; }).length,
      stories: S.stories.filter(function (s2) { return s2.accountId === accountId; }).length,
      ugc: S.ugcSlots.filter(function (u) { return u.accountId === accountId; }).length
    };
  };

  A.deleteAccount = function (clientId, accountId) {
    var cl = A.get(clientId);
    if (!cl) return;
    cl.accounts = cl.accounts.filter(function (a) { return a.id !== accountId; });
    S.posts = S.posts.filter(function (p) { return p.accountId !== accountId; });
    S.posts.forEach(function (p) {
      if (p.alsoOn) p.alsoOn = p.alsoOn.filter(function (id) { return id !== accountId; });
    });
    S.stories = S.stories.filter(function (s2) { return s2.accountId !== accountId; });
    S.highlights = S.highlights.filter(function (h) { return h.accountId !== accountId; });
    S.ugcSlots = S.ugcSlots.filter(function (u) { return u.accountId !== accountId; });
    if (A.ui.accountId === accountId) A.ui.accountId = cl.accounts[0] ? cl.accounts[0].id : null;
    A.commit();
  };

  /* One classification list per client, defined by the client. Different
     studios and different clients cut their content differently, so the
     names are theirs; the product only guarantees there is exactly one
     axis, which is why it fits in a single corner of the card. */
  A.addCategory = function (clientId, name) {
    var used = A.categoriesOf(clientId).length;
    var c = {
      id: A.uid('cat'), clientId: clientId,
      name: name || 'Nuova categoria',
      color: A.MARK_COLORS[used % A.MARK_COLORS.length],
      description: ''
    };
    S.categories.push(c);
    A.commit();
    return c;
  };

  A.deleteCategory = function (id) {
    S.categories = S.categories.filter(function (r) { return r.id !== id; });
    S.posts.forEach(function (p) { if (p.categoryId === id) p.categoryId = ''; });
    A.ui.filters.categoryId = (A.ui.filters.categoryId || []).filter(function (x) { return x !== id; });
    A.commit();
  };

  A.usageOfCategory = function (id) {
    return S.posts.filter(function (p) { return p.categoryId === id; }).length;
  };

  /* Progress of one account against the client's monthly commitments. */
  A.progressOf = function (accountId, month, clientId) {
    var cl = A.get(clientId);
    var goals = (cl && cl.goals) || {};
    var posts = A.postsIn(accountId, month);
    var done = {
      post: posts.filter(function (p) { return p.kind !== 'reel'; }).length,
      reel: posts.filter(function (p) { return p.kind === 'reel'; }).length,
      stories: A.storiesIn(accountId, month).length,
      ugc: A.ugcIn(accountId, month).length
    };
    return A.GOALS.map(function (g) {
      return { key: g.key, label: g.label, done: done[g.key] || 0, goal: Number(goals[g.key]) || 0 };
    });
  };

  /* Everything that happened across the studio, newest first. */
  A.recentActivity = function (limit) {
    var out = [];
    S.posts.forEach(function (p) {
      (p.history || []).forEach(function (h) {
        out.push({ at: h.at, by: h.by, to: h.to, note: h.note, postId: p.id, accountId: p.accountId });
      });
    });
    out.sort(function (a, b) { return (b.at || '').localeCompare(a.at || ''); });
    return out.slice(0, limit || 8);
  };

  /* ── Export / import — full fidelity, no field whitelist ── */

  A.exportAll = function () {
    var payload = serialize();
    payload.exportedBy = 'Ideology Content';
    A.download('ideology-contenuti-' + A.todayKey() + '.json', JSON.stringify(payload, null, 2));
    A.toast('Backup esportato');
  };

  A.importAll = function (text) {
    var data = migrate(JSON.parse(text));
    if (A.remote && A.remote.on) throw new Error('Nello studio condiviso il ripristino da file va fatto da un proprietario, non da qui');
    assertShape(data);
    A.hydrate(data);
    var c = S.clients[0];
    A.ui.clientId = c ? c.id : null;
    A.ui.accountId = c && c.accounts[0] ? c.accounts[0].id : null;
    A.ui.selectedPostId = null;
    A.save({ quiet: true });
  };

  A.resetAll = function () {
    if (A.remote && A.remote.on) { A.toast('Non disponibile nello studio condiviso'); return; }
    try { localStorage.removeItem(KEY); } catch (e) {}
    A.seed();
    A.save({ quiet: true });
  };

  /* A dialog edits the live record so the grid behind it updates as you
     type, and keeps a snapshot so Annulla can put it back exactly. */
  A.snap = function (rec) { return JSON.stringify(rec); };
  A.restore = function (rec, snapshot) {
    if (!rec || !snapshot) return;
    var was = JSON.parse(snapshot);
    Object.keys(rec).forEach(function (k) { delete rec[k]; });
    Object.keys(was).forEach(function (k) { rec[k] = was[k]; });
  };
})(window.IDE);
</script>
<script>
/* src/js/03-seed.js */
/* ============================================================
   Ideology — demo data + offline imagery

   The tool never fetches an image from the network: media is
   either uploaded by the user (downscaled to a data URL) or,
   for the demo content, drawn as a deterministic SVG from the
   post's own id. So the grid reads as a real feed with nothing
   to load and nothing to break.
   ============================================================ */

(function (A) {
  'use strict';

  var PALETTES = [
    ['#C9B9A6', '#7E6B59', '#F2ECE4'],
    ['#A9B7A0', '#4F5E4A', '#EEF1E9'],
    ['#C2A8AE', '#6E4C57', '#F4EBED'],
    ['#A3B1C6', '#3F4F6B', '#EAEEF5'],
    ['#D6C06A', '#7A6420', '#F7F1DD'],
    ['#B8A6C9', '#55436B', '#F0EAF5'],
    ['#CDA18A', '#7A4A34', '#F6E8E0'],
    ['#9FB8B5', '#3D5B58', '#E7F0EF']
  ];

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h;
  }

  /* Deterministic abstract visual — same seed always gives the same image. */
  A.mockImage = function (seed, w, h) {
    w = w || 400; h = h || 500;
    var n = hash(String(seed));
    var pal = PALETTES[n % PALETTES.length];
    var variant = (n >> 5) % 6;
    var a = pal[0], b = pal[1], c = pal[2];
    var r1 = ((n >> 11) % 60) / 100 + .2;
    var r2 = ((n >> 17) % 50) / 100 + .25;
    var body = '';

    if (variant === 0) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + c + '"/>' +
        '<circle cx="' + (w * r1) + '" cy="' + (h * .42) + '" r="' + (w * .36) + '" fill="' + a + '"/>' +
        '<rect y="' + (h * .68) + '" width="' + w + '" height="' + (h * .32) + '" fill="' + b + '"/>';
    } else if (variant === 1) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + a + '"/>' +
        '<path d="M0 ' + (h * r1) + ' L' + w + ' ' + (h * (r1 - .22)) + ' L' + w + ' ' + (h * (r1 + .18)) + ' L0 ' + (h * (r1 + .4)) + 'Z" fill="' + b + '"/>' +
        '<path d="M0 ' + (h * .86) + ' L' + w + ' ' + (h * .74) + ' L' + w + ' ' + h + ' L0 ' + h + 'Z" fill="' + c + '"/>';
    } else if (variant === 2) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + c + '"/>' +
        '<path d="M' + (w * .22) + ' ' + h + ' L' + (w * .22) + ' ' + (h * .45) +
        ' A' + (w * .28) + ' ' + (w * .28) + ' 0 0 1 ' + (w * .78) + ' ' + (h * .45) + ' L' + (w * .78) + ' ' + h + 'Z" fill="' + b + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .58) + '" r="' + (w * .14) + '" fill="' + a + '"/>';
    } else if (variant === 3) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + b + '"/>' +
        '<rect x="' + (w * .1) + '" y="' + (h * .12) + '" width="' + (w * .8) + '" height="' + (h * .34) + '" rx="' + (w * .04) + '" fill="' + c + '"/>' +
        '<rect x="' + (w * .1) + '" y="' + (h * .52) + '" width="' + (w * .52) + '" height="' + (h * .3) + '" rx="' + (w * .04) + '" fill="' + a + '"/>';
    } else if (variant === 4) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + c + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .5) + '" r="' + (w * .46) + '" fill="none" stroke="' + a + '" stroke-width="' + (w * .09) + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .5) + '" r="' + (w * .27) + '" fill="none" stroke="' + b + '" stroke-width="' + (w * .07) + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .5) + '" r="' + (w * .09) + '" fill="' + b + '"/>';
    } else {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + a + '"/>' +
        '<ellipse cx="' + (w * r2) + '" cy="' + (h * .36) + '" rx="' + (w * .42) + '" ry="' + (h * .28) +
        '" fill="' + c + '" transform="rotate(-18 ' + (w * r2) + ' ' + (h * .36) + ')"/>' +
        '<ellipse cx="' + (w * .68) + '" cy="' + (h * .74) + '" rx="' + (w * .34) + '" ry="' + (h * .2) + '" fill="' + b + '"/>';
    }

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + body + '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };

  /* Uploads are downscaled in the browser. A planning tool fills up fast
     with full-resolution exports; 1100px wide is plenty for a grid cell
     and keeps the saved document small enough to survive. */
  A.readImage = function (file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('nessun file'));
      if (!/^image\//.test(file.type)) return reject(new Error('serve un file immagine'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('lettura non riuscita')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('immagine non valida')); };
        img.onload = function () {
          var max = 1100;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * scale);
          cv.height = Math.round(img.height * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          try { resolve(cv.toDataURL('image/jpeg', 0.78)); }
          catch (e) { resolve(fr.result); }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  };

  /* A video upload is handled differently from an image. A montaggio is
     far too big to live inside the saved document, so we always pull a
     poster frame out of it — that is what the grid needs — and keep the
     clip itself inline only when it is small enough to be harmless. */
  A.VIDEO_INLINE_MAX = 3.5 * 1024 * 1024;

  A.readVideo = function (file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('nessun file'));
      if (!/^video\//.test(file.type)) return reject(new Error('serve un file video'));

      var objUrl = URL.createObjectURL(file);
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.muted = true;
      v.playsInline = true;

      var done = false;
      function finish(poster) {
        if (done) return;
        done = true;
        URL.revokeObjectURL(objUrl);
        var out = { name: file.name, sizeBytes: file.size, poster: poster || '', dataUrl: '' };
        if (file.size <= A.VIDEO_INLINE_MAX) {
          var fr = new FileReader();
          fr.onload = function () { out.dataUrl = fr.result; resolve(out); };
          fr.onerror = function () { resolve(out); };
          fr.readAsDataURL(file);
        } else {
          resolve(out);
        }
      }

      v.addEventListener('error', function () { finish(''); });
      v.addEventListener('loadeddata', function () {
        try { v.currentTime = Math.min(0.6, (v.duration || 1) * 0.1); }
        catch (e) { grab(); }
      });
      v.addEventListener('seeked', grab);

      function grab() {
        try {
          var max = 900;
          var scale = Math.min(1, max / Math.max(v.videoWidth || max, v.videoHeight || max));
          var cv = document.createElement('canvas');
          cv.width = Math.round((v.videoWidth || 720) * scale);
          cv.height = Math.round((v.videoHeight || 1280) * scale);
          cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
          finish(cv.toDataURL('image/jpeg', 0.78));
        } catch (e) { finish(''); }
      }

      setTimeout(function () { finish(''); }, 8000);
      v.src = objUrl;
    });
  };

  A.humanSize = function (bytes) {
    var mb = (Number(bytes) || 0) / 1024 / 1024;
    return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.round((Number(bytes) || 0) / 1024) + ' KB';
  };

  /* ── Demo studio ──────────────────────────────────────── */

  A.seed = function () {
    var S = A.S;

    S.clients = []; S.posts = []; S.stories = []; S.highlights = [];

    S.prefs = { ugcDays: [1, 3, 5] };

    function client(name, slug, accounts) {

    var bott = client('Bottega Verdi', 'bottega-verdi', [

    ]);
    var bp1 = cat(bott, 'Piatti', '#7A4A34', 'Il menù, i singoli piatti');

    ['foto', 'foto', 'reel', 'foto', 'carosello'].forEach(function (k, i) {

    });

    bott.palette = { bg: '#1E2420', ink: '#F2EFE7', accent: '#C8A96E', alt: '#7E8C76' };
    bott.goals = { post: 8, reel: 2, stories: 12, ugc: 4 };

    var atel = client('Atelier Noto', 'atelier-noto', [

    ]);
    cat(atel, 'Collezioni', '#55436B', 'Pezzi e linee');
    cat(atel, 'Processo orafo', '#3D5B58', 'Banco, fusione, finitura');
    atel.palette = { bg: '#F4F2F6', ink: '#24202B', accent: '#55436B', alt: '#A89BB8' };

    A.ui.clientId = forn.id;

  /* seed-time helper that does not trigger a render */
  A.addCreatorSilent = function (clientId, data) {
    var c = Object.assign({
      id: A.uid('cr'), clientId: clientId, name: '', handle: '',
      followers: 0, fee: 0, status: 'contattato', note: ''
    }, data || {});
    A.S.creators.push(c);

<script>
/* src/js/04-grid.js */
/* ============================================================
   Ideology — the post renderer

   One function decides how a post looks. The feed, the studio
   preview and the client link all call it. There is deliberately
   no second implementation: in the tool this replaces, the same
   card was drawn three times in two files and the three copies
   had already drifted apart (five approval states in one, two
   in another; carousels playable in one, static in the next).
   ============================================================ */

(function (A) {
  'use strict';

  A.ratioFor = function (accountId) {
    var ctx = A.accountCtx(accountId);
    return A.formatOfAccount(ctx ? ctx.account : null).ratio;
  };

  function kindBadge(post) {
    if (post.kind === 'reel') return { icon: 'play', label: 'Reel' };
    if (post.kind === 'carosello') return { icon: 'layers', label: (post.slides || []).length + ' slide' };
    if (post.kind === 'editoriale') return { icon: 'type', label: 'Testo' };
    return { icon: 'image', label: 'Post' };
  }

  /* The visual inside a cell: uploaded media, a generated editorial card,
     or an explicit empty slot. Never a broken <img>. */
  A.mediaFill = function (post) {
    if (post.kind === 'editoriale') {
      var client = A.clientOfAccount(post.accountId);
      var pal = (client && client.palette) || { bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C' };
      var ed = post.editorial || {};
      var box = A.el('div', { class: 'edcard', style: 'background:' + pal.bg + ';color:' + pal.ink + ';' });
      if (ed.eyebrow) box.appendChild(A.el('div', { class: 'eye', text: ed.eyebrow, style: 'color:' + pal.accent }));
      box.appendChild(A.el('div', { class: 'tit', text: ed.title || 'Titolo della card' }));
      box.appendChild(A.el('div', { class: 'rule' }));
      box.appendChild(A.el('div', { class: 'sub', text: ed.sub || '' }));
      return box;
    }
    var url = post.coverUrl || post.mediaUrl ||
      (post.slides && post.slides[0] ? post.slides[0].url : '');
    /* coverUrl wins for every kind: a reel's thumbnail is what the grid,
       the preview and the post view all have to show. */
    if (url) {
      var wrap = A.el('div', { style: 'width:100%;height:100%;' });
      var img = A.el('img', { src: url, alt: '', loading: 'lazy' });
      img.addEventListener('error', function () {
        var host = '';
        try { host = new URL(url, location.href).hostname; } catch (e) { host = ''; }
        A.clear(wrap);
        wrap.appendChild(A.el('div', { class: 'ph' }, [
          (function () { var s = A.el('span'); s.innerHTML = A.icon('link', 18); return s; })(),
          A.el('span', { text: 'Immagine non raggiungibile' }),
          host ? A.el('span', { style: 'opacity:.65;', text: host }) : null
        ]));
      });
      wrap.appendChild(img);
      return wrap;
    }
    return A.el('div', { class: 'ph' }, [
      (function () { var s = A.el('span'); s.innerHTML = A.icon('image', 20); return s; })(),
      'Slot vuoto'
    ]);
  };

  /* A media cell with its overlays. `opts.chrome` picks what the viewer
     is allowed to see: the studio sees state, the client does not see
     internal state names, only an approval ribbon. */
  A.cellNode = function (post, opts) {
    opts = opts || {};
    var cell = A.el('div', {
      class: 'cell',
      style: '--ratio:' + (opts.ratio || A.ratioFor(post.accountId)) + ';',
      role: 'button', tabindex: '0',
      'aria-label': 'Apri contenuto'
    });
    cell.appendChild(A.mediaFill(post));

    /* Four corners, always the same four questions:
       top left  — is it paid or organic
       top right — what kind of content it is
       bottom l. — where it is in the approval flow
       bottom r. — which category it belongs to            */
    if (opts.corners !== false) {
      var nat = A.natureOf(post);
      cell.appendChild(A.el('span', {
        class: 'c-tl ' + nat.cls,
        title: nat.key === 'both' ? 'Contenuto a pagamento, in collaborazione con ' + post.partner : nat.label,
        text: nat.label
      }));

      var kb = kindBadge(post);
      cell.appendChild(A.el('span', {
        class: 'c-tr', html: A.icon(kb.icon, 9) + '<span>' + A.esc(kb.label) + '</span>'
      }));

      if (opts.showState) {
        var st = A.statusOf(post.status);
        cell.appendChild(A.el('button', {
          type: 'button', class: 'c-bl',
          html: '<span class="dot" style="background:' + st.c + '"></span>' + A.esc(st.short) +
                (post.revisions > 0 ? '<span class="rev' + (post.revisions >= 3 ? ' hot' : '') + '">R' + post.revisions + '</span>' : ''),
          title: post.revisions ? post.revisions + ' revisioni richieste · cambia stato' : 'Cambia stato',
          onclick: function (e) { e.stopPropagation(); if (opts.onState) opts.onState(post); }
        }));
      }

      var cat = A.get(post.categoryId);
      if (cat) {
        cell.appendChild(A.el('span', {
          class: 'c-br', title: cat.description || cat.name,
          html: '<span class="dot" style="background:' + cat.color + '"></span>' + A.esc(cat.name)
        }));
      }
    }
    if (opts.onOpen) {
      cell.addEventListener('click', function () { opts.onOpen(post); });
      cell.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opts.onOpen(post); }
      });
    }
    return cell;
  };

  /* The grid shows two lines of caption. Hovering reads the whole thing in
     place and moving away puts it back: no click, no modal, no state. */
  function captionNode(text) {
    var node = A.el('div', { class: 'card-caption', text: text });
    A.captionPeek({ trigger: node, clamp: node, text: text });
    return node;
  }

  /* Full card for the editing grid. */
  A.postCard = function (post, opts) {
    opts = opts || {};
    var client = A.clientOfAccount(post.accountId);
    var card = A.el('div', {
      class: 'card' + (opts.selected ? ' sel' : ''),
      dataset: { st: post.status, id: post.id }
    });

    card.appendChild(A.cellNode(post, {
      showDate: A.ui.show.date,
      showState: true,
      showRevisions: true,
      draggable: true,
      onOpen: opts.onOpen,
      onState: opts.onState
    }));

    var body = A.el('div', { class: 'card-body' });

    if (A.ui.show.date) {
      var when = post.date
        ? A.dayLabel(post.date) + (post.time ? ' · ' + post.time : '')
        : 'Senza data';
      body.appendChild(A.el('div', {
        class: 'card-when' + (post.date ? '' : ' none'),
        html: A.icon('cal', 11) + '<span>' + A.esc(when) + '</span>'
      }));
    }

    if (A.ui.show.caption && post.caption) {
      body.appendChild(captionNode(post.caption));
    }

    if (post.accountId !== A.ui.accountId) {
      var home = A.accountCtx(post.accountId);
      body.appendChild(A.el('div', {
        class: 'card-from',
        html: A.icon('layers', 11) + '<span>Pubblicato anche da ' + A.esc(home ? home.account.platform : 'un altro account') + '</span>'
      }));
    } else if ((post.alsoOn || []).length) {
      var names = post.alsoOn.map(function (id) {
        var c = A.accountCtx(id);
        return c ? c.account.platform : '';
      }).filter(Boolean);
      body.appendChild(A.el('div', {
        class: 'card-from',
        html: A.icon('layers', 11) + '<span>Anche su ' + A.esc(names.join(', ')) + '</span>'
      }));
    }

    if (post.clientNote) {
      body.appendChild(A.el('div', {
        class: 'pv-note', style: 'margin-top:2px;',
        html: '<b>' + A.esc(client ? client.name : 'Cliente') + '</b>' + A.esc(post.clientNote)
      }));
    }

    if (body.childNodes.length) card.appendChild(body);

    if (opts.onSelect) {
      card.addEventListener('click', function (e) {
        if (e.target.closest('.cell') || e.target.closest('button')) return;
        opts.onSelect(post);
      });
    }

    return card;
  };

  /* ── Post view ────────────────────────────────────────
     How the content reads when someone actually looks at it:
     the media on the left, everything written about it on the
     right. Same component wherever a post is opened.
  ──────────────────────────────────────────────────────── */

  var PV = { list: [], i: 0, slide: 0 };

  A.openPostView = function (list, startId) {
    PV.list = list.slice();
    PV.i = Math.max(0, PV.list.findIndex(function (p) { return p.id === startId; }));
    PV.slide = 0;
    var host = A.$('#lightbox');
    host.classList.add('on', 'as-post');
    drawPV();
  };

  A.closePostView = function () {
    var host = A.$('#lightbox');
    host.classList.remove('on', 'as-post');
    A.clear(host);
    PV.list = [];
  };

  function pvNav(d) {
    if (PV.list.length < 2) return;
    PV.i = (PV.i + d + PV.list.length) % PV.list.length;
    PV.slide = 0;
    drawPV();
  }
  function pvSlide(d) {
    var p = PV.list[PV.i];
    if (!p || !p.slides || p.slides.length < 2) return;
    PV.slide = (PV.slide + d + p.slides.length) % p.slides.length;
    drawPV();
  }

  function fakeActions() {
    var row = A.el('div', { class: 'pvw-actions', 'aria-hidden': 'true' });
    ['heart', 'bubble', 'send'].forEach(function (k) {
      var paths = {
        heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>',
        bubble: '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 21l2-4a8.4 8.4 0 0 1-1-4 8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8 7.4z"/>',
        send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>'
      };
      var sp = A.el('span');
      sp.innerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + paths[k] + '</svg>';
      row.appendChild(sp);
    });
    return row;
  }

  function drawPV() {
    var host = A.$('#lightbox');
    var p = PV.list[PV.i];
    A.clear(host);
    if (!p) return;

    var ctx = A.accountCtx(A.isOn(p, A.ui.accountId) ? A.ui.accountId : p.accountId) || A.accountCtx(p.accountId);
    var acc = ctx ? ctx.account : null;
    var client = ctx ? ctx.client : null;
    var fmt = A.formatOfAccount(acc);

    var shell = A.el('div', { class: 'pvw', role: 'dialog', 'aria-modal': 'true' });

    /* media */
    var media = A.el('div', { class: 'pvw-media' });
    var inner = A.el('div', { class: 'pvw-stage', style: '--ratio:' + fmt.ratio + ';' });
    var isCar = p.kind === 'carosello' && p.slides && p.slides.length > 1;
    if (isCar) {
      var sl = p.slides[PV.slide];
      if (sl && sl.url) inner.appendChild(A.el('img', { src: sl.url, alt: '' }));
      else inner.appendChild(A.el('div', { class: 'pvw-blank', text: 'Slide ' + (PV.slide + 1) + ' senza immagine' }));
    } else {
      var playable = p.kind === 'reel' && p.mediaUrl && /^(data:video|blob:|https?:\/\/.+\.(mp4|webm|mov))/i.test(p.mediaUrl);
      if (playable) {
        inner.appendChild(A.el('video', {
          src: p.mediaUrl, controls: true, playsinline: true,
          poster: p.coverUrl || '', preload: 'metadata',
          style: 'width:100%;height:100%;object-fit:contain;background:#000;'
        }));
      } else {
        var fill = A.mediaFill(p);
        if (p.kind === 'editoriale') {
          var box = A.el('div', { style: 'position:relative;width:100%;height:100%;' });
          box.appendChild(fill);
          inner.appendChild(box);
        } else inner.appendChild(fill);
        if (p.kind === 'reel') inner.appendChild(A.el('span', { class: 'pvw-play', html: A.icon('play', 22) }));
      }
    }
    if (isCar) {
      inner.appendChild(A.el('button', { class: 'pvw-arrow left', html: '‹', 'aria-label': 'Slide precedente', onclick: function () { pvSlide(-1); } }));
      inner.appendChild(A.el('button', { class: 'pvw-arrow right', html: '›', 'aria-label': 'Slide successiva', onclick: function () { pvSlide(1); } }));
      var dots = A.el('div', { class: 'pvw-dots' });
      p.slides.forEach(function (_, i) { dots.appendChild(A.el('i', { class: i === PV.slide ? 'on' : '' })); });
      inner.appendChild(dots);
    }
    media.appendChild(inner);
    media.appendChild(A.el('span', { class: 'pvw-size', text: acc ? acc.platform + ' · ' + fmt.sizeLabel + ' · ' + fmt.w + '×' + fmt.h : '' }));
    shell.appendChild(media);

    /* side */
    var side = A.el('div', { class: 'pvw-side' });

    var head = A.el('div', { class: 'pvw-head' });
    var av = A.el('span', { class: 'pvw-av' });
    if (acc && acc.avatarUrl) av.appendChild(A.el('img', { src: acc.avatarUrl, alt: '' }));
    else av.textContent = A.initials(client ? client.name : '?');
    head.appendChild(av);
    head.appendChild(A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
      A.el('span', { class: 'hn', text: acc ? acc.handle : '' }),
      A.el('span', { class: 'hs', text: (acc ? acc.platform : '') + (p.date ? ' · ' + A.dayLabel(p.date) + (p.time ? ' ' + p.time : '') : ' · senza data') })
    ]));
    head.appendChild(A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Chiudi', html: A.icon('x', 15), onclick: A.closePostView }));
    side.appendChild(head);

    var scroll = A.el('div', { class: 'pvw-scroll' });

    var chips = A.el('div', { class: 'pvw-chips' });
    var nat = A.natureOf(p);
    if (p.paid) chips.appendChild(A.el('span', { class: 'tagpill promo-paid', text: 'Sponsorizzato' }));
    if ((p.partner || '').trim()) chips.appendChild(A.el('span', { class: 'tagpill promo-partner', text: 'Con ' + p.partner }));
    var cat = A.get(p.categoryId);
    if (cat) chips.appendChild(A.el('span', { class: 'tagpill', html: '<span class="dot" style="background:' + cat.color + '"></span>' + A.esc(cat.name) }));
    chips.appendChild(A.el('span', { class: 'tagpill', text: p.kind === 'reel' ? 'Reel' : p.kind === 'carosello' ? 'Carosello · ' + p.slides.length : p.kind === 'editoriale' ? 'Card testuale' : 'Post' }));
    if (chips.childNodes.length) scroll.appendChild(chips);

    if (p.caption) {
      scroll.appendChild(A.el('div', { class: 'pvw-caption' }, [
        A.el('b', { text: acc ? acc.handle + ' ' : '' }),
        A.el('span', { text: p.caption })
      ]));
    } else {
      scroll.appendChild(A.el('div', { class: 'pvw-caption empty', text: 'Nessuna caption scritta.' }));
    }

    if ((p.alsoOn || []).length) {
      var names = p.alsoOn.map(function (id) { var c = A.accountCtx(id); return c ? c.account.platform + ' ' + c.account.handle : ''; }).filter(Boolean);
      scroll.appendChild(A.el('div', { class: 'pvw-note', html: '<b>Pubblicato anche su</b>' + A.esc(names.join(' · ')) }));
    }
    if (p.inStories) scroll.appendChild(A.el('div', { class: 'pvw-note', html: '<b>Stories</b>Questo contenuto esce anche nelle stories.' }));
    if (p.clientNote) scroll.appendChild(A.el('div', { class: 'pv-note', html: '<b>' + A.esc(client ? client.name : 'Cliente') + '</b>' + A.esc(p.clientNote) }));
    if (p.internalNote) scroll.appendChild(A.el('div', { class: 'pv-note internal', html: '<b>Nota interna</b>' + A.esc(p.internalNote) }));

    side.appendChild(scroll);

    var foot = A.el('div', { class: 'pvw-foot' });
    foot.appendChild(fakeActions());
    var st = A.statusOf(p.status);
    foot.appendChild(A.el('div', { class: 'pvw-btns' }, [
      A.el('button', {
        class: 'btn sm', style: 'border-color:' + st.c + ';background:' + st.sub + ';',
        html: '<span style="width:7px;height:7px;border-radius:50%;background:' + st.c + '"></span>' + A.esc(st.label),
        onclick: function () { A.openStatusModal(p); }
      }),
      A.el('div', { class: 'bar-space' }),
      A.el('button', { class: 'btn sm', html: A.icon('pencil', 12) + 'Modifica', onclick: function () { A.closePostView(); A.openPostEditor(p.id); } })
    ]));
    side.appendChild(foot);
    shell.appendChild(side);

    if (PV.list.length > 1) {
      shell.appendChild(A.el('button', { class: 'pvw-step prev', html: '‹', 'aria-label': 'Contenuto precedente', onclick: function () { pvNav(-1); } }));
      shell.appendChild(A.el('button', { class: 'pvw-step next', html: '›', 'aria-label': 'Contenuto successivo', onclick: function () { pvNav(1); } }));
      shell.appendChild(A.el('span', { class: 'pvw-count', text: (PV.i + 1) + ' / ' + PV.list.length }));
    }

    host.appendChild(shell);
    host.onclick = function (e) { if (e.target === host) A.closePostView(); };
  }

  /* Story / storyboard viewer — frames step through in place. */
  A.closeStoryViewer = function () {
    var h = A.$('#lightbox');
    h.classList.remove('on', 'as-post');
    A.clear(h);
  };

  A.openStoryViewer = function (story) {
    var idx = 0;
    var host = A.$('#lightbox');
    host.classList.remove('as-post');
    host.classList.add('on');

    function draw() {
      A.clear(host);
      var frames = story.kind === 'storyboard' && story.frames.length
        ? story.frames : [{ id: 'single', url: story.mediaUrl, note: story.note }];
      var f = frames[idx] || frames[0];
      var frame = A.el('div', { class: 'lb-frame', style: 'width:min(280px,80vw);' });
      frame.appendChild(A.el('button', { class: 'lb-x', html: '&times;', 'aria-label': 'Chiudi', onclick: A.closeStoryViewer }));
      var stage = A.el('div', { class: 'lb-stage', style: '--ratio:9/16;' });
      if (f.url) stage.appendChild(A.el('img', { src: f.url, alt: '' }));
      else stage.appendChild(A.el('div', { style: 'color:#777;font-size:12px;padding:20px;text-align:center;', text: f.note || 'Frame vuoto' }));
      stage.appendChild(A.el('span', { class: 'lb-count', text: (idx + 1) + ' / ' + frames.length }));
      frame.appendChild(stage);
      if (frames.length > 1) {
        frame.appendChild(A.el('button', { class: 'lb-nav lb-prev', html: '‹', 'aria-label': 'Frame precedente', onclick: function () { idx = (idx - 1 + frames.length) % frames.length; draw(); } }));
        frame.appendChild(A.el('button', { class: 'lb-nav lb-next', html: '›', 'aria-label': 'Frame successivo', onclick: function () { idx = (idx + 1) % frames.length; draw(); } }));
      }
      frame.appendChild(A.el('div', { class: 'lb-cap', text: (story.title || '') + (f.note ? ' — ' + f.note : '') }));
      host.appendChild(frame);
    }
    draw();
  };

  document.addEventListener('keydown', function (e) {
    var lb = A.$('#lightbox');
    if (lb && lb.classList.contains('on')) {
      var isPost = lb.classList.contains('as-post');
      if (e.key === 'Escape') { isPost ? A.closePostView() : A.closeStoryViewer(); return; }
      if (!isPost) return;
      var p = PV.list[PV.i];
      var car = p && p.kind === 'carosello' && p.slides && p.slides.length > 1;
      if (e.key === 'ArrowLeft') car ? pvSlide(-1) : pvNav(-1);
      if (e.key === 'ArrowRight') car ? pvSlide(1) : pvNav(1);
      return;
    }
    var bg = A.$('#modal-bg');
    if (bg && bg.classList.contains('on') && e.key === 'Escape') A.closeModal();
  });
})(window.IDE);
</script>
<script>
/* src/js/05-feed.js */
/* ============================================================
   Ideology — Feed

   Composing the month. The grid is ordered by publication date
   and everything is edited in one centred dialog, so the grid
   behind it never shifts under the cursor while you work.
   ============================================================ */

(function (A) {
  'use strict';

  /* ── Shared media control: upload a file or paste a link ── */

  A.mediaControl = function (current, onSet, onClear, opts) {
    opts = opts || {};
    var wrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' });

    var row = A.el('div', { style: 'display:flex;gap:7px;align-items:center;flex-wrap:wrap;' });
    var file = A.el('input', { type: 'file', accept: opts.accept || 'image/*', style: 'display:none' });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var read = opts.read || A.readImage;
      var busy = A.remote && A.remote.on;
      if (busy) A.toast('Caricamento…');
      read(f)
        .then(function (res) { return A.storeMedia ? A.storeMedia(res, f) : res; })
        .then(function (res) { onSet(res); if (busy) A.toast('Caricato'); })
        .catch(function (e) { A.toast(e.message); });
      file.value = '';
    });
    row.appendChild(A.el('button', {
      class: 'btn sm', html: A.icon('up', 12) + (current ? (opts.replaceLabel || 'Sostituisci file') : (opts.uploadLabel || 'Carica file')),
      onclick: function () { file.click(); }
    }));
    row.appendChild(file);
    if (current && onClear) {
      row.appendChild(A.el('button', { class: 'btn ghost sm icon', title: 'Svuota', html: A.icon('trash', 12), onclick: onClear }));
    }
    wrap.appendChild(row);

    var linkRow = A.el('div', { style: 'display:flex;gap:6px;' });
    var inp = A.el('input', {
      class: 'inp', type: 'url', placeholder: opts.linkPlaceholder || 'oppure incolla un link all\'immagine',
      value: current && /^https?:/.test(current) ? current : ''
    });
    function apply() {
      var v = inp.value.trim();
      if (!v) return;
      if (!/^https?:\/\//i.test(v)) { A.toast('Il link deve iniziare con http:// o https://'); return; }
      onSet(opts.read === A.readVideo ? { name: '', sizeBytes: 0, poster: '', dataUrl: v } : v);
    }
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); apply(); } });
    linkRow.appendChild(inp);
    linkRow.appendChild(A.el('button', { class: 'btn sm', html: A.icon('link', 12) + 'Usa', onclick: apply }));
    wrap.appendChild(linkRow);

    return wrap;
  };

  /* ── Status dialog ────────────────────────────────────── */

  A.openStatusModal = function (post, actor) {
    var chosen = post.status;
    var pills = A.el('div', { style: 'display:flex;flex-direction:column;gap:6px;' });
    function paint() {
      A.clear(pills);
      A.STATUS.forEach(function (st) {
        var on = chosen === st.key;
        pills.appendChild(A.el('button', {
          type: 'button',
          style: 'display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:7px;text-align:left;' +
                 'border:1px solid ' + (on ? st.c : 'var(--rule)') + ';background:' + (on ? st.sub : 'transparent') + ';' +
                 'font-size:13px;font-weight:600;color:var(--ink);',
          html: '<span style="width:8px;height:8px;border-radius:50%;background:' + st.c + '"></span>' + A.esc(st.label),
          onclick: function () { chosen = st.key; paint(); }
        }));
      });
    }
    paint();
    var noteBox = A.el('textarea', { class: 'ta', rows: '3', placeholder: 'Nota sul passaggio di stato (facoltativa)' });

    A.modal({
      title: 'Stato del contenuto',
      body: [pills, A.el('div', { class: 'field' }, [A.el('label', { text: 'Nota' }), noteBox])],
      actions: [
        { label: 'Annulla' },
        {
          label: 'Applica', kind: 'primary',
          run: function () {
            A.setStatus(post.id, chosen, actor || 'studio', noteBox.value.trim());
            A.saveNow();
          }
        }
      ]
    });
  };

  /* ── The editor ───────────────────────────────────────── */

  function field(label, control, hint) {
    var f = A.el('div', { class: 'field' }, [A.el('label', { text: label }), control]);
    if (hint) f.appendChild(A.el('div', { class: 'hint', text: hint }));
    return f;
  }

  function tickRow(label, desc, on, onToggle, key) {
    var btn = A.el('button', {
      type: 'button', class: 'tick', 'aria-pressed': on ? 'true' : 'false',
      'data-focus': key || null,
      onclick: function () { onToggle(!on); }
    }, [
      A.el('span', { class: 'box', html: A.icon('check', 11) }),
      A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
        A.el('span', { class: 'tl', text: label }),
        desc ? A.el('span', { class: 'td', text: desc }) : null
      ])
    ]);
    return btn;
  }

  A.openPostEditor = function (postId, opts) {
    opts = opts || {};
    var post = A.get(postId);
    if (!post) return;
    var client = A.clientOfAccount(post.accountId);
    /* The dialog writes straight through, so the grid behind it updates as
       you type and every change is autosaved. It keeps a snapshot so
       "Annulla modifiche" can put everything back — including removing a
       post that was created only to be cancelled. */
    var held = { snap: A.snap(post) };
    var stopSnap = A.followSnapshot ? A.followSnapshot(postId, held) : function () {};
    /* A colleague's change to this post shows up in the open dialog. */
    var stopLive = A.remote && A.remote.onRemote ? A.remote.onRemote(function (table, id) {
      if (!document.body.contains(body)) { stopLive(); return; }
      if (id === postId && A.get(postId)) redraw();
    }) : function () {};
    var body = A.el('div', { style: 'display:flex;flex-direction:column;gap:16px;' });

    function redraw() { A.rebuild(build); }

    function build() {
      post = A.get(postId);
      if (!post) { A.closeModal(); return; }
      A.clear(body);

      /* type */
      var seg = A.el('div', { class: 'segment' });
      A.KINDS.forEach(function (k) {
        seg.appendChild(A.el('button', {
          type: 'button', 'aria-pressed': post.kind === k.key ? 'true' : 'false', text: k.label,
          'data-focus': 'kind-' + k.key,
          onclick: function () {
            var patch = { kind: k.key };
            if (k.key === 'carosello' && (!post.slides || !post.slides.length)) {
              patch.slides = [{ id: A.uid('sl'), url: post.mediaUrl || '', caption: '' },
                              { id: A.uid('sl'), url: '', caption: '' }];
            }
            A.updatePost(post.id, patch, { render: false });
            A.render(); redraw();
          }
        }));
      });
      body.appendChild(field('Tipo', seg));

      /* media */
      if (post.kind === 'editoriale') {
        var ed = post.editorial || (post.editorial = { eyebrow: '', title: '', sub: '' });
        var eye = A.el('input', { class: 'inp', value: ed.eyebrow || '', placeholder: 'Occhiello' });
        eye.addEventListener('input', function () { ed.eyebrow = eye.value; A.commit({ render: false }); });
        var tit = A.el('textarea', { class: 'ta', rows: '2', placeholder: 'Titolo della card' });
        tit.value = ed.title || '';
        tit.addEventListener('input', function () { ed.title = tit.value; A.commit({ render: false }); });
        var sub = A.el('textarea', { class: 'ta', rows: '2', placeholder: 'Sottotitolo' });
        sub.value = ed.sub || '';
        sub.addEventListener('input', function () { ed.sub = sub.value; A.commit({ render: false }); });
        body.appendChild(field('Card testuale',
          A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' }, [eye, tit, sub]),
          'Disegnata con i colori del brand del cliente. Nessun file da caricare.'));
      } else if (post.kind === 'carosello') {
        var slWrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:9px;' });
        (post.slides || []).forEach(function (sl, i) {
          var box = A.el('div', { class: 'slide-row' });
          var th = A.el('div', { class: 'slide-th' });
          if (sl.url) {
            var im = A.el('img', { src: sl.url, alt: '' });
            im.addEventListener('error', function () { im.remove(); th.textContent = '!'; });
            th.appendChild(im);
          } else th.textContent = String(i + 1);
          box.appendChild(th);
          box.appendChild(A.el('div', { style: 'flex:1 1 auto;min-width:0;' }, [
            A.mediaControl(sl.url, function (u) {
              sl.url = u;
              if (i === 0) post.mediaUrl = u;
              A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
            }, function () {
              sl.url = '';
              if (i === 0) post.mediaUrl = post.slides[0] ? post.slides[0].url : '';
              A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
            })
          ]));
          box.appendChild(A.el('button', {
            class: 'btn ghost sm icon', title: 'Rimuovi slide', html: A.icon('trash', 12),
            onclick: function () {
              post.slides = post.slides.filter(function (x) { return x.id !== sl.id; });
              post.mediaUrl = post.slides[0] ? post.slides[0].url : '';
              A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
            }
          }));
          slWrap.appendChild(box);
        });
        slWrap.appendChild(A.el('button', {
          class: 'btn sm', html: A.icon('plus', 12) + 'Aggiungi slide',
          onclick: function () {
            post.slides.push({ id: A.uid('sl'), url: '', caption: '' });
            A.updatePost(post.id, {}, { render: false }); A.render(); redraw();
          }
        }));
        body.appendChild(field('Slide (' + (post.slides || []).length + ')', slWrap));
      } else if (post.kind === 'reel') {
        /* A reel is judged in the grid by its cover, so the cover is its own
           field. The video is kept beside it for whoever has to produce it. */
        var coverPrev = A.el('div', { class: 'thumb-prev' });
        if (post.coverUrl) {
          var ci = A.el('img', { src: post.coverUrl, alt: '' });
          ci.addEventListener('error', function () { ci.remove(); coverPrev.textContent = '!'; });
          coverPrev.appendChild(ci);
        } else coverPrev.innerHTML = A.icon('image', 16);
        body.appendChild(field('Copertina del reel',
          A.el('div', { style: 'display:flex;gap:11px;align-items:flex-start;' }, [
            coverPrev,
            A.el('div', { style: 'flex:1 1 auto;min-width:0;' }, [
              A.mediaControl(post.coverUrl, function (u) {
                A.updatePost(post.id, { coverUrl: u }, { render: false }); A.render(); redraw();
              }, function () {
                A.updatePost(post.id, { coverUrl: '' }, { render: false }); A.render(); redraw();
              })
            ])
          ]),
          'È questa che si vede nella griglia e nell\'anteprima.'));

        var vidWrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' });
        if (post.videoName || A.isStoredMedia(post.mediaUrl)) {
          vidWrap.appendChild(A.el('div', { class: 'filechip' }, [
            (function () { var i = A.el('span'); i.innerHTML = A.icon('play', 11); return i; })(),
            A.el('span', { style: 'flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;', text: post.videoName || 'Video caricato' }),
            A.el('span', { style: 'color:var(--ink-3);font-weight:600;', text: A.isStoredMedia(post.mediaUrl) ? 'caricato' : 'solo riferimento' })
          ]));
        }
        vidWrap.appendChild(A.mediaControl(post.mediaUrl, function (res) {
          /* the poster frame becomes the cover when there is not one yet */
          var patch = { videoName: res.name || '', mediaUrl: res.dataUrl || '' };
          if (!post.coverUrl && res.poster) patch.coverUrl = res.poster;
          A.updatePost(post.id, patch, { render: false });
          if (!res.dataUrl) {
            A.toast('Video troppo pesante (' + A.humanSize(res.sizeBytes) + '): tengo la copertina, aggiungi il link al file');
          }
          A.render(); redraw();
        }, function () {
          A.updatePost(post.id, { mediaUrl: '', videoName: '' }, { render: false });
          A.render(); redraw();
        }, {
          accept: 'video/*', read: A.readVideo,
          uploadLabel: 'Carica video', replaceLabel: 'Sostituisci video',
          linkPlaceholder: 'oppure incolla un link al video (Frame.io, Drive, WeTransfer…)'
        }));
        body.appendChild(field('Video', vidWrap, A.remote && A.remote.on
          ? 'Dal file carico anche un fotogramma come copertina. Il video va nello spazio dello studio (fino a ' + A.humanSize(A.remote.MAX_UPLOAD) + '); oltre, incolla un link.'
          : 'Dal file carico anche un fotogramma come copertina. I video sopra ' + A.humanSize(A.VIDEO_INLINE_MAX) + ' restano un riferimento: in griglia conta la copertina.'));
      } else {
        body.appendChild(field('Immagine',
          A.mediaControl(post.mediaUrl, function (u) {
            A.updatePost(post.id, { mediaUrl: u, coverUrl: '' }, { render: false });
            A.render(); redraw();
          }, function () {
            A.updatePost(post.id, { mediaUrl: '', coverUrl: '' }, { render: false });
            A.render(); redraw();
          }),
          'I file caricati vengono ridimensionati e salvati nel documento. I link restano link.'));
      }

      /* when */
      var dIn = A.el('input', { class: 'inp', type: 'date', value: post.date || '' });
      var tIn = A.el('input', { class: 'inp', type: 'time', value: post.time || '' });
      dIn.addEventListener('change', function () {
        A.updatePost(post.id, { date: dIn.value }, { render: false });
        A.render(); redraw();
      });
      tIn.addEventListener('change', function () { A.updatePost(post.id, { time: tIn.value }, { render: false }); A.render(); });
      body.appendChild(field('Pubblicazione', A.el('div', { class: 'row' }, [
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Data' }), dIn]),
        A.el('div', { class: 'field' }, [A.el('label', { text: 'Ora' }), tIn])
      ]), 'In griglia compare solo la data. L\'ora serve a ordinare due contenuti dello stesso giorno.'));

      /* caption */
      var capMax = A.formatOfAccount(A.curAccount()).platform.captionMax;
      var cap = A.el('textarea', { class: 'ta', rows: '7', placeholder: 'Scrivi la caption…' });
      cap.value = post.caption || '';
      var counter = A.el('div', { class: 'counter' });
      function countUp() {
        var n = cap.value.length;
        counter.textContent = n + ' / ' + capMax.toLocaleString('it-IT') + ' caratteri';
        counter.classList.toggle('over', n > capMax);
      }
      cap.addEventListener('input', function () {
        post.caption = cap.value;
        countUp();
        if (post.inStories) A.syncMirror(post.id);
        A.commit({ render: false });
        repaintCard(post);
      });
      countUp();
      body.appendChild(field('Caption', A.el('div', { style: 'display:flex;flex-direction:column;gap:4px;' }, [cap, counter])));

      /* classification */
      var cats = A.categoriesOf(client.id);
      var sel = A.el('select', { class: 'sel' });
      sel.appendChild(A.el('option', { value: '', text: 'Nessuna categoria' }));
      cats.forEach(function (c) {
        sel.appendChild(A.el('option', { value: c.id, text: c.name, selected: post.categoryId === c.id }));
      });
      sel.addEventListener('change', function () { A.updatePost(post.id, { categoryId: sel.value }, { render: false }); A.render(); });
      body.appendChild(field('Categoria', sel,
        cats.length ? null : 'Nessuna categoria definita per ' + client.name + '. Le trovi nella scheda cliente.'));

      /* nature: paid and partnership are independent, and can both be true */
      var isPartner = !!(post.partner || '').trim() || post._partnerOpen;
      var natWrap = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' }, [
        tickRow('Sponsorizzato', 'Contenuto messo a budget.', post.paid,
          function (v) { A.updatePost(post.id, { paid: v }, { render: false }); A.render(); redraw(); }, 'paid'),
        tickRow('In collaborazione', 'Contenuto fatto insieme a qualcun altro.', isPartner,
          function (v) {
            post._partnerOpen = v;
            A.updatePost(post.id, { partner: v ? post.partner : '' }, { render: false });
            A.render(); redraw();
          }, 'partner')
      ]);
      if (isPartner) {
        var pin = A.el('input', { class: 'inp', value: post.partner || '', placeholder: 'Con chi: brand, creator, ente…' });
        pin.addEventListener('input', function () { post.partner = pin.value; A.commit({ render: false }); });
        pin.addEventListener('change', function () { A.render(); });
        natWrap.appendChild(pin);
      }
      body.appendChild(field('Natura del contenuto', natWrap,
        'Si combinano: una collaborazione può anche essere sponsorizzata. Compare nell\'angolo in alto a sinistra.'));

      /* cross-posting to the client's other accounts */
      var sibs = A.siblingAccounts(post.accountId);
      if (sibs.length) {
        var cross = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' });
        sibs.forEach(function (a) {
          var on = (post.alsoOn || []).indexOf(a.id) >= 0;
          var f2 = A.formatOfAccount(a);
          cross.appendChild(tickRow(
            a.platform + ' · ' + a.handle,
            f2.sizeLabel + ' · ' + f2.w + '×' + f2.h + ' · max ' + f2.platform.captionMax.toLocaleString('it-IT') + ' caratteri',
            on,
            function (v) {
              var ids = (post.alsoOn || []).slice();
              var i = ids.indexOf(a.id);
              if (v && i < 0) ids.push(a.id);
              if (!v && i >= 0) ids.splice(i, 1);
              A.updatePost(post.id, { alsoOn: ids }, { render: false });
              A.render(); redraw();
            }, 'also-' + a.id));
        });
        body.appendChild(field('Pubblica anche su', cross,
          'Lo stesso contenuto compare nel feed di quegli account. Resta un record solo: la caption corretta una volta è corretta ovunque.'));
      }

      /* ticks */
      var ticks = A.el('div', { style: 'display:flex;flex-direction:column;gap:7px;' }, [
        tickRow('Pubblica anche nelle Stories', 'Crea e tiene allineata una story collegata a questo contenuto.',
          post.inStories, function (v) { A.setInStories(post.id, v); redraw(); }, 'stories'),
        tickRow('Mostra la data in griglia', null,
          post.showDate, function (v) { A.updatePost(post.id, { showDate: v }, { render: false }); A.render(); redraw(); }, 'showdate')
      ]);
      body.appendChild(field('Opzioni', ticks));

      /* status, notes, history */
      var st = A.statusOf(post.status);
      body.appendChild(field('Stato', A.el('button', {
        type: 'button', class: 'btn',
        style: 'width:100%;justify-content:flex-start;border-color:' + st.c + ';background:' + st.sub + ';',
        html: '<span style="width:8px;height:8px;border-radius:50%;background:' + st.c + '"></span>' + A.esc(st.label),
        onclick: function () { A.openStatusModal(post); }
      }), post.revisions ? post.revisions + (post.revisions === 1 ? ' revisione richiesta dal cliente' : ' revisioni richieste dal cliente') : null));

      var note = A.el('textarea', { class: 'ta', rows: '3', placeholder: 'Visibile solo allo studio' });
      note.value = post.internalNote || '';
      note.addEventListener('input', function () { post.internalNote = note.value; A.commit({ render: false }); });
      body.appendChild(field('Nota interna', note));

      if (post.clientNote) {
        body.appendChild(A.el('div', {
          class: 'pv-note',
          html: '<b>' + A.esc(client.name) + (post.clientNoteAt ? ' · ' + new Date(post.clientNoteAt).toLocaleDateString('it-IT') : '') + '</b>' + A.esc(post.clientNote)
        }));
      }

      if (post.history && post.history.length) {
        var hist = A.el('div', { style: 'display:flex;flex-direction:column;gap:6px;' });
        post.history.slice().reverse().forEach(function (h) {
          var to = A.statusOf(h.to);
          hist.appendChild(A.el('div', { style: 'display:flex;gap:8px;font-size:11.5px;color:var(--ink-2);line-height:1.45;' }, [
            A.el('span', { style: 'width:7px;height:7px;border-radius:50%;background:' + to.c + ';margin-top:5px;flex:0 0 auto;' }),
            A.el('span', {}, [
              A.el('b', { text: to.label }),
              ' · ' + (h.by === 'cliente' ? 'cliente' : 'studio') + ' · ' + new Date(h.at).toLocaleDateString('it-IT'),
              h.note ? A.el('div', { style: 'color:var(--ink-3);', text: h.note }) : null
            ])
          ]));
        });
        body.appendChild(field('Storico', hist));
      }
    }

    build();

    function cancel() {
      var live = A.get(postId);
      if (!live) return;
      if (opts.isNew) {
        A.S.posts = A.S.posts.filter(function (p) { return p.id !== postId; });
        var mirror = A.mirrorOf(postId);
        if (mirror) A.S.stories = A.S.stories.filter(function (x) { return x.id !== mirror.id; });
      } else {
        A.restore(live, held.snap);
        A.syncMirror(postId);
      }
      A.commit();
      A.saveNow();
    }

    A.modal({
      title: opts.isNew ? 'Nuovo contenuto' : 'Contenuto',
      wide: true,
      body: [body],
      onClose: function () {
        stopLive();
        stopSnap();
        var live = A.get(postId);
        if (live) delete live._partnerOpen;
        A.saveNow();
      },
      actions: [
        {
          label: 'Elimina', kind: 'danger', keepOpen: true, run: function () {
            A.confirm({
              title: 'Eliminare il contenuto?',
              body: 'Viene eliminato per tutto lo studio. Puoi annullare dal messaggio in basso.',
              ok: 'Elimina', danger: true,
              run: function () { A.closeModal(); A.deletePost(postId); A.saveNow(); }
            });
            return false;
          }
        },
        { label: 'Anteprima', keepOpen: true, run: function () { A.openPostView(A.visiblePosts(), postId); } },
        {
          label: opts.isNew ? 'Annulla' : 'Annulla modifiche',
          title: opts.isNew ? 'Elimina questo contenuto appena creato' : 'Riporta il contenuto com\'era quando l\'hai aperto',
          run: function () { cancel(); }
        },
        { label: 'Fatto', kind: 'primary', run: function () {} }
      ]
    });
  };

  /* ── Toolbar ──────────────────────────────────────────── */

  /* ── Filter panel ─────────────────────────────────────
     The filters used to sit in the toolbar as a wall of chips that
     wrapped onto a second row and pushed the grid down. They live
     behind one button now: the button says how many are on, so the
     state is never hidden, and the grid starts higher up.
  ──────────────────────────────────────────────────────── */

  function filterPanel(host, close) {
    var posts = A.curPosts();
    var client = A.curClient();
    var f = A.ui.filters;

    function section(title) {
      host.appendChild(A.el('div', { class: 'pop-sec', text: title }));
    }

    function option(cfg) {
      var row = A.el('button', {
        type: 'button', class: 'pop-opt', 'aria-pressed': cfg.on ? 'true' : 'false',
        disabled: cfg.n === 0 && !cfg.on ? true : null,
        onclick: function () { cfg.toggle(); A.render(); A.popover(A.$('#filter-btn'), filterPanel); }
      }, [
        A.el('span', { class: 'box', html: A.icon('check', 11) }),
        cfg.color ? A.el('span', { class: 'dot', style: 'background:' + cfg.color + ';' }) : null,
        A.el('span', { class: 'nm', text: cfg.label }),
        A.el('span', { class: 'n', text: String(cfg.n) })
      ]);
      host.appendChild(row);
    }

    section('Stato');
    A.STATUS.forEach(function (st) {
      option({
        label: st.label, color: st.c,
        n: posts.filter(function (p) { return p.status === st.key; }).length,
        on: (f.status || []).indexOf(st.key) >= 0,
        toggle: function () { A.toggleFilter('status', st.key); }
      });
    });

    section('Natura');
    option({
      label: 'Sponsorizzati',
      n: posts.filter(function (p) { return p.paid; }).length,
      on: f.paid, toggle: function () { f.paid = !f.paid; }
    });
    option({
      label: 'In collaborazione',
      n: posts.filter(function (p) { return (p.partner || '').trim(); }).length,
      on: f.partner, toggle: function () { f.partner = !f.partner; }
    });

    var cats = A.categoriesOf(client.id);
    if (cats.length) {
      section('Categoria');
      cats.forEach(function (c) {
        option({
          label: c.name, color: c.color,
          n: posts.filter(function (p) { return p.categoryId === c.id; }).length,
          on: (f.categoryId || []).indexOf(c.id) >= 0,
          toggle: function () { A.toggleFilter('categoryId', c.id); }
        });
      });
    }

    var n = A.filterCount();
    host.appendChild(A.el('div', { class: 'pop-foot' }, [
      A.el('span', { class: 'hint', text: n ? A.visiblePosts().length + ' di ' + posts.length + ' visibili' : 'Nessun filtro attivo' }),
      A.el('div', { class: 'bar-space' }),
      n ? A.el('button', {
        class: 'btn ghost sm', text: 'Azzera',
        onclick: function () { A.ui.filters = A.emptyFilters(); close(); A.render(); }
      }) : null
    ]));
  }

  /* ── Toolbar ──────────────────────────────────────────── */

  function toolbar() {
    var bar = A.el('div', { class: 'toolbar' });
    var posts = A.curPosts();
    var acc = A.curAccount();
    var client = A.curClient();
    if (!acc || !client) return bar;

    var counts = { foto: 0, reel: 0, carosello: 0, editoriale: 0 };
    posts.forEach(function (p) { counts[p.kind] = (counts[p.kind] || 0) + 1; });

    var stats = A.el('div', { class: 'toolbar-stats' });
    [['post', posts.length], ['reel', counts.reel], ['caroselli', counts.carosello], ['card', counts.editoriale]]
      .forEach(function (s) {
        stats.appendChild(A.el('span', { class: 'stat' }, [A.el('b', { text: String(s[1]) }), A.el('span', { text: s[0] })]));
      });
    bar.appendChild(stats);

    /* the format is a fact about the account, not a filter — it stays out
       in the open because it tells you how the grid is cropping */
    var fmt = A.formatOfAccount(acc);
    bar.appendChild(A.el('span', { class: 'bar-sep' }));
    bar.appendChild(A.el('button', {
      type: 'button', class: 'fmt-note', title: 'Formato impostato sull\'account — modificalo in Clienti',
      html: '<span class="dot" style="background:' + fmt.platform.color + '"></span>' +
            A.esc(acc.platform) + ' · ' + A.esc(fmt.sizeLabel) + ' · ' + fmt.w + '×' + fmt.h,
      onclick: function () { A.goClient(A.ui.clientId); }
    }));

    bar.appendChild(A.el('div', { class: 'bar-space' }));

    var active = A.filterCount();
    var fbtn = A.el('button', {
      type: 'button', id: 'filter-btn',
      class: 'btn sm' + (active ? ' on' : ''),
      html: A.icon('filter', 13) + 'Filtri' + (active ? '<span class="count">' + active + '</span>' : ''),
      onclick: function () { A.popover(fbtn, filterPanel); }
    });
    bar.appendChild(fbtn);

    [['date', 'Data'], ['caption', 'Testo']].forEach(function (t) {
      bar.appendChild(A.el('button', {
        type: 'button', class: 'toggle hide-sm', 'aria-pressed': A.ui.show[t[0]] ? 'true' : 'false',
        html: '<span class="led"></span>' + t[1],
        onclick: function () { A.ui.show[t[0]] = !A.ui.show[t[0]]; A.render(); }
      }));
    });

    bar.appendChild(A.el('button', {
      type: 'button', class: 'btn primary sm', html: A.icon('plus', 13) + 'Aggiungi', onclick: openAddMenu
    }));
    return bar;
  }

  function openAddMenu() {
    var grid = A.el('div', { style: 'display:grid;grid-template-columns:1fr 1fr;gap:8px;' });
    A.KINDS.forEach(function (k) {
      grid.appendChild(A.el('button', {
        type: 'button',
        style: 'display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:14px;border:1px solid var(--rule);' +
               'border-radius:9px;background:var(--panel-2);text-align:left;font-size:13px;font-weight:600;color:var(--ink);',
        html: A.icon(k.icon, 17) + '<span>' + k.label + '</span>',
        onclick: function () {
          A.closeModal();
          var extra = {};
          if (k.key === 'carosello') {
            extra.slides = [{ id: A.uid('sl'), url: '', caption: '' }, { id: A.uid('sl'), url: '', caption: '' }];
          }
          if (k.key === 'editoriale') extra.editorial = { eyebrow: '', title: 'Scrivi il titolo', sub: '' };
          var p = A.addPost(k.key, extra);
          if (p) A.openPostEditor(p.id, { isNew: true });
