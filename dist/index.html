/* src/css/tokens.css */
/* ============================================================
   Ideology — design tokens
   Colour rule: the interface is warm-neutral. Saturated colour
   is reserved for approval state and nothing else, so a glance
   at the grid reads as status, never as decoration.
   ============================================================ */

:root {
  /* surfaces */
  --paper:      #FBFAF8;
  --paper-2:    #F3F1ED;
  --panel:      #FFFFFF;
  --panel-2:    #FAF9F7;
  --overlay:    rgba(20,20,24,.46);

  /* ink */
  --ink:        #16161A;
  --ink-2:      #4C4C56;
  --ink-3:      #8A8A93;
  --ink-4:      #B4B3B8;

  /* structure */
  --rule:       #E5E2DC;
  --rule-2:     #D4D0C8;

  /* brand — used only for selection and the wordmark */
  --cobalt:     #1D3FD8;
  --cobalt-ink: #142C97;
  --cobalt-sub: #E9EDFC;

  /* approval states */
  --st-bozza:        #8B8B95;
  --st-bozza-sub:    #EDECEA;
  --st-revisione:    #C2410C;
  --st-revisione-sub:#FCECE2;
  --st-approvare:    #9A6B00;
  --st-approvare-sub:#FBF1D9;
  --st-approvato:    #0E7A4A;
  --st-approvato-sub:#E0F2E9;
  --st-pubblicato:   #44556B;
  --st-pubblicato-sub:#E9EDF1;

  /* ugc states */
  --ugc-idea:    #8B8B95;
  --ugc-brief:   #9A6B00;
  --ugc-girato:  #1D3FD8;
  --ugc-consegna:#0E7A4A;

  /* type */
  --font: 'Schibsted Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --fs-xs:  10.5px;
  --fs-sm:  11.5px;
  --fs-md:  13px;
  --fs-lg:  15px;
  --fs-xl:  19px;
  --fs-2xl: 26px;

  /* geometry */
  --r-cell: 10px;
  --r-ui:   7px;
  --r-pill: 999px;
  --bar-h:  52px;
  --tab-h:  42px;

  /* motion */
  --t: 140ms cubic-bezier(.2,.7,.3,1);

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:      #0F0F12;
    --paper-2:    #16161A;
    --panel:      #17171B;
    --panel-2:    #1D1D22;
    --overlay:    rgba(0,0,0,.66);
    --ink:        #F2F1EE;
    --ink-2:      #B9B8BD;
    --ink-3:      #85848C;
    --ink-4:      #5C5B63;
    --rule:       #2A2A31;
    --rule-2:     #3A3A43;
    --cobalt:     #7C8DFF;
    --cobalt-ink: #AEB9FF;
    --cobalt-sub: #1E2142;
    --st-bozza:        #9A99A3;
    --st-bozza-sub:    #26262C;
    --st-revisione:    #F0834E;
    --st-revisione-sub:#331C12;
    --st-approvare:    #D9A520;
    --st-approvare-sub:#2E2510;
    --st-approvato:    #3FBE83;
    --st-approvato-sub:#102B20;
    --st-pubblicato:   #8FA6C0;
    --st-pubblicato-sub:#1A222C;
    --ugc-idea:    #9A99A3;
    --ugc-brief:   #D9A520;
    --ugc-girato:  #7C8DFF;
    --ugc-consegna:#3FBE83;
  }
}

:root[data-theme="dark"] {
  --paper:      #0F0F12;
  --paper-2:    #16161A;
  --panel:      #17171B;
  --panel-2:    #1D1D22;
  --overlay:    rgba(0,0,0,.66);
  --ink:        #F2F1EE;
  --ink-2:      #B9B8BD;
  --ink-3:      #85848C;
  --ink-4:      #5C5B63;
  --rule:       #2A2A31;
  --rule-2:     #3A3A43;
  --cobalt:     #7C8DFF;
  --cobalt-ink: #AEB9FF;
  --cobalt-sub: #1E2142;
  --st-bozza:        #9A99A3;
  --st-bozza-sub:    #26262C;
  --st-revisione:    #F0834E;
  --st-revisione-sub:#331C12;
  --st-approvare:    #D9A520;
  --st-approvare-sub:#2E2510;
  --st-approvato:    #3FBE83;
  --st-approvato-sub:#102B20;
  --st-pubblicato:   #8FA6C0;
  --st-pubblicato-sub:#1A222C;
  --ugc-idea:    #9A99A3;
  --ugc-brief:   #D9A520;
  --ugc-girato:  #7C8DFF;
  --ugc-consegna:#3FBE83;
}
</style>
<style>
/* src/css/app.css */
/* ============================================================
   Ideology — application styles
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
}

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cobalt); outline-offset: 2px; border-radius: 3px; }
::placeholder { color: var(--ink-4); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ── App shell ─────────────────────────────────────────── */

.app { display: flex; flex-direction: column; height: 100%; }

.bar {
  height: var(--bar-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}

.wordmark {
  display: flex; align-items: baseline; gap: 7px;
  font-weight: 800; font-size: 15px;
  letter-spacing: -.045em;
  margin-right: 4px;
  user-select: none;
}
.wordmark .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cobalt); align-self: center; }
.wordmark small { font-weight: 500; font-size: 10.5px; color: var(--ink-3); letter-spacing: 0; }

.bar-sep { width: 1px; height: 22px; background: var(--rule); flex: 0 0 auto; }
.bar-space { flex: 1 1 auto; min-width: 8px; }

/* context selectors */
.ctx {
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 10px;
  background: var(--paper-2);
  border: 1px solid transparent;
  border-radius: var(--r-ui);
  font-size: var(--fs-sm); font-weight: 500;
  color: var(--ink);
  max-width: 220px;
  transition: border-color var(--t), background var(--t);
}
.ctx:hover { border-color: var(--rule-2); }
select.ctx, .ctx select {
  appearance: none; -webkit-appearance: none;
  cursor: pointer; font-weight: 600;
  padding-right: 26px; text-overflow: ellipsis;
}
.ctx select { background: none; border: 0; padding: 0 14px 0 0; max-width: 170px; }
.ctx .chev { position: absolute; pointer-events: none; }
.ctx-wrap { position: relative; display: inline-flex; }
.ctx-wrap::after {
  content: ''; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px;
  border-right: 1.6px solid var(--ink-3); border-bottom: 1.6px solid var(--ink-3);
  transform: translateY(-70%) rotate(45deg); pointer-events: none;
}
.ctx-label { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }

.monthnav { display: flex; align-items: center; gap: 2px; }
.monthnav .m { min-width: 118px; text-align: center; font-weight: 600; font-size: var(--fs-sm); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px; padding: 0 11px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule-2); border-radius: var(--r-ui);
  font-size: var(--fs-sm); font-weight: 600;
  white-space: nowrap;
  transition: background var(--t), border-color var(--t), color var(--t);
}
.btn:hover { background: var(--paper-2); border-color: var(--ink-4); }
.btn:active { transform: translateY(.5px); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--paper-2); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: var(--fs-xs); }
.btn.icon { width: 30px; padding: 0; }
.btn.icon.sm { width: 26px; }
.btn.danger { color: var(--st-revisione); border-color: var(--st-revisione-sub); }
.btn.danger:hover { background: var(--st-revisione-sub); border-color: var(--st-revisione); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.btn svg { width: 13px; height: 13px; flex: 0 0 auto; }

/* save indicator */
.saved {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3);
  padding: 0 4px; white-space: nowrap;
}
.saved .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--st-approvato); }
.saved[data-s="dirty"] .pip { background: var(--st-approvare); }
.saved[data-s="error"] .pip { background: var(--st-revisione); }

/* ── Tabs ──────────────────────────────────────────────── */

.tabs {
  height: var(--tab-h); flex: 0 0 auto;
  display: flex; align-items: stretch; gap: 0;
  padding: 0 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  overflow-x: auto; scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 0 13px;
  background: none; border: 0; border-bottom: 2px solid transparent;
  font-size: var(--fs-md); font-weight: 600; color: var(--ink-3);
  white-space: nowrap;
  transition: color var(--t), border-color var(--t);
}
.tab:hover { color: var(--ink-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cobalt); }
.tab .count {
  font-size: var(--fs-xs); font-weight: 700; color: var(--ink-4);
  background: var(--paper-2); border-radius: var(--r-pill); padding: 1px 6px;
}
.tab[aria-selected="true"] .count { color: var(--cobalt); background: var(--cobalt-sub); }

/* ── Page frame ────────────────────────────────────────── */

.pages { flex: 1 1 auto; min-height: 0; position: relative; }
.page { position: absolute; inset: 0; display: none; flex-direction: column; min-height: 0; }
.page.on { display: flex; }

.toolbar {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
  min-height: 46px;
}
.toolbar-stats { display: flex; align-items: center; gap: 14px; }
.stat { display: flex; align-items: baseline; gap: 4px; }
.stat b { font-size: var(--fs-md); font-weight: 700; }
.stat span { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 500; }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 25px; padding: 0 10px;
  border: 1px solid var(--rule-2); border-radius: var(--r-pill);
  background: transparent; color: var(--ink-2);
  font-size: var(--fs-xs); font-weight: 600;
  transition: all var(--t);
}
.chip:hover { border-color: var(--ink-4); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.chip .n { opacity: .6; font-weight: 700; }
.chip.swatch[aria-pressed="true"] { background: var(--sw, var(--ink)); border-color: var(--sw, var(--ink)); color: #fff; }

.toggle {
  display: inline-flex; align-items: center; gap: 6px;
  height: 25px; padding: 0 9px;
  border: 1px solid var(--rule); border-radius: var(--r-ui);
  background: transparent; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3);
}
.toggle[aria-pressed="true"] { color: var(--ink); border-color: var(--rule-2); background: var(--paper-2); }
.toggle .led { width: 14px; height: 9px; border-radius: 99px; background: var(--rule-2); position: relative; transition: background var(--t); }
.toggle .led::after { content:''; position:absolute; top:1.5px; left:1.5px; width:6px; height:6px; border-radius:50%; background: var(--panel); transition: transform var(--t); }
.toggle[aria-pressed="true"] .led { background: var(--cobalt); }
.toggle[aria-pressed="true"] .led::after { transform: translateX(5px); }

/* ── Split: canvas + inspector ─────────────────────────── */

.split { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
.canvas { flex: 1 1 auto; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 20px; }
.inspector {
  flex: 0 0 310px; width: 310px;
  border-left: 1px solid var(--rule);
  background: var(--panel);
  overflow-y: auto;
  display: flex; flex-direction: column;
}
.inspector.empty { align-items: center; justify-content: center; }
.insp-empty { padding: 30px 24px; text-align: center; color: var(--ink-3); font-size: var(--fs-sm); line-height: 1.6; }
.insp-head {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 8px;
  padding: 11px 14px;
  background: var(--panel); border-bottom: 1px solid var(--rule);
}
.insp-head h3 { margin: 0; font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em; }
.insp-body { padding: 14px; display: flex; flex-direction: column; gap: 15px; }
.insp-foot { margin-top: auto; padding: 12px 14px; border-top: 1px solid var(--rule); display: flex; gap: 7px; }

.field { display: flex; flex-direction: column; gap: 5px; }
.field > label { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); letter-spacing: .01em; }
.field .hint { font-size: var(--fs-xs); color: var(--ink-4); }
.inp, .ta, .sel {
  width: 100%; padding: 7px 9px;
  background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--rule); border-radius: var(--r-ui);
  font-size: var(--fs-sm);
  transition: border-color var(--t), background var(--t);
}
.inp:focus, .ta:focus, .sel:focus { border-color: var(--cobalt); background: var(--panel); outline: none; }
.ta { resize: vertical; min-height: 76px; line-height: 1.55; }
.sel { appearance: none; cursor: pointer; padding-right: 26px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
  background-position: calc(100% - 14px) 14px, calc(100% - 9px) 14px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.row { display: flex; gap: 7px; }
.row > * { flex: 1 1 0; min-width: 0; }
.counter { font-size: var(--fs-xs); color: var(--ink-4); text-align: right; }
.counter.over { color: var(--st-revisione); font-weight: 700; }

.segment { display: flex; background: var(--paper-2); border-radius: var(--r-ui); padding: 2px; gap: 2px; }
.segment button {
  flex: 1 1 0; height: 26px; border: 0; border-radius: 5px; background: transparent;
  font-size: var(--fs-xs); font-weight: 600; color: var(--ink-3); transition: all var(--t);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.segment button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.07); }

/* ── The grid (shared by Feed / Anteprima / client view) ── */

.grid-wrap { max-width: 1180px; }
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
  gap: var(--gap, 12px);
  align-content: start;
}
.card {
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: var(--r-cell);
  overflow: hidden;
  transition: border-color var(--t), box-shadow var(--t);
}
.card.sel { border-color: var(--cobalt); box-shadow: 0 0 0 1px var(--cobalt); }
.card.drag { opacity: .35; }
.card.over { border-color: var(--cobalt); }
.card[data-st="in_revisione"]  { border-color: var(--st-revisione); }
.card[data-st="da_approvare"]  { border-color: var(--st-approvare); }
.card[data-st="approvato"]     { border-color: var(--st-approvato); }
.card[data-st="pubblicato"]    { border-color: var(--st-pubblicato); }

.cell {
  position: relative; width: 100%;
  aspect-ratio: var(--ratio, 4/5);
  background: var(--paper-2);
  overflow: hidden; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.cell img, .cell video { width: 100%; height: 100%; object-fit: cover; display: block; }
.cell .ph { display: flex; flex-direction: column; align-items: center; gap: 7px; color: var(--ink-4); font-size: var(--fs-xs); font-weight: 600; }
.cell .ph svg { width: 20px; height: 20px; }

/* ── The four corners ──────────────────────────────────────
   Every card answers the same four questions in the same four
   places, so the grid can be read without reading any words:
   paid or organic · what it is · where it is · what it is about
   ──────────────────────────────────────────────────────── */

.c-tl, .c-tr, .c-bl, .c-br {
  position: absolute;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 7px; border-radius: var(--r-pill);
  font-size: 9.5px; font-weight: 700; line-height: 1.3;
  max-width: calc(100% - 14px);
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  backdrop-filter: blur(7px);
  border: 0;
}
.c-tl { top: 7px; left: 7px; background: rgba(252,251,249,.74); color: var(--ink-2); font-weight: 600; }
.c-tl.paid { background: rgba(20,20,24,.82); color: #FFD88A; font-weight: 800; letter-spacing: .01em; }
.c-tr { top: 7px; right: 7px; background: rgba(20,20,24,.62); color: #fff; }
.c-bl { bottom: 7px; left: 7px; background: var(--panel); color: var(--ink); box-shadow: 0 1px 5px rgba(0,0,0,.2); }
.c-br { bottom: 7px; right: 7px; background: rgba(252,251,249,.86); color: var(--ink-2); max-width: 56%; }
.c-tl .dot, .c-tr .dot, .c-bl .dot, .c-br .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.c-bl .rev {
  margin-left: 3px; padding: 0 4px; border-radius: var(--r-pill);
  background: var(--st-approvare); color: #fff; font-size: 8.5px; font-weight: 800;
}
.c-bl .rev.hot { background: var(--st-revisione); }
button.c-bl { cursor: pointer; }
button.c-bl:hover { box-shadow: 0 1px 5px rgba(0,0,0,.3); }

:root[data-theme="dark"] .c-tl, :root[data-theme="dark"] .c-br { background: rgba(28,28,33,.84); color: var(--ink-2); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .c-tl,
  :root:not([data-theme="light"]) .c-br { background: rgba(28,28,33,.84); color: var(--ink-2); }
}

.card-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
.card-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tagpill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 1px 7px; border-radius: var(--r-pill);
  font-size: 9.5px; font-weight: 700;
  border: 1px solid var(--rule-2); color: var(--ink-2);
}
.tagpill .dot { width: 6px; height: 6px; border-radius: 50%; }
.card-when {
  display: flex; align-items: center; gap: 5px;
  font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2);
}
.card-when.none { color: var(--ink-4); font-weight: 600; }
.card-when svg { width: 11px; height: 11px; opacity: .6; }

.card-caption {
  font-size: var(--fs-sm); color: var(--ink-2); line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  white-space: pre-wrap; word-break: break-word; cursor: default;
}
.card-caption:empty { display: none; }

.cap-pop {
  position: fixed; z-index: 450;
  padding: 11px 13px; border-radius: 9px;
  background: var(--panel); color: var(--ink);
  border: 1px solid var(--rule-2);
  box-shadow: 0 10px 34px rgba(0,0,0,.2);
  font-size: var(--fs-sm); line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
  max-height: 60vh; overflow-y: auto;
  pointer-events: none;
}
.card-links { display: flex; align-items: center; gap: 5px; }
.card-links .lk {
  width: 24px; height: 24px; border-radius: 50%; overflow: hidden;
  border: 1.5px solid var(--cobalt); background: var(--paper-2);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: var(--ink-3); cursor: pointer; flex: 0 0 auto;
}
.card-links .lk img { width: 100%; height: 100%; object-fit: cover; }
.card-links .lbl { font-size: 9.5px; font-weight: 700; color: var(--ink-3); }

/* editorial card rendered from text */
.edcard { position: absolute; inset: 0; padding: 14px 13px; display: flex; flex-direction: column; gap: 6px; }
.edcard .eye { font-size: 9.5px; font-weight: 700; opacity: .5; }
.edcard .tit { font-size: 17px; font-weight: 800; line-height: 1.08; letter-spacing: -.035em; flex: 1 1 auto; overflow: hidden; }
.edcard .rule { height: 1px; background: currentColor; opacity: .18; }
.edcard .sub { font-size: 10px; opacity: .6; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.addcell {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  aspect-ratio: var(--ratio, 4/5);
  border: 1.5px dashed var(--rule-2); border-radius: var(--r-cell);
  background: transparent; color: var(--ink-3);
  font-size: var(--fs-sm); font-weight: 600;
  transition: all var(--t);
}
.addcell:hover { border-color: var(--cobalt); color: var(--cobalt); background: var(--cobalt-sub); }
.addcell svg { width: 18px; height: 18px; }

/* ── Empty states ──────────────────────────────────────── */

.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 64px 24px; text-align: center; color: var(--ink-3);
}
.empty h4 { margin: 0; font-size: var(--fs-lg); font-weight: 700; color: var(--ink); letter-spacing: -.015em; }
.empty p { margin: 0; font-size: var(--fs-sm); max-width: 38ch; line-height: 1.6; }

/* ── Stories ───────────────────────────────────────────── */

.sec-title {
  display: flex; align-items: center; gap: 9px;
  font-size: var(--fs-sm); font-weight: 700; color: var(--ink-2);
  margin: 0 0 11px;
}
.sec-title::after { content: ''; flex: 1 1 auto; height: 1px; background: var(--rule); }
.hl-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.hl {
  width: 72px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: none; border: 0; padding: 0;
}
.hl .ring {
  width: 60px; height: 60px; border-radius: 50%; overflow: hidden;
  border: 1.5px solid var(--rule-2); background: var(--paper-2);
  display: flex; align-items: center; justify-content: center; color: var(--ink-4);
  transition: border-color var(--t);
}
.hl:hover .ring { border-color: var(--cobalt); }
.hl .ring img { width: 100%; height: 100%; object-fit: cover; }
.hl .nm { font-size: var(--fs-xs); font-weight: 600; color: var(--ink-2); max-width: 72px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.frames { display: flex; gap: 6px; padding: 8px 10px; overflow-x: auto; scrollbar-width: thin; }
.frame-th {
  width: 34px; height: 54px; border-radius: 5px; overflow: hidden; flex: 0 0 auto;
  border: 1.5px solid var(--rule); background: var(--paper-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; color: var(--ink-4);
}
.frame-th.on { border-color: var(--cobalt); }
.frame-th img { width: 100%; height: 100%; object-fit: cover; }

/* ── UGC calendar ──────────────────────────────────────── */

.cal { display: flex; flex-direction: column; min-height: 0; }
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; }
.cal-dh { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); text-align: center; padding: 3px 0; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-day {
  min-height: 94px; padding: 6px;
  background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r-ui);
  display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left;
  transition: border-color var(--t), background var(--t);
}
.cal-day:hover { border-color: var(--rule-2); background: var(--panel-2); }
.cal-day.off { opacity: .4; }
.cal-day.today { border-color: var(--cobalt); }
.cal-day .d { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3); }
.cal-day.today .d { color: var(--cobalt); }
.ev {
  display: flex; align-items: center; gap: 5px;
  padding: 2px 6px; border-radius: 4px;
  font-size: 9.5px; font-weight: 600;
  overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  border-left: 2.5px solid var(--c, var(--ink-4));
  background: var(--paper-2); color: var(--ink-2);
}
.ev .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.cal-more { font-size: 9.5px; font-weight: 600; color: var(--ink-4); padding-left: 3px; }

.daybtns { display: flex; gap: 3px; }
.daybtn {
  width: 24px; height: 24px; border-radius: 50%;
  border: 1px solid var(--rule-2); background: transparent;
  font-size: var(--fs-xs); font-weight: 700; color: var(--ink-3);
  transition: all var(--t);
}
.daybtn[aria-pressed="true"] { background: var(--cobalt); border-color: var(--cobalt); color: #fff; }

/* creators */
.creator {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-ui);
  background: var(--panel); margin-bottom: 7px; width: 100%; text-align: left;
}
.creator:hover { border-color: var(--rule-2); }
.creator .av {
  width: 32px; height: 32px; border-radius: 50%; flex: 0 0 auto;
  background: var(--cobalt-sub); color: var(--cobalt-ink);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-xs); font-weight: 800;
}
.creator .nm { font-weight: 600; font-size: var(--fs-sm); }
.creator .sub { font-size: var(--fs-xs); color: var(--ink-3); }

/* year bars */
.year { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
.ymonth {
  padding: 10px 11px; border: 1px solid var(--rule); border-radius: var(--r-ui);
  background: var(--panel); text-align: left; display: flex; flex-direction: column; gap: 7px;
}
.ymonth:hover { border-color: var(--rule-2); }
.ymonth.now { border-color: var(--cobalt); }
.ymonth .m { font-size: var(--fs-xs); font-weight: 700; color: var(--ink-2); }
.ymonth .track { height: 4px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.ymonth .fill { height: 100%; border-radius: 99px; background: var(--ink); }
.ymonth .n { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }

/* ── Anteprima (the artefact) ──────────────────────────── */

.preview-scroll { flex: 1 1 auto; overflow-y: auto; background: var(--paper-2); }
.stage { max-width: 680px; margin: 0 auto; padding: 22px 16px 60px; }
.sheet {
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 14px;
  overflow: hidden;
}
.profile { padding: 18px 16px 14px; border-bottom: 1px solid var(--rule); }
.profile-top { display: flex; align-items: center; gap: 16px; }
.profile .av {
  width: 62px; height: 62px; border-radius: 50%; flex: 0 0 auto; overflow: hidden;
  background: var(--paper-2); border: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-lg); font-weight: 800; color: var(--ink-3);
}
.profile .av img { width: 100%; height: 100%; object-fit: cover; }
.profile-nums { display: flex; gap: 20px; flex: 1 1 auto; }
.profile-nums div { text-align: center; }
.profile-nums b { display: block; font-size: var(--fs-md); font-weight: 700; }
.profile-nums span { font-size: var(--fs-xs); color: var(--ink-3); }
.profile .handle { margin-top: 12px; font-size: var(--fs-sm); font-weight: 700; }
.profile .bio { margin-top: 2px; font-size: var(--fs-sm); color: var(--ink-2); white-space: pre-wrap; line-height: 1.5; }

.pv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--rule); }
.pv-cell {
  position: relative; aspect-ratio: var(--ratio, 4/5);
  background: var(--panel-2); cursor: pointer; overflow: hidden;
  transition: opacity var(--t);
}
.pv-cell:hover { opacity: .9; }
.pv-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pv-cell .mk { position: absolute; top: 7px; right: 7px; color: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,.55)); }
.pv-cell .mk svg { width: 15px; height: 15px; }
.pv-cell .mk.badge {
  top: 7px; left: 7px; right: auto; filter: none;
  font-size: 9px; font-weight: 800; letter-spacing: .02em;
  padding: 2px 7px; border-radius: var(--r-pill);
  background: rgba(20,20,24,.82); color: #FFD88A;
}
.pv-cell .mk.badge.promo-partnership { color: #C9C2FF; }
.pv-cell .st { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; }
@media (max-width: 560px) { .pv-cell .mk.badge { font-size: 8px; padding: 1px 5px; } }

.pv-list { padding: 4px 0 0; }
.pv-post { padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.pv-post:last-child { border-bottom: 0; }
.pv-post-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.pv-post-hd .idx { font-size: var(--fs-xs); font-weight: 800; color: var(--ink-4); min-width: 20px; }
.pv-media { border-radius: var(--r-cell); overflow: hidden; border: 1px solid var(--rule); position: relative; cursor: pointer; }
.pv-media .cell { border-radius: 0; }
.pv-caption { margin-top: 10px; font-size: var(--fs-sm); line-height: 1.6; white-space: pre-wrap; color: var(--ink); word-break: break-word; }
.pv-actions { margin-top: 11px; display: flex; gap: 7px; }
.pv-actions .btn { flex: 1 1 0; }
.pv-note {
  margin-top: 10px; padding: 9px 11px; border-radius: var(--r-ui);
  font-size: var(--fs-sm); line-height: 1.55;
  background: var(--st-revisione-sub); color: var(--st-revisione);
  border-left: 2.5px solid var(--st-revisione);
}
.pv-note b { display: block; font-size: var(--fs-xs); margin-bottom: 2px; }
.pv-note.internal { background: var(--paper-2); color: var(--ink-2); border-left-color: var(--ink-4); }

.statebar {
  display: flex; align-items: stretch; gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); border-radius: var(--r-ui);
  overflow: hidden; margin-bottom: 14px;
}
.statebar button {
  flex: 1 1 0; background: var(--panel); border: 0; padding: 9px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  transition: background var(--t);
}
.statebar button:hover { background: var(--panel-2); }
.statebar button[aria-pressed="true"] { background: var(--sub, var(--paper-2)); }
.statebar b { font-size: var(--fs-lg); font-weight: 700; color: var(--c, var(--ink)); line-height: 1; }
.statebar span { font-size: 9.5px; font-weight: 600; color: var(--ink-3); }

.pv-foot { text-align: center; padding: 26px 16px 10px; color: var(--ink-4); font-size: var(--fs-xs); }
.pv-foot .sig { font-weight: 800; letter-spacing: -.03em; font-size: var(--fs-sm); color: var(--ink-3); margin-top: 3px; }

.client-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 14px; border-radius: var(--r-ui);
  background: var(--cobalt-sub); color: var(--cobalt-ink);
  font-size: var(--fs-sm); font-weight: 600; margin-bottom: 14px;
}
.client-banner svg { width: 15px; height: 15px; flex: 0 0 auto; }

/* ── Modal / lightbox / toast ──────────────────────────── */

.modal-bg {
  position: fixed; inset: 0; z-index: 400;
  background: var(--overlay);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.on { display: flex; }
.modal {
  width: 420px; max-width: 100%; max-height: 86vh; overflow-y: auto;
  background: var(--panel); border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.modal-hd { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--rule); }
.modal-hd h3 { margin: 0; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.015em; flex: 1 1 auto; }
.modal-bd { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.modal-ft { padding: 12px 16px; border-top: 1px solid var(--rule); display: flex; gap: 8px; justify-content: flex-end; }

.lb { position: fixed; inset: 0; z-index: 500; background: rgba(8,8,10,.93); display: none; align-items: center; justify-content: center; }
.lb.on { display: flex; }
.lb-frame { position: relative; width: min(400px, 90vw); }
.lb-stage { width: 100%; aspect-ratio: var(--ratio, 4/5); background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb-cap { margin-top: 12px; color: #d9d9dd; font-size: var(--fs-sm); line-height: 1.55; max-height: 22vh; overflow-y: auto; white-space: pre-wrap; }
.lb-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,.12); color: #fff; border: 0;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
}
.lb-nav:hover { background: rgba(255,255,255,.22); }
.lb-prev { left: -44px; } .lb-next { right: -44px; }
@media (max-width: 560px) { .lb-prev { left: 4px; } .lb-next { right: 4px; } }
.lb-x { position: absolute; top: -40px; right: 0; background: none; border: 0; color: #fff; font-size: 22px; line-height: 1; }
.lb-count { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 99px; }

.toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 600; display: flex; flex-direction: column; gap: 7px; align-items: center; pointer-events: none; }
.toast {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 14px; border-radius: var(--r-pill);
  background: var(--ink); color: var(--paper);
  font-size: var(--fs-sm); font-weight: 600;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
  pointer-events: auto; animation: toastIn 180ms cubic-bezier(.2,.8,.3,1);
  max-width: 90vw;
}
.toast button { background: none; border: 0; color: #A8B4FF; font-weight: 700; font-size: var(--fs-sm); padding: 0; }
.toast button:hover { color: #C7CFFF; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── Responsive ────────────────────────────────────────── */

@media (max-width: 1000px) {
  .inspector { position: absolute; right: 0; top: 0; bottom: 0; z-index: 40; box-shadow: -8px 0 28px rgba(0,0,0,.14); transform: translateX(100%); transition: transform var(--t); }
  .inspector.open { transform: none; }
  .inspector.empty { display: none; }
}
@media (max-width: 720px) {
  .bar { gap: 8px; padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }
  .canvas { padding: 12px; }
  .grid { --cols: 2 !important; }
  .inspector { flex-basis: 100%; width: 100%; }
  .cal-day { min-height: 68px; }
  .hide-sm { display: none !important; }
}

/* ============================================================
   Shell with left rail — added with the Home / Clienti sections
   ============================================================ */

.app { flex-direction: row; }
.main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.rail {
  flex: 0 0 206px; width: 206px;
  background: var(--panel); border-right: 1px solid var(--rule);
  display: flex; flex-direction: column;
  padding: 14px 10px 10px;
  gap: 2px;
}
.rail-brand { display: flex; align-items: center; gap: 8px; padding: 0 8px 16px; }
.rail-brand .mark {
  width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
}
.rail-brand .nm { font-size: 14px; font-weight: 800; letter-spacing: -.04em; }
.rail-brand .sub { font-size: 10px; color: var(--ink-3); font-weight: 500; }

.rail-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px;
  border: 0; border-radius: var(--r-ui); background: transparent;
  color: var(--ink-2); font-size: var(--fs-md); font-weight: 600;
  text-align: left; transition: background var(--t), color var(--t);
}
.rail-item:hover { background: var(--paper-2); color: var(--ink); }
.rail-item[aria-current="page"] { background: var(--ink); color: var(--paper); }
.rail-item svg { width: 16px; height: 16px; flex: 0 0 auto; }
.rail-item .n {
  margin-left: auto; font-size: 10px; font-weight: 800;
  background: var(--st-approvare-sub); color: var(--st-approvare);
  padding: 1px 6px; border-radius: var(--r-pill);
}
.rail-item[aria-current="page"] .n { background: rgba(255,255,255,.18); color: inherit; }
.rail-lbl { font-size: 10px; font-weight: 700; color: var(--ink-4); padding: 14px 10px 5px; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; padding-top: 10px; border-top: 1px solid var(--rule); }

@media (max-width: 980px) {
  .rail { flex-basis: 56px; width: 56px; padding: 12px 8px 8px; align-items: center; }
  .rail .nm, .rail .sub, .rail-item .rtxt, .rail-save .rtxt, .rail-lbl, .rail .saved { display: none; }
  .rail-brand { padding: 0 0 14px; }
  .rail-item { justify-content: center; padding: 9px 0; }
  .rail-item .n { position: absolute; margin: 0; transform: translate(14px,-12px); }
  .rail-item { position: relative; }
  .rail-foot { width: 100%; align-items: center; }
}

/* ── Section header (Home / Clienti) ──────────────────── */

.sec-head {
  flex: 0 0 auto; padding: 20px 24px 14px;
  display: flex; align-items: flex-end; gap: 14px;
  border-bottom: 1px solid var(--rule); background: var(--panel);
}
.sec-head h1 { margin: 0; font-size: var(--fs-2xl); font-weight: 800; letter-spacing: -.045em; line-height: 1.05; }
.sec-head p { margin: 3px 0 0; font-size: var(--fs-sm); color: var(--ink-3); }

/* ── Home ─────────────────────────────────────────────── */

.home { padding: 22px 24px 60px; max-width: 1080px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 28px; }
.kpi {
  padding: 14px 15px; border: 1px solid var(--rule); border-radius: 10px;
  background: var(--panel); display: flex; flex-direction: column; gap: 3px; text-align: left;
  transition: border-color var(--t);
}
button.kpi:hover { border-color: var(--ink-4); }
.kpi b { font-size: 28px; font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--c, var(--ink)); }
.kpi span { font-size: var(--fs-xs); color: var(--ink-3); font-weight: 600; }
.kpi em { font-style: normal; font-size: var(--fs-xs); color: var(--ink-4); }

.board { display: grid; grid-template-columns: 1.35fr 1fr; gap: 26px; align-items: start; }
@media (max-width: 860px) { .board { grid-template-columns: 1fr; } }

.crow {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 11px 12px; border: 1px solid var(--rule); border-radius: 9px;
  background: var(--panel); margin-bottom: 7px; text-align: left;
  transition: border-color var(--t);
}
.crow:hover { border-color: var(--ink-4); }
.crow .mark {
  width: 34px; height: 34px; border-radius: 9px; flex: 0 0 auto; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-xs); font-weight: 800; color: #fff;
}
.crow .mark img { width: 100%; height: 100%; object-fit: cover; }
.crow .nm { font-size: var(--fs-md); font-weight: 700; letter-spacing: -.01em; }
.crow .sub { font-size: var(--fs-xs); color: var(--ink-3); }
.bars { display: flex; gap: 2px; height: 5px; border-radius: 99px; overflow: hidden; width: 110px; background: var(--paper-2); flex: 0 0 auto; }
.bars i { display: block; height: 100%; }

.feedline { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--rule); font-size: var(--fs-sm); line-height: 1.5; }
.feedline:last-child { border-bottom: 0; }
.feedline .pip { width: 7px; height: 7px; border-radius: 50%; margin-top: 6px; flex: 0 0 auto; }
.feedline .when { font-size: var(--fs-xs); color: var(--ink-4); }

/* ── Clienti ──────────────────────────────────────────── */

.clients { padding: 22px 24px 60px; max-width: 1080px; }
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.client-card {
  display: flex; flex-direction: column; gap: 11px;
  padding: 15px; border: 1px solid var(--rule); border-radius: 11px;
  background: var(--panel); text-align: left;
  transition: border-color var(--t), transform var(--t);
}
.client-card:hover { border-color: var(--ink-4); }
.client-card .top { display: flex; align-items: center; gap: 11px; }
.client-card .mark {
  width: 40px; height: 40px; border-radius: 11px; flex: 0 0 auto; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  font-size: var(--fs-md); font-weight: 800; color: #fff;
}
.client-card .mark img { width: 100%; height: 100%; object-fit: cover; }
.client-card h3 { margin: 0; font-size: var(--fs-lg); font-weight: 700; letter-spacing: -.02em; }
.client-card .sub { font-size: var(--fs-xs); color: var(--ink-3); }
.plat-row { display: flex; gap: 5px; flex-wrap: wrap; }
.plat-chip {

<script>
/* src/js/00-dates.js */
/* ============================================================
   Ideology — date vocabulary

   Months are 'YYYY-MM', days 'YYYY-MM-DD'. Both sortable as
   plain strings, which is why the feed can order itself without
   parsing anything.

   This lives on its own because two separate pages need it: the
   studio app and the client link. The client page must not load
   the editing code, so the only alternative was a second copy of
   this arithmetic — and two copies of a date routine drift.
   ============================================================ */

window.IDE = window.IDE || {};

(function (A) {
  'use strict';

  var MONTH_NAMES = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno',
                     'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
  var DAY_NAMES = ['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'];
  A.MONTH_NAMES = MONTH_NAMES;
  A.DAY_NAMES = DAY_NAMES;

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  A.pad = pad;

  A.monthKeyOf = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  A.todayKey = function () {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  };
  A.thisMonth = function () { return A.monthKeyOf(new Date()); };

  A.monthLabel = function (mk) {
    if (!mk) return '—';
    var p = String(mk).split('-');
    return MONTH_NAMES[(parseInt(p[1], 10) || 1) - 1] + ' ' + p[0];
  };
  A.monthShort = function (mk) { return A.monthLabel(mk).slice(0, 3); };

  A.shiftMonth = function (mk, delta) {
    var p = String(mk).split('-'), y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1 + delta;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + pad(m + 1);
  };

  A.dayLabel = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return parseInt(p[2], 10) + ' ' + MONTH_NAMES[(parseInt(p[1], 10) || 1) - 1].slice(0, 3).toLowerCase();
  };

  /* "14 ottobre 2026" — the long form, for the client link where
     there is room and no ambiguity is worth risking. */
  A.dayLong = function (iso) {
    if (!iso) return '';
    var p = String(iso).split('-');
    return parseInt(p[2], 10) + ' ' +
      MONTH_NAMES[(parseInt(p[1], 10) || 1) - 1].toLowerCase() + ' ' + p[0];
  };

  A.monthOfDay = function (iso) { return String(iso || '').slice(0, 7); };
})(window.IDE);
</script>

      position in an array, because the grid is reorderable.
   2. Relations are id references (post.storyIds), never indices.

  /* Date vocabulary lives in 00-dates.js — shared with the client link. */

  /* ── State ────────────────────────────────────────────── */

      assertShape(S);
      localStorage.setItem(KEY, JSON.stringify(serialize()));

      if (!opts || opts.quiet !== true) A.toast('Salvato');
      A.render();
      return true;
    } catch (e) {

      A.toast('Salvataggio non riuscito: ' + e.message);

    }

  };

      assertShape(data);
      A.hydrate(data);

    }

  /* Documents written before the taxonomies were merged carry `pillars`

  function migrate(data) {
    if (!Array.isArray(data.categories)) {
      var cats = [];
      (data.pillars || []).forEach(function (p) { cats.push({ id: p.id, clientId: p.clientId, name: p.name, color: p.color, description: p.description || '' }); });
      (data.formats || []).forEach(function (f) {
        var dup = cats.some(function (c) { return c.clientId === f.clientId && c.name.toLowerCase() === f.name.toLowerCase(); });
        if (!dup) cats.push({ id: f.id, clientId: f.clientId, name: f.name, color: f.color, description: f.description || '' });
      });
      data.categories = cats;
    }
    (data.posts || []).forEach(function (p) {
      if (p.categoryId === undefined) p.categoryId = p.pillarId || p.formatId || '';
      if (p.paid === undefined) p.paid = (p.promo === 'sponsorizzato') || !!p.sponsored;
      if (p.partner === undefined) p.partner = '';
      if (p.videoName === undefined) p.videoName = '';

      if (p.inStories === undefined) p.inStories = false;
      if (p.time === undefined) p.time = '';

    S.v = data.v || 1;

    S.clients.forEach(function (c) {
      if (!c.status) c.status = 'attivo';
      if (!c.slug) c.slug = A.slugify(c.name);
      if (!c.shareToken) c.shareToken = A.newToken();
      if (!c.goals) c.goals = { post: 12, reel: 4, stories: 20, ugc: 8 };
      c.palette = Object.assign({ bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C', alt: '#6E6256' }, c.palette || {});

  /* ── Indexes ──────────────────────────────────────────── */

  var IX = { byId: {}, accounts: {} };

    return S.ugcSlots.filter(function (u) { return u.accountId === accountId && A.monthOfDay(u.date) === month; })

      st.month = p.month;
      st.date = p.date;

    S.ugcSlots = S.ugcSlots.filter(function (u) {
      var empty = u.accountId === A.ui.accountId &&
        A.monthOfDay(u.date) === A.ui.month &&
        !u.brief.trim() && !u.creatorId && !u.note.trim() && u.status === 'idea';
      if (empty) removed.push(u);
      return !empty;
    });
    A.commit();
    A.toast((before - S.ugcSlots.length) + ' slot vuoti rimossi', {
      undo: function () { removed.forEach(function (u) { S.ugcSlots.push(u); }); A.commit(); }
    });
  };

  A.addCreator = function (clientId, data) {
    var c = Object.assign({
      id: A.uid('cr'), clientId: clientId,
      name: '', handle: '', followers: 0, fee: 0, status: 'contattato', note: ''
    }, data || {});
    S.creators.push(c);
    A.commit();
    return c;
  };

  A.deleteCreator = function (id) {
    S.creators = S.creators.filter(function (c) { return c.id !== id; });
    S.ugcSlots.forEach(function (u) { if (u.creatorId === id) u.creatorId = ''; });
    A.commit();
  };

  /* ── Mutations: clients, accounts, taxonomy ───────────
     Deleting anything that owns content removes that content
     explicitly and clears every reference to it. Nothing is
     left pointing at a record that no longer exists.
  ──────────────────────────────────────────────────────── */

  A.slugify = function (name) {
    return String(name || '').toLowerCase()
      .replace(/[àáâãä]/g, 'a').replace(/[èéêë]/g, 'e').replace(/[ìíîï]/g, 'i')
      .replace(/[òóôõö]/g, 'o').replace(/[ùúûü]/g, 'u').replace(/[ç]/g, 'c')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  };

  /* The client link points at a different page. Building it in one
     place keeps the studio from ever handing out a URL that lands on
     the studio itself. */
  A.clientUrl = function (cl) {
    /* Resolved by the browser against this page, exactly as an
       <a href="cliente.html"> would be — string surgery on the path
       guesses wrong as soon as the host serves the page from a URL
       that does not end in a file name. */
    return new URL('cliente.html?c=' + encodeURIComponent(cl.shareToken), document.baseURI).href;
  };

  A.newToken = function () {
    if (window.crypto && window.crypto.getRandomValues) {
      var b = new Uint8Array(8);
      window.crypto.getRandomValues(b);
      return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    }
    return (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)).slice(0, 16);
  };

  A.MARK_COLORS = ['#9A5B3C', '#4F5E4A', '#3F4F6B', '#6E4C57', '#7A6420', '#3D5B58'];
  A.markColor = function (id) {
    var h = 0, str = String(id);
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return A.MARK_COLORS[h % A.MARK_COLORS.length];
  };

  A.addClient = function (name, platform, handle) {
    var cl = {
      id: A.uid('cl'),
      name: name || 'Nuovo cliente',
      slug: A.slugify(name || 'nuovo-cliente'),
      shareToken: A.newToken(),
      status: 'attivo',
      note: '',
      goals: { post: 12, reel: 4, stories: 20, ugc: 8 },
      palette: { bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C', alt: '#6E6256' },
      accounts: [{
        id: A.uid('ac'),
        handle: handle || '@' + A.slugify(name || 'account'),
        platform: platform || 'Instagram',
        ratio: '', bio: '', followers: 0, following: 0, avatarUrl: ''
      }]
    };
    S.clients.push(cl);
    A.commit({ render: false });
    return cl;
  };

  A.updateClient = function (id, patch) {
    var cl = A.get(id);
    if (!cl) return;
    if (patch.name && patch.name !== cl.name && !cl.slugLocked) patch.slug = A.slugify(patch.name);
    Object.assign(cl, patch);
    A.commit();
  };

  /* Removing a client removes everything that belongs to it: its posts,
     stories, highlights, UGC slots, creators and categories. No post is
     left pointing at a category that went away with its client. */
  A.deleteClient = function (id) {
    var cl = A.get(id);
    if (!cl) return;
    var accIds = {};
    (cl.accounts || []).forEach(function (a) { accIds[a.id] = 1; });
    S.posts = S.posts.filter(function (p) { return !accIds[p.accountId]; });
    S.posts.forEach(function (p) {
      if (p.alsoOn) p.alsoOn = p.alsoOn.filter(function (id) { return !accIds[id]; });
    });
    S.stories = S.stories.filter(function (s2) { return !accIds[s2.accountId]; });
    S.highlights = S.highlights.filter(function (h) { return !accIds[h.accountId]; });
    S.ugcSlots = S.ugcSlots.filter(function (u) { return !accIds[u.accountId]; });
    S.creators = S.creators.filter(function (c) { return c.clientId !== id; });
    S.categories = S.categories.filter(function (c) { return c.clientId !== id; });
    S.clients = S.clients.filter(function (c) { return c.id !== id; });
    if (A.ui.clientId === id) { A.ui.clientId = null; A.ui.accountId = null; }
    if (A.ui.clientDetailId === id) A.ui.clientDetailId = null;
    A.commit();
  };

  A.addAccount = function (clientId, platform, handle) {
    var cl = A.get(clientId);
    if (!cl) return null;
    var acc = {
      id: A.uid('ac'),
      handle: handle || '@' + (cl.slug || A.slugify(cl.name)),
      platform: platform || 'Instagram',
      ratio: '', bio: '', followers: 0, following: 0, avatarUrl: ''
    };
    cl.accounts.push(acc);
    A.commit();
    return acc;
  };

  A.countAccountContent = function (accountId) {
    return {
      posts: S.posts.filter(function (p) { return p.accountId === accountId; }).length,
      stories: S.stories.filter(function (s2) { return s2.accountId === accountId; }).length,
      ugc: S.ugcSlots.filter(function (u) { return u.accountId === accountId; }).length
    };
  };

  A.deleteAccount = function (clientId, accountId) {
    var cl = A.get(clientId);
    if (!cl) return;
    cl.accounts = cl.accounts.filter(function (a) { return a.id !== accountId; });
    S.posts = S.posts.filter(function (p) { return p.accountId !== accountId; });
    S.posts.forEach(function (p) {
      if (p.alsoOn) p.alsoOn = p.alsoOn.filter(function (id) { return id !== accountId; });
    });
    S.stories = S.stories.filter(function (s2) { return s2.accountId !== accountId; });
    S.highlights = S.highlights.filter(function (h) { return h.accountId !== accountId; });
    S.ugcSlots = S.ugcSlots.filter(function (u) { return u.accountId !== accountId; });
    if (A.ui.accountId === accountId) A.ui.accountId = cl.accounts[0] ? cl.accounts[0].id : null;
    A.commit();
  };

  /* One classification list per client, defined by the client. Different
     studios and different clients cut their content differently, so the
     names are theirs; the product only guarantees there is exactly one
     axis, which is why it fits in a single corner of the card. */
  A.addCategory = function (clientId, name) {
    var used = A.categoriesOf(clientId).length;
    var c = {
      id: A.uid('cat'), clientId: clientId,
      name: name || 'Nuova categoria',
      color: A.MARK_COLORS[used % A.MARK_COLORS.length],
      description: ''
    };
    S.categories.push(c);
    A.commit();
    return c;
  };

  A.deleteCategory = function (id) {
    S.categories = S.categories.filter(function (r) { return r.id !== id; });
    S.posts.forEach(function (p) { if (p.categoryId === id) p.categoryId = ''; });
    A.ui.filters.categoryId = (A.ui.filters.categoryId || []).filter(function (x) { return x !== id; });
    A.commit();
  };

  A.usageOfCategory = function (id) {
    return S.posts.filter(function (p) { return p.categoryId === id; }).length;
  };

  /* Progress of one account against the client's monthly commitments. */
  A.progressOf = function (accountId, month, clientId) {
    var cl = A.get(clientId);
    var goals = (cl && cl.goals) || {};
    var posts = A.postsIn(accountId, month);
    var done = {
      post: posts.filter(function (p) { return p.kind !== 'reel'; }).length,
      reel: posts.filter(function (p) { return p.kind === 'reel'; }).length,
      stories: A.storiesIn(accountId, month).length,
      ugc: A.ugcIn(accountId, month).length
    };
    return A.GOALS.map(function (g) {
      return { key: g.key, label: g.label, done: done[g.key] || 0, goal: Number(goals[g.key]) || 0 };
    });
  };

  /* Everything that happened across the studio, newest first. */
  A.recentActivity = function (limit) {
    var out = [];
    S.posts.forEach(function (p) {
      (p.history || []).forEach(function (h) {
        out.push({ at: h.at, by: h.by, to: h.to, note: h.note, postId: p.id, accountId: p.accountId });
      });
    });
    out.sort(function (a, b) { return (b.at || '').localeCompare(a.at || ''); });
    return out.slice(0, limit || 8);
  };

  /* ── Export / import — full fidelity, no field whitelist ── */

  A.exportAll = function () {
    var payload = serialize();
    payload.exportedBy = 'Ideology Content';
    A.download('ideology-contenuti-' + A.todayKey() + '.json', JSON.stringify(payload, null, 2));
    A.toast('Backup esportato');
  };

  A.importAll = function (text) {
    var data = migrate(JSON.parse(text));
    assertShape(data);
    A.hydrate(data);
    var c = S.clients[0];
    A.ui.clientId = c ? c.id : null;
    A.ui.accountId = c && c.accounts[0] ? c.accounts[0].id : null;
    A.ui.selectedPostId = null;
    A.save({ quiet: true });
  };

  A.resetAll = function () {
    try { localStorage.removeItem(KEY); } catch (e) {}
    A.seed();
    A.save({ quiet: true });
  };

  /* A dialog edits the live record so the grid behind it updates as you
     type, and keeps a snapshot so Annulla can put it back exactly. */
  A.snap = function (rec) { return JSON.stringify(rec); };
  A.restore = function (rec, snapshot) {
    if (!rec || !snapshot) return;
    var was = JSON.parse(snapshot);
    Object.keys(rec).forEach(function (k) { delete rec[k]; });
    Object.keys(was).forEach(function (k) { rec[k] = was[k]; });
  };
})(window.IDE);
</script>
<script>
/* src/js/03-seed.js */
/* ============================================================
   Ideology — demo data + offline imagery

   The tool never fetches an image from the network: media is
   either uploaded by the user (downscaled to a data URL) or,
   for the demo content, drawn as a deterministic SVG from the
   post's own id. So the grid reads as a real feed with nothing
   to load and nothing to break.
   ============================================================ */

(function (A) {
  'use strict';

  var PALETTES = [
    ['#C9B9A6', '#7E6B59', '#F2ECE4'],
    ['#A9B7A0', '#4F5E4A', '#EEF1E9'],
    ['#C2A8AE', '#6E4C57', '#F4EBED'],
    ['#A3B1C6', '#3F4F6B', '#EAEEF5'],
    ['#D6C06A', '#7A6420', '#F7F1DD'],
    ['#B8A6C9', '#55436B', '#F0EAF5'],
    ['#CDA18A', '#7A4A34', '#F6E8E0'],
    ['#9FB8B5', '#3D5B58', '#E7F0EF']
  ];

  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h;
  }

  /* Deterministic abstract visual — same seed always gives the same image. */
  A.mockImage = function (seed, w, h) {
    w = w || 400; h = h || 500;
    var n = hash(String(seed));
    var pal = PALETTES[n % PALETTES.length];
    var variant = (n >> 5) % 6;
    var a = pal[0], b = pal[1], c = pal[2];
    var r1 = ((n >> 11) % 60) / 100 + .2;
    var r2 = ((n >> 17) % 50) / 100 + .25;
    var body = '';

    if (variant === 0) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + c + '"/>' +
        '<circle cx="' + (w * r1) + '" cy="' + (h * .42) + '" r="' + (w * .36) + '" fill="' + a + '"/>' +
        '<rect y="' + (h * .68) + '" width="' + w + '" height="' + (h * .32) + '" fill="' + b + '"/>';
    } else if (variant === 1) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + a + '"/>' +
        '<path d="M0 ' + (h * r1) + ' L' + w + ' ' + (h * (r1 - .22)) + ' L' + w + ' ' + (h * (r1 + .18)) + ' L0 ' + (h * (r1 + .4)) + 'Z" fill="' + b + '"/>' +
        '<path d="M0 ' + (h * .86) + ' L' + w + ' ' + (h * .74) + ' L' + w + ' ' + h + ' L0 ' + h + 'Z" fill="' + c + '"/>';
    } else if (variant === 2) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + c + '"/>' +
        '<path d="M' + (w * .22) + ' ' + h + ' L' + (w * .22) + ' ' + (h * .45) +
        ' A' + (w * .28) + ' ' + (w * .28) + ' 0 0 1 ' + (w * .78) + ' ' + (h * .45) + ' L' + (w * .78) + ' ' + h + 'Z" fill="' + b + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .58) + '" r="' + (w * .14) + '" fill="' + a + '"/>';
    } else if (variant === 3) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + b + '"/>' +
        '<rect x="' + (w * .1) + '" y="' + (h * .12) + '" width="' + (w * .8) + '" height="' + (h * .34) + '" rx="' + (w * .04) + '" fill="' + c + '"/>' +
        '<rect x="' + (w * .1) + '" y="' + (h * .52) + '" width="' + (w * .52) + '" height="' + (h * .3) + '" rx="' + (w * .04) + '" fill="' + a + '"/>';
    } else if (variant === 4) {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + c + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .5) + '" r="' + (w * .46) + '" fill="none" stroke="' + a + '" stroke-width="' + (w * .09) + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .5) + '" r="' + (w * .27) + '" fill="none" stroke="' + b + '" stroke-width="' + (w * .07) + '"/>' +
        '<circle cx="' + (w * .5) + '" cy="' + (h * .5) + '" r="' + (w * .09) + '" fill="' + b + '"/>';
    } else {
      body = '<rect width="' + w + '" height="' + h + '" fill="' + a + '"/>' +
        '<ellipse cx="' + (w * r2) + '" cy="' + (h * .36) + '" rx="' + (w * .42) + '" ry="' + (h * .28) +
        '" fill="' + c + '" transform="rotate(-18 ' + (w * r2) + ' ' + (h * .36) + ')"/>' +
        '<ellipse cx="' + (w * .68) + '" cy="' + (h * .74) + '" rx="' + (w * .34) + '" ry="' + (h * .2) + '" fill="' + b + '"/>';
    }

    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' + body + '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  };

  /* Uploads are downscaled in the browser. A planning tool fills up fast
     with full-resolution exports; 1100px wide is plenty for a grid cell
     and keeps the saved document small enough to survive. */
  A.readImage = function (file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('nessun file'));
      if (!/^image\//.test(file.type)) return reject(new Error('serve un file immagine'));
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('lettura non riuscita')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('immagine non valida')); };
        img.onload = function () {
          var max = 1100;
          var scale = Math.min(1, max / Math.max(img.width, img.height));
          var cv = document.createElement('canvas');
          cv.width = Math.round(img.width * scale);
          cv.height = Math.round(img.height * scale);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          try { resolve(cv.toDataURL('image/jpeg', 0.78)); }
          catch (e) { resolve(fr.result); }
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  };

  /* A video upload is handled differently from an image. A montaggio is
     far too big to live inside the saved document, so we always pull a
     poster frame out of it — that is what the grid needs — and keep the
     clip itself inline only when it is small enough to be harmless. */
  A.VIDEO_INLINE_MAX = 3.5 * 1024 * 1024;

  A.readVideo = function (file) {
    return new Promise(function (resolve, reject) {
      if (!file) return reject(new Error('nessun file'));
      if (!/^video\//.test(file.type)) return reject(new Error('serve un file video'));

      var objUrl = URL.createObjectURL(file);
      var v = document.createElement('video');
      v.preload = 'metadata';
      v.muted = true;
      v.playsInline = true;

      var done = false;
      function finish(poster) {
        if (done) return;
        done = true;
        URL.revokeObjectURL(objUrl);
        var out = { name: file.name, sizeBytes: file.size, poster: poster || '', dataUrl: '' };
        if (file.size <= A.VIDEO_INLINE_MAX) {
          var fr = new FileReader();
          fr.onload = function () { out.dataUrl = fr.result; resolve(out); };
          fr.onerror = function () { resolve(out); };
          fr.readAsDataURL(file);
        } else {
          resolve(out);
        }
      }

      v.addEventListener('error', function () { finish(''); });
      v.addEventListener('loadeddata', function () {
        try { v.currentTime = Math.min(0.6, (v.duration || 1) * 0.1); }
        catch (e) { grab(); }
      });
      v.addEventListener('seeked', grab);

      function grab() {
        try {
          var max = 900;
          var scale = Math.min(1, max / Math.max(v.videoWidth || max, v.videoHeight || max));
          var cv = document.createElement('canvas');
          cv.width = Math.round((v.videoWidth || 720) * scale);
          cv.height = Math.round((v.videoHeight || 1280) * scale);
          cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height);
          finish(cv.toDataURL('image/jpeg', 0.78));
        } catch (e) { finish(''); }

    });

  A.humanSize = function (bytes) {
    var mb = (Number(bytes) || 0) / 1024 / 1024;
    return mb >= 1 ? mb.toFixed(1) + ' MB' : Math.round((Number(bytes) || 0) / 1024) + ' KB';
  };

  /* ── Demo studio ──────────────────────────────────────── */

  A.seed = function () {
    var S = A.S;
    var now = A.thisMonth();
    var prev = A.shiftMonth(now, -1);

    function client(name, slug, accounts) {

          };
        }),

      };

    var ig = forn.accounts[0];
    var tk = forn.accounts[1];

    var demo = [
      { k: 'foto', st: 'pubblicato', pi: pProd, d: 2,
        cap: 'La serie Terra esce dal forno dopo 11 ore a 1240°.\nSmalto a cenere di faggio, ogni pezzo vira in modo diverso.\n\nDisponibile in bottega da sabato.' },
      { k: 'carosello', st: 'pubblicato', pi: pCult, d: 4, slides: 4,
        cap: 'Come riconoscere un pezzo tornito a mano in quattro dettagli.\nSalva il carosello, portalo con te la prossima volta che compri ceramica.' },
      { k: 'reel', st: 'approvato', pi: pDietro, d: 6,
        cap: 'Centrare l\'argilla è il gesto più noioso e il più importante.\nNove secondi, nessun taglio.' },
      { k: 'foto', st: 'approvato', pi: pProd, d: 8, paid: true, t: '18:30',
        cap: 'Tazza Noce, 220 ml.\nFatta per stare in mano, non per stare in vetrina.' },
      { k: 'editoriale', st: 'approvato', pi: pCult, d: 10,
        ed: { eyebrow: 'Cultura materiale', title: 'Una ciotola non è mai finita quando esce dal tornio', sub: 'Essiccazione, prima cottura, smalto, seconda cottura. Tre settimane prima di poterla chiamare oggetto.' },
        cap: 'Quanto tempo serve davvero per una ciotola.\nTre settimane, quattro passaggi, due cotture.' },
      { k: 'reel', st: 'in_revisione', pi: pComm, d: 12, partner: 'Scuola Arti Grafiche',
        cap: 'Il corso del sabato visto dal fondo della stanza.\nOtto persone, due torni, zero esperienza richiesta.',
        clientNote: 'Il reel è bello ma non si capisce che il corso è aperto ai principianti. Potete aggiungere una scritta nei primi secondi?' },

  /* seed-time helper that does not trigger a render */
  A.addCreatorSilent = function (clientId, data) {
    var c = Object.assign({
      id: A.uid('cr'), clientId: clientId, name: '', handle: '',

<script>
/* src/js/04-grid.js */
/* ============================================================
   Ideology — the post renderer

   One function decides how a post looks. The feed, the studio
   preview and the client link all call it. There is deliberately
   no second implementation: in the tool this replaces, the same
   card was drawn three times in two files and the three copies
   had already drifted apart (five approval states in one, two
   in another; carousels playable in one, static in the next).
   ============================================================ */

(function (A) {
  'use strict';

  A.ratioFor = function (accountId) {
    var ctx = A.accountCtx(accountId);
    return A.formatOfAccount(ctx ? ctx.account : null).ratio;
  };

  function kindBadge(post) {
    if (post.kind === 'reel') return { icon: 'play', label: 'Reel' };
    if (post.kind === 'carosello') return { icon: 'layers', label: (post.slides || []).length + ' slide' };
    if (post.kind === 'editoriale') return { icon: 'type', label: 'Testo' };
    return { icon: 'image', label: 'Post' };
  }

  /* The visual inside a cell: uploaded media, a generated editorial card,
     or an explicit empty slot. Never a broken <img>. */
  A.mediaFill = function (post) {
    if (post.kind === 'editoriale') {
      var client = A.clientOfAccount(post.accountId);
      var pal = (client && client.palette) || { bg: '#F2ECE4', ink: '#241E19', accent: '#9A5B3C' };
      var ed = post.editorial || {};
      var box = A.el('div', { class: 'edcard', style: 'background:' + pal.bg + ';color:' + pal.ink + ';' });
      if (ed.eyebrow) box.appendChild(A.el('div', { class: 'eye', text: ed.eyebrow, style: 'color:' + pal.accent }));
      box.appendChild(A.el('div', { class: 'tit', text: ed.title || 'Titolo della card' }));
      box.appendChild(A.el('div', { class: 'rule' }));
      box.appendChild(A.el('div', { class: 'sub', text: ed.sub || '' }));
      return box;
    }
    var url = post.coverUrl || post.mediaUrl ||
      (post.slides && post.slides[0] ? post.slides[0].url : '');
    /* coverUrl wins for every kind: a reel's thumbnail is what the grid,
       the preview and the post view all have to show. */
    if (url) {
      var wrap = A.el('div', { style: 'width:100%;height:100%;' });
      var img = A.el('img', { src: url, alt: '', loading: 'lazy' });
      img.addEventListener('error', function () {
        var host = '';
        try { host = new URL(url, location.href).hostname; } catch (e) { host = ''; }
        A.clear(wrap);
        wrap.appendChild(A.el('div', { class: 'ph' }, [
          (function () { var s = A.el('span'); s.innerHTML = A.icon('link', 18); return s; })(),
          A.el('span', { text: 'Immagine non raggiungibile' }),
          host ? A.el('span', { style: 'opacity:.65;', text: host }) : null
        ]));
      });
      wrap.appendChild(img);
      return wrap;
    }
    return A.el('div', { class: 'ph' }, [
      (function () { var s = A.el('span'); s.innerHTML = A.icon('image', 20); return s; })(),
      'Slot vuoto'
    ]);
  };

  /* A media cell with its overlays. `opts.chrome` picks what the viewer
     is allowed to see: the studio sees state, the client does not see
     internal state names, only an approval ribbon. */
  A.cellNode = function (post, opts) {
    opts = opts || {};
    var cell = A.el('div', {
      class: 'cell',
      style: '--ratio:' + (opts.ratio || A.ratioFor(post.accountId)) + ';',
      role: 'button', tabindex: '0',
      'aria-label': 'Apri contenuto'
    });
    cell.appendChild(A.mediaFill(post));

    /* Four corners, always the same four questions:
       top left  — is it paid or organic
       top right — what kind of content it is
       bottom l. — where it is in the approval flow
       bottom r. — which category it belongs to            */
    if (opts.corners !== false) {
      var nat = A.natureOf(post);
      cell.appendChild(A.el('span', {
        class: 'c-tl ' + nat.cls,
        title: nat.key === 'both' ? 'Contenuto a pagamento, in collaborazione con ' + post.partner : nat.label,
        text: nat.label
      }));

      var kb = kindBadge(post);
      cell.appendChild(A.el('span', {
        class: 'c-tr', html: A.icon(kb.icon, 9) + '<span>' + A.esc(kb.label) + '</span>'
      }));

      if (opts.showState) {
        var st = A.statusOf(post.status);
        cell.appendChild(A.el('button', {
          type: 'button', class: 'c-bl',
          html: '<span class="dot" style="background:' + st.c + '"></span>' + A.esc(st.short) +
                (post.revisions > 0 ? '<span class="rev' + (post.revisions >= 3 ? ' hot' : '') + '">R' + post.revisions + '</span>' : ''),
          title: post.revisions ? post.revisions + ' revisioni richieste · cambia stato' : 'Cambia stato',
          onclick: function (e) { e.stopPropagation(); if (opts.onState) opts.onState(post); }
        }));
      }

      var cat = A.get(post.categoryId);
      if (cat) {
        cell.appendChild(A.el('span', {
          class: 'c-br', title: cat.description || cat.name,
          html: '<span class="dot" style="background:' + cat.color + '"></span>' + A.esc(cat.name)
        }));
      }
    }
    if (opts.onOpen) {
      cell.addEventListener('click', function () { opts.onOpen(post); });
      cell.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); opts.onOpen(post); }
      });
    }
    return cell;
  };

  /* The grid shows two lines of caption. Hovering reads the whole thing in
     place and moving away puts it back: no click, no modal, no state. */
  function captionNode(text) {
    var node = A.el('div', { class: 'card-caption', text: text });
    A.captionPeek({ trigger: node, clamp: node, text: text });
    return node;
  }

  /* Full card for the editing grid. */
  A.postCard = function (post, opts) {
    opts = opts || {};
    var client = A.clientOfAccount(post.accountId);
    var card = A.el('div', {
      class: 'card' + (opts.selected ? ' sel' : ''),
      dataset: { st: post.status, id: post.id }
    });

    card.appendChild(A.cellNode(post, {
      showDate: A.ui.show.date,
      showState: true,
      showRevisions: true,
      draggable: true,
      onOpen: opts.onOpen,
      onState: opts.onState
    }));

    var body = A.el('div', { class: 'card-body' });

    if (A.ui.show.date) {
      var when = post.date
        ? A.dayLabel(post.date) + (post.time ? ' · ' + post.time : '')
        : 'Senza data';
      body.appendChild(A.el('div', {
        class: 'card-when' + (post.date ? '' : ' none'),
        html: A.icon('cal', 11) + '<span>' + A.esc(when) + '</span>'
      }));
    }

    if (A.ui.show.caption && post.caption) {
      body.appendChild(captionNode(post.caption));
    }

    if (post.accountId !== A.ui.accountId) {
      var home = A.accountCtx(post.accountId);
      body.appendChild(A.el('div', {
        class: 'card-from',
        html: A.icon('layers', 11) + '<span>Pubblicato anche da ' + A.esc(home ? home.account.platform : 'un altro account') + '</span>'
      }));
    } else if ((post.alsoOn || []).length) {
      var names = post.alsoOn.map(function (id) {
        var c = A.accountCtx(id);
        return c ? c.account.platform : '';
      }).filter(Boolean);
      body.appendChild(A.el('div', {
        class: 'card-from',
        html: A.icon('layers', 11) + '<span>Anche su ' + A.esc(names.join(', ')) + '</span>'
      }));
    }

    if (post.clientNote) {
      body.appendChild(A.el('div', {
        class: 'pv-note', style: 'margin-top:2px;',
        html: '<b>' + A.esc(client ? client.name : 'Cliente') + '</b>' + A.esc(post.clientNote)
      }));
    }

    if (body.childNodes.length) card.appendChild(body);

    if (opts.onSelect) {
      card.addEventListener('click', function (e) {
        if (e.target.closest('.cell') || e.target.closest('button')) return;
        opts.onSelect(post);
      });
    }

    return card;
  };

  /* ── Post view ────────────────────────────────────────
     How the content reads when someone actually looks at it:
     the media on the left, everything written about it on the
     right. Same component wherever a post is opened.
  ──────────────────────────────────────────────────────── */

  var PV = { list: [], i: 0, slide: 0 };

  A.openPostView = function (list, startId) {
    PV.list = list.slice();
    PV.i = Math.max(0, PV.list.findIndex(function (p) { return p.id === startId; }));
    PV.slide = 0;
    var host = A.$('#lightbox');
    host.classList.add('on', 'as-post');
    drawPV();
  };

  A.closePostView = function () {
    var host = A.$('#lightbox');
    host.classList.remove('on', 'as-post');
    A.clear(host);
    PV.list = [];
  };

  function pvNav(d) {
    if (PV.list.length < 2) return;
    PV.i = (PV.i + d + PV.list.length) % PV.list.length;
    PV.slide = 0;
    drawPV();
  }
  function pvSlide(d) {
    var p = PV.list[PV.i];
    if (!p || !p.slides || p.slides.length < 2) return;
    PV.slide = (PV.slide + d + p.slides.length) % p.slides.length;
    drawPV();
  }

  function fakeActions() {
    var row = A.el('div', { class: 'pvw-actions', 'aria-hidden': 'true' });
    ['heart', 'bubble', 'send'].forEach(function (k) {
      var paths = {
        heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/>',
        bubble: '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 21l2-4a8.4 8.4 0 0 1-1-4 8.4 8.4 0 0 1 9-8.4 8.4 8.4 0 0 1 8 7.4z"/>',
        send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>'
      };
      var sp = A.el('span');
      sp.innerHTML = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + paths[k] + '</svg>';
      row.appendChild(sp);
    });
    return row;
  }

  function drawPV() {
    var host = A.$('#lightbox');
    var p = PV.list[PV.i];
    A.clear(host);
    if (!p) return;

    var ctx = A.accountCtx(A.isOn(p, A.ui.accountId) ? A.ui.accountId : p.accountId) || A.accountCtx(p.accountId);
    var acc = ctx ? ctx.account : null;
    var client = ctx ? ctx.client : null;
    var fmt = A.formatOfAccount(acc);

    var shell = A.el('div', { class: 'pvw', role: 'dialog', 'aria-modal': 'true' });

    /* media */
    var media = A.el('div', { class: 'pvw-media' });
    var inner = A.el('div', { class: 'pvw-stage', style: '--ratio:' + fmt.ratio + ';' });
    var isCar = p.kind === 'carosello' && p.slides && p.slides.length > 1;
    if (isCar) {
      var sl = p.slides[PV.slide];
      if (sl && sl.url) inner.appendChild(A.el('img', { src: sl.url, alt: '' }));
      else inner.appendChild(A.el('div', { class: 'pvw-blank', text: 'Slide ' + (PV.slide + 1) + ' senza immagine' }));
    } else {
      var playable = p.kind === 'reel' && p.mediaUrl && /^(data:video|blob:|https?:\/\/.+\.(mp4|webm|mov))/i.test(p.mediaUrl);
      if (playable) {
        inner.appendChild(A.el('video', {
          src: p.mediaUrl, controls: true, playsinline: true,
          poster: p.coverUrl || '', preload: 'metadata',
          style: 'width:100%;height:100%;object-fit:contain;background:#000;'
        }));
      } else {
        var fill = A.mediaFill(p);
        if (p.kind === 'editoriale') {
          var box = A.el('div', { style: 'position:relative;width:100%;height:100%;' });
          box.appendChild(fill);
          inner.appendChild(box);
        } else inner.appendChild(fill);
        if (p.kind === 'reel') inner.appendChild(A.el('span', { class: 'pvw-play', html: A.icon('play', 22) }));
      }
    }
    if (isCar) {
      inner.appendChild(A.el('button', { class: 'pvw-arrow left', html: '‹', 'aria-label': 'Slide precedente', onclick: function () { pvSlide(-1); } }));
      inner.appendChild(A.el('button', { class: 'pvw-arrow right', html: '›', 'aria-label': 'Slide successiva', onclick: function () { pvSlide(1); } }));
      var dots = A.el('div', { class: 'pvw-dots' });
      p.slides.forEach(function (_, i) { dots.appendChild(A.el('i', { class: i === PV.slide ? 'on' : '' })); });
      inner.appendChild(dots);
    }
    media.appendChild(inner);
    media.appendChild(A.el('span', { class: 'pvw-size', text: acc ? acc.platform + ' · ' + fmt.sizeLabel + ' · ' + fmt.w + '×' + fmt.h : '' }));
    shell.appendChild(media);

    /* side */
    var side = A.el('div', { class: 'pvw-side' });

    var head = A.el('div', { class: 'pvw-head' });
    var av = A.el('span', { class: 'pvw-av' });
    if (acc && acc.avatarUrl) av.appendChild(A.el('img', { src: acc.avatarUrl, alt: '' }));
    else av.textContent = A.initials(client ? client.name : '?');
    head.appendChild(av);
    head.appendChild(A.el('span', { style: 'flex:1 1 auto;min-width:0;' }, [
      A.el('span', { class: 'hn', text: acc ? acc.handle : '' }),
      A.el('span', { class: 'hs', text: (acc ? acc.platform : '') + (p.date ? ' · ' + A.dayLabel(p.date) + (p.time ? ' ' + p.time : '') : ' · senza data') })
    ]));
    head.appendChild(A.el('button', { class: 'btn ghost icon sm', 'aria-label': 'Chiudi', html: A.icon('x', 15), onclick: A.closePostView }));
    side.appendChild(head);

    var scroll = A.el('div', { class: 'pvw-scroll' });

    var chips = A.el('div', { class: 'pvw-chips' });
    var nat = A.natureOf(p);
    if (p.paid) chips.appendChild(A.el('span', { class: 'tagpill promo-paid', text: 'Sponsorizzato' }));
    if ((p.partner || '').trim()) chips.appendChild(A.el('span', { class: 'tagpill promo-partner', text: 'Con ' + p.partner }));
    var cat = A.get(p.categoryId);
    if (cat) chips.appendChild(A.el('span', { class: 'tagpill', html: '<span class="dot" style="background:' + cat.color + '"></span>' + A.esc(cat.name) }));
    chips.appendChild(A.el('span', { class: 'tagpill', text: p.kind === 'reel' ? 'Reel' : p.kind === 'carosello' ? 'Carosello · ' + p.slides.length : p.kind === 'editoriale' ? 'Card testuale' : 'Post' }));
    if (chips.childNodes.length) scroll.appendChild(chips);

    if (p.caption) {
      scroll.appendChild(A.el('div', { class: 'pvw-caption' }, [
        A.el('b', { text: acc ? acc.handle + ' ' : '' }),
        A.el('span', { text: p.caption })
      ]));
    } else {
      scroll.appendChild(A.el('div', { class: 'pvw-caption empty', text: 'Nessuna caption scritta.' }));
    }

    if ((p.alsoOn || []).length) {
      var names = p.alsoOn.map(function (id) { var c = A.accountCtx(id); return c ? c.account.platform + ' ' + c.account.handle : ''; }).filter(Boolean);
      scroll.appendChild(A.el('div', { class: 'pvw-note', html: '<b>Pubblicato anche su</b>' + A.esc(names.join(' · ')) }));
    }
    if (p.inStories) scroll.appendChild(A.el('div', { class: 'pvw-note', html: '<b>Stories</b>Questo contenuto esce anche nelle stories.' }));
    if (p.clientNote) scroll.appendChild(A.el('div', { class: 'pv-note', html: '<b>' + A.esc(client ? client.name : 'Cliente') + '</b>' + A.esc(p.clientNote) }));
